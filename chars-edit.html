<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID — Редактор тир-листов персонажей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0a0c;
  --bg2:      #0f0f12;
  --surface:  #111114;
  --surface2: #1a1a1f;
  --border:   #222228;
  --border2:  #333338;
  --red:      #8b1a1a;
  --red-hi:   #c0392b;
  --red-dim:  #5a1010;
  --text:     #b8b0a8;
  --text-dim: #4a4540;
  --text-hi:  #f0ece6;
  --green-hi: #6ab87a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', serif; min-height: 100vh; }

header { text-align: center; padding: 2.5rem 1rem 2rem; border-bottom: 1px solid var(--border); position: relative; }
header::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--red-dim) 20%, var(--red) 50%, var(--red-dim) 80%, transparent); }
.logo { font-family: 'Playfair Display', serif; font-weight: 900; font-style: italic;
  font-size: clamp(2.2rem, 6vw, 3.5rem); color: var(--text-hi); letter-spacing: .04em; text-decoration: none; display: block; }
.header-sub { font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .3em;
  text-transform: uppercase; color: var(--text-dim); margin-top: .5rem; }

main { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 6rem; display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
@media (max-width: 800px) { main { grid-template-columns: 1fr; } }

/* ── Левая панель — выбор тайтла ── */
.sidebar { display: flex; flex-direction: column; gap: 1rem; }

.section-label {
  font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .15em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: .4rem;
}

.title-list { display: flex; flex-direction: column; gap: .35rem; }

.title-item {
  display: flex; align-items: center; gap: .6rem;
  padding: .55rem .75rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 2px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.title-item:hover { border-color: var(--border2); }
.title-item.active { border-color: var(--red-dim); background: var(--surface2); }
.title-item-cover { width: 32px; height: 48px; object-fit: cover; border-radius: 1px; flex-shrink: 0; background: var(--surface2); }
.title-item-name { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; color: var(--text-hi); flex: 1; line-height: 1.3; }
.title-item-del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .8rem; padding: .2rem; transition: color .15s; flex-shrink: 0; }
.title-item-del:hover { color: var(--red-hi); }

/* Форма нового тайтла */
.new-title-form { display: flex; flex-direction: column; gap: .5rem; padding: .85rem; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; }
.new-title-form.hidden { display: none; }

/* ── Правая панель — редактор ── */
.editor { display: flex; flex-direction: column; gap: 1.5rem; }

.editor-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.editor-title { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: 1.3rem; color: var(--text-hi); }

/* Переключатель тир-листов */
.list-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
.list-tab { font-family: 'DM Sans', sans-serif; font-size: .62rem; font-weight: 500; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border);
  border-radius: 1px; padding: .3rem .75rem; cursor: pointer; transition: all .15s; }
.list-tab:hover { color: var(--text); border-color: var(--border2); }
.list-tab.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }
.list-tab-add { color: var(--text-dim); border-style: dashed; }
.list-tab-add:hover { color: var(--green-hi); border-color: var(--green-hi); }

/* Тир-ряды */
.tl-editor-rows { display: flex; flex-direction: column; gap: .6rem; }

.tl-editor-row {
  display: flex; align-items: stretch;
  border: 1px solid var(--border); border-radius: 2px; overflow: visible;
  position: relative; min-height: 90px;
}
.tl-editor-row::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--tl-color, var(--red-dim)); opacity: .6;
}

.tl-editor-label {
  width: 100px; flex-shrink: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: .75rem .5rem;
  border-right: 1px solid var(--border); background: var(--surface); gap: .3rem; position: relative;
}
.tl-editor-label::after { content: ''; position: absolute; inset: 0; background: var(--tl-color, #888); opacity: .05; pointer-events: none; }
.tl-label-dot { width: 5px; height: 5px; border-radius: 1px; transform: rotate(45deg); background: var(--tl-color, var(--red)); flex-shrink: 0; }
.tl-label-input {
  font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic; font-size: .85rem;
  color: var(--tl-color, var(--text-hi)); text-align: center; background: none; border: none;
  outline: none; width: 100%; cursor: pointer; line-height: 1.2; padding: 0;
}
.tl-label-input:focus { background: rgba(255,255,255,.04); border-radius: 2px; }
.tl-color-input { width: 20px; height: 20px; border: 1px solid var(--border2); border-radius: 2px; padding: 0; cursor: pointer; background: none; }

/* Зона карточек — drag & drop */
.tl-editor-cards {
  flex: 1; display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem;
  background: var(--surface); align-content: flex-start; min-height: 90px;
  position: relative;
}
.tl-editor-cards.drag-over { background: rgba(139,26,26,.06); }

/* Карточка персонажа */
.char-card {
  width: 72px; flex-shrink: 0; position: relative; cursor: grab;
  border-radius: 1px; overflow: hidden; border: 1px solid var(--border);
  transition: border-color .15s, transform .15s; background: var(--surface2);
  animation: fadeUp .2s ease both;
}
.char-card:active { cursor: grabbing; }
.char-card.dragging { opacity: .3; }
.char-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; filter: brightness(.85); pointer-events: none; }
.char-card-name { font-family: 'DM Sans', sans-serif; font-size: .52rem; color: var(--text); padding: .2rem .3rem; text-align: center; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.char-card-del { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: rgba(10,10,12,.85); border: none; color: var(--text-dim); font-size: .65rem; cursor: pointer;
  display: none; align-items: center; justify-content: center; line-height: 1; padding: 0; transition: color .15s; }
.char-card:hover .char-card-del { display: flex; }
.char-card-del:hover { color: var(--red-hi); }

/* Кнопка добавить персонажа */
.add-char-btn {
  width: 72px; height: 108px; flex-shrink: 0; border: 1px dashed var(--border2);
  border-radius: 1px; background: none; color: var(--text-dim); cursor: pointer;
  font-size: 1.2rem; transition: border-color .15s, color .15s; display: flex; align-items: center; justify-content: center;
}
.add-char-btn:hover { border-color: var(--red-dim); color: var(--red-hi); }

/* Кнопка удалить тир */
.tl-row-del { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text-dim); font-size: .6rem;
  cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 5; transition: all .15s; }
.tl-editor-row:hover .tl-row-del { display: flex; }
.tl-row-del:hover { border-color: var(--red); color: var(--red-hi); }

/* Модальное окно добавления персонажа */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface); border: 1px solid var(--border2); border-radius: 2px;
  padding: 1.75rem; width: 100%; max-width: 420px; position: relative;
}
.modal-title { font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
  font-size: 1.1rem; color: var(--text-hi); margin-bottom: 1.25rem; }
.modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none;
  color: var(--text-dim); cursor: pointer; font-size: 1.1rem; transition: color .15s; }
.modal-close:hover { color: var(--text-hi); }

/* Общие инпуты */
.field { margin-bottom: .85rem; }
.field label { font-family: 'DM Sans', sans-serif; font-size: .62rem; color: var(--text-dim);
  letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: .35rem; }
.field input { width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 2px; padding: .6rem .8rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; outline: none; transition: border-color .2s; }
.field input:focus { border-color: var(--red); }
.field input::placeholder { color: var(--text-dim); }

.img-preview { width: 60px; height: 90px; object-fit: cover; border-radius: 1px; border: 1px solid var(--border2); margin-top: .5rem; display: none; }

/* Кнопки */
.btn { font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 500; letter-spacing: .06em;
  text-transform: uppercase; padding: .5rem 1.1rem; border-radius: 2px; cursor: pointer; transition: all .15s; border: 1px solid; }
.btn-primary { background: rgba(139,26,26,.12); border-color: rgba(139,26,26,.35); color: var(--text-hi); }
.btn-primary:hover { background: rgba(139,26,26,.22); border-color: var(--red); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.btn-ghost { background: none; border-color: var(--border2); color: var(--text-dim); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); }
.btn-green { background: rgba(106,184,122,.08); border-color: rgba(106,184,122,.3); color: var(--green-hi); }
.btn-green:hover { background: rgba(106,184,122,.18); border-color: var(--green-hi); }
.btn-green:disabled { opacity: .4; cursor: not-allowed; }
.btn-dashed { background: none; border-style: dashed; border-color: var(--border2); color: var(--text-dim); }
.btn-dashed:hover { border-color: var(--green-hi); color: var(--green-hi); }

/* Нижняя панель сохранения */
.save-bar { display: flex; align-items: center; gap: 1rem; padding: 1.25rem 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
.status-msg { font-family: 'DM Sans', sans-serif; font-size: .75rem; }
.status-msg.ok  { color: var(--green-hi); }
.status-msg.err { color: #d88; }

.add-tier-row { display: flex; align-items: center; gap: .5rem; padding: .6rem; border: 1px dashed var(--border2); border-radius: 2px; flex-wrap: wrap; }
.add-tier-row input { flex: 1; min-width: 120px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.state-box { text-align: center; padding: 3rem; color: var(--text-dim); font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-style: italic; }

.editor-empty { text-align: center; padding: 4rem 2rem; color: var(--text-dim); font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic; border: 1px dashed var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="header-sub">Редактор тир-листов персонажей</div>
  <a href="/" class="logo">TasteID</a>
</header>

<main>
  <!-- ── Левая панель ── -->
  <aside class="sidebar">
    <div>
      <div class="section-label">Тайтлы</div>
      <div class="title-list" id="title-list"></div>
    </div>

    <div class="new-title-form hidden" id="new-title-form">
      <div class="field">
        <label>Название тайтла *</label>
        <input type="text" id="nt-name" placeholder="Reverse: 1999">
      </div>
      <div class="field">
        <label>ID (латиница, без пробелов) *</label>
        <input type="text" id="nt-id" placeholder="reverse1999">
      </div>
      <div class="field">
        <label>Обложка (URL)</label>
        <input type="text" id="nt-cover" placeholder="https://...">
      </div>
      <div style="display:flex;gap:.5rem">
        <button class="btn btn-primary" onclick="addTitle()">Добавить</button>
        <button class="btn btn-ghost" onclick="toggleNewTitleForm(false)">Отмена</button>
      </div>
    </div>

    <button class="btn btn-dashed" id="btn-add-title" onclick="toggleNewTitleForm(true)">+ Новый тайтл</button>
  </aside>

  <!-- ── Правая панель ── -->
  <div class="editor" id="editor">
    <div class="editor-empty">Выбери тайтл слева или создай новый</div>
  </div>
</main>

<!-- ── Модалка добавления персонажа ── -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">Добавить персонажа</div>
    <div class="field">
      <label>Имя *</label>
      <input type="text" id="m-name" placeholder="Хэарон">
    </div>
    <div class="field">
      <label>Картинка (URL)</label>
      <input type="text" id="m-img" placeholder="https://deqerrti.github.io/chars/reverse/chaeron.png" oninput="previewModalImg(this.value)">
      <img id="m-img-preview" class="img-preview">
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.5rem">
      <button class="btn btn-primary" id="m-btn-add" onclick="confirmAddChar()">Добавить</button>
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
    </div>
  </div>
</div>

<script>
// ══ СОСТОЯНИЕ ══════════════════════════════════
let data        = [];   // весь characters-tier.json
let activeId    = null; // id выбранного тайтла
let activeListId = null; // id выбранного тир-листа
let pendingTier = null; // { titleId, listId, tierIdx } — куда добавляем персонажа
let dragSrc     = null; // { titleId, listId, tierIdx, charIdx }

// ══ ЗАГРУЗКА ═══════════════════════════════════
async function init() {
  try {
    const res = await fetch("/characters-tier.json?_=" + Date.now());
    if (res.ok) data = await res.json();
    else data = [];
  } catch { data = []; }
  renderSidebar();
  if (data.length) selectTitle(data[0].id);
}

// ══ САЙДБАР ════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById("title-list");
  list.innerHTML = data.map(t => `
    <div class="title-item${t.id === activeId ? " active" : ""}" onclick="selectTitle('${esc(t.id)}')">
      <img class="title-item-cover" src="${esc(t.cover || "")}" alt="" onerror="this.style.display='none'">
      <div class="title-item-name">${esc(t.title)}</div>
      <button class="title-item-del" onclick="deleteTitle(event,'${esc(t.id)}')" title="Удалить">✕</button>
    </div>
  `).join("");
}

function selectTitle(id) {
  activeId = id;
  const title = data.find(t => t.id === id);
  if (title) activeListId = title.tierlists[0]?.id || null;
  renderSidebar();
  renderEditor();
}

function toggleNewTitleForm(show) {
  document.getElementById("new-title-form").classList.toggle("hidden", !show);
  document.getElementById("btn-add-title").style.display = show ? "none" : "";
  if (show) document.getElementById("nt-name").focus();
}

function addTitle() {
  const name  = document.getElementById("nt-name").value.trim();
  const id    = document.getElementById("nt-id").value.trim();
  const cover = document.getElementById("nt-cover").value.trim();
  if (!name || !id) { alert("Заполни название и ID"); return; }
  if (data.find(t => t.id === id)) { alert("Тайтл с таким ID уже существует"); return; }

  data.push({
    id, title: name, cover: cover || "",
    tierlists: [{
      id: id + "-design",
      label: "Дизайн & Впечатление",
      tiers: defaultTiers()
    }]
  });

  document.getElementById("nt-name").value  = "";
  document.getElementById("nt-id").value    = "";
  document.getElementById("nt-cover").value = "";
  toggleNewTitleForm(false);
  selectTitle(id);
}

function deleteTitle(e, id) {
  e.stopPropagation();
  if (!confirm("Удалить тайтл и все его тир-листы?")) return;
  data = data.filter(t => t.id !== id);
  if (activeId === id) { activeId = data[0]?.id || null; activeListId = null; }
  renderSidebar();
  renderEditor();
}

function defaultTiers() {
  return [
    { name: "Резонанс", color: "#7c3aed", chars: [] },
    { name: "Топ",      color: "#2563a8", chars: [] },
    { name: "Хорошо",   color: "#2d8a4e", chars: [] },
    { name: "Средне",   color: "#d4a017", chars: [] },
    { name: "Слабо",    color: "#6b7280", chars: [] },
  ];
}

// ══ РЕДАКТОР ═══════════════════════════════════
function renderEditor() {
  const box = document.getElementById("editor");
  if (!activeId) { box.innerHTML = `<div class="editor-empty">Выбери тайтл слева или создай новый</div>`; return; }

  const title = data.find(t => t.id === activeId);
  if (!title) return;

  if (!activeListId) activeListId = title.tierlists[0]?.id || null;
  const list = title.tierlists.find(l => l.id === activeListId) || title.tierlists[0];

  // Табы тир-листов
  const tabs = title.tierlists.map(l =>
    `<button class="list-tab${l.id === (list?.id) ? " active" : ""}" onclick="selectList('${esc(l.id)}')">${esc(l.label)}</button>`
  ).join("") + `<button class="list-tab list-tab-add" onclick="addList()">+ Список</button>`;

  // Тир-ряды
  const rows = (list?.tiers || []).map((tier, ti) => renderTierRow(title, list, tier, ti)).join("");

  box.innerHTML = `
    <div class="editor-top">
      <div class="editor-title">${esc(title.title)}</div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        ${list ? `<button class="btn btn-ghost" onclick="deleteList('${esc(list.id)}')">Удалить список</button>` : ""}
      </div>
    </div>

    <div class="list-tabs">${tabs}</div>

    <div class="tl-editor-rows" id="tl-editor-rows">${rows}</div>

    <div class="add-tier-row">
      <input type="text" id="new-tier-name" placeholder="Название нового тира" style="background:var(--surface2);border:1px solid var(--border2);border-radius:2px;padding:.5rem .7rem;color:var(--text-hi);font-family:'Cormorant Garamond',serif;font-size:.95rem;outline:none;">
      <input type="color" id="new-tier-color" value="#888888" style="width:32px;height:32px;border:1px solid var(--border2);border-radius:2px;padding:2px;cursor:pointer;background:none;">
      <button class="btn btn-dashed" onclick="addTier()">+ Добавить тир</button>
    </div>

    <div class="save-bar">
      <button class="btn btn-green" id="btn-save" onclick="saveAll()">✦ Сохранить всё</button>
      <span class="status-msg" id="status-msg"></span>
    </div>`;

  bindDragDrop();
}

function renderTierRow(title, list, tier, ti) {
  const chars = tier.chars.map((ch, ci) => `
    <div class="char-card" draggable="true"
      data-title="${esc(title.id)}" data-list="${esc(list.id)}" data-tier="${ti}" data-char="${ci}">
      <img src="${esc(ch.img || "")}" alt="${esc(ch.name)}" onerror="this.src='https://placehold.co/72x108/111114/4a4540?text=?'">
      <div class="char-card-name">${esc(ch.name)}</div>
      <button class="char-card-del" onclick="deleteChar('${esc(title.id)}','${esc(list.id)}',${ti},${ci})">✕</button>
    </div>
  `).join("");

  return `
    <div class="tl-editor-row" style="--tl-color:${esc(tier.color)}">
      <button class="tl-row-del" onclick="deleteTier('${esc(list.id)}',${ti})">✕</button>
      <div class="tl-editor-label">
        <div class="tl-label-dot"></div>
        <input class="tl-label-input" type="text" value="${esc(tier.name)}"
          style="color:${esc(tier.color)}"
          onchange="renameTier('${esc(list.id)}',${ti},this.value)"
          title="Нажми для редактирования названия">
        <input class="tl-color-input" type="color" value="${esc(tier.color)}"
          oninput="recolorTier('${esc(list.id)}',${ti},this.value)"
          title="Цвет тира">
      </div>
      <div class="tl-editor-cards" data-title="${esc(title.id)}" data-list="${esc(list.id)}" data-tier="${ti}">
        ${chars}
        <button class="add-char-btn" onclick="openModal('${esc(title.id)}','${esc(list.id)}',${ti})">+</button>
      </div>
    </div>`;
}

// ══ ТИР-ЛИСТЫ ══════════════════════════════════
function selectList(id) {
  activeListId = id;
  renderEditor();
}

function addList() {
  const label = prompt("Название нового тир-листа:");
  if (!label) return;
  const title = data.find(t => t.id === activeId);
  const id    = activeId + "-" + Date.now();
  title.tierlists.push({ id, label, tiers: defaultTiers() });
  activeListId = id;
  renderEditor();
}

function deleteList(listId) {
  if (!confirm("Удалить этот тир-лист?")) return;
  const title = data.find(t => t.id === activeId);
  title.tierlists = title.tierlists.filter(l => l.id !== listId);
  activeListId = title.tierlists[0]?.id || null;
  renderEditor();
}

// ══ ТИРЫ ═══════════════════════════════════════
function getTier(listId, ti) {
  const title = data.find(t => t.id === activeId);
  const list  = title?.tierlists.find(l => l.id === listId);
  return list?.tiers[ti];
}

function addTier() {
  const name  = document.getElementById("new-tier-name").value.trim();
  const color = document.getElementById("new-tier-color").value;
  if (!name) { alert("Введи название тира"); return; }
  const title = data.find(t => t.id === activeId);
  const list  = title?.tierlists.find(l => l.id === activeListId);
  if (!list) return;
  list.tiers.push({ name, color, chars: [] });
  document.getElementById("new-tier-name").value = "";
  renderEditor();
}

function deleteTier(listId, ti) {
  if (!confirm("Удалить тир? Персонажи в нём тоже удалятся.")) return;
  const title = data.find(t => t.id === activeId);
  const list  = title?.tierlists.find(l => l.id === listId);
  if (!list) return;
  list.tiers.splice(ti, 1);
  renderEditor();
}

function renameTier(listId, ti, val) {
  const tier = getTier(listId, ti);
  if (tier) tier.name = val;
}

function recolorTier(listId, ti, val) {
  const tier = getTier(listId, ti);
  if (!tier) return;
  tier.color = val;
  // Обновляем цвет без полного ре-рендера
  const row = document.querySelectorAll(".tl-editor-row")[ti];
  if (row) {
    row.style.setProperty("--tl-color", val);
    const inp = row.querySelector(".tl-label-input");
    if (inp) inp.style.color = val;
  }
}

// ══ ПЕРСОНАЖИ ══════════════════════════════════
function deleteChar(titleId, listId, ti, ci) {
  const title = data.find(t => t.id === titleId);
  const list  = title?.tierlists.find(l => l.id === listId);
  if (!list) return;
  list.tiers[ti].chars.splice(ci, 1);
  renderEditor();
}

// ══ МОДАЛКА ════════════════════════════════════
function openModal(titleId, listId, ti) {
  pendingTier = { titleId, listId, tierIdx: ti };
  document.getElementById("m-name").value = "";
  document.getElementById("m-img").value  = "";
  document.getElementById("m-img-preview").style.display = "none";
  document.getElementById("modal-overlay").classList.remove("hidden");
  document.getElementById("m-name").focus();
}

function closeModal() {
  document.getElementById("modal-overlay").classList.add("hidden");
  pendingTier = null;
}

function closeModalOnOverlay(e) {
  if (e.target === document.getElementById("modal-overlay")) closeModal();
}

function previewModalImg(url) {
  const img = document.getElementById("m-img-preview");
  if (url && url.startsWith("http")) { img.src = url; img.style.display = "block"; }
  else img.style.display = "none";
}

function confirmAddChar() {
  const name = document.getElementById("m-name").value.trim();
  const img  = document.getElementById("m-img").value.trim();
  if (!name) { alert("Введи имя персонажа"); return; }
  if (!pendingTier) return;

  const { titleId, listId, tierIdx } = pendingTier;
  const title = data.find(t => t.id === titleId);
  const list  = title?.tierlists.find(l => l.id === listId);
  if (!list) return;

  list.tiers[tierIdx].chars.push({ name, img: img || "" });
  closeModal();
  renderEditor();
}

// ══ DRAG & DROP ═════════════════════════════════
function bindDragDrop() {
  document.querySelectorAll(".char-card").forEach(card => {
    card.addEventListener("dragstart", e => {
      dragSrc = {
        titleId: card.dataset.title,
        listId:  card.dataset.list,
        tierIdx: parseInt(card.dataset.tier),
        charIdx: parseInt(card.dataset.char),
      };
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      document.querySelectorAll(".tl-editor-cards").forEach(z => z.classList.remove("drag-over"));
    });
  });

  document.querySelectorAll(".tl-editor-cards").forEach(zone => {
    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("drag-over"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", e => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      if (!dragSrc) return;

      const destTitleId = zone.dataset.title;
      const destListId  = zone.dataset.list;
      const destTierIdx = parseInt(zone.dataset.tier);

      // Убираем из источника
      const srcTitle = data.find(t => t.id === dragSrc.titleId);
      const srcList  = srcTitle?.tierlists.find(l => l.id === dragSrc.listId);
      if (!srcList) return;
      const [moved] = srcList.tiers[dragSrc.tierIdx].chars.splice(dragSrc.charIdx, 1);

      // Добавляем в цель
      const destTitle = data.find(t => t.id === destTitleId);
      const destList  = destTitle?.tierlists.find(l => l.id === destListId);
      if (!destList) { srcList.tiers[dragSrc.tierIdx].chars.splice(dragSrc.charIdx, 0, moved); return; }
      destList.tiers[destTierIdx].chars.push(moved);

      dragSrc = null;
      renderEditor();
    });
  });
}

// ══ СОХРАНЕНИЕ ══════════════════════════════════
async function saveAll() {
  const btn    = document.getElementById("btn-save");
  const status = document.getElementById("status-msg");
  btn.disabled = true;
  btn.textContent = "Сохраняем…";
  status.className = "status-msg";
  status.textContent = "";

  try {
    const res = await fetch("/api/save-chars-tier", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(data),
    });
    const resp = await res.json();
    if (res.ok) {
      status.className = "status-msg ok";
      status.textContent = "✦ Сохранено. Сайт обновится через ~30 секунд.";
    } else {
      status.className = "status-msg err";
      status.textContent = "Ошибка: " + (resp.error || "неизвестная");
    }
  } catch (e) {
    status.className = "status-msg err";
    status.textContent = "Ошибка сети: " + e.message;
  }

  btn.disabled = false;
  btn.textContent = "✦ Сохранить всё";
}

// ══ УТИЛИТЫ ════════════════════════════════════
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Enter в модалке
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if (e.key === "Enter" && !document.getElementById("modal-overlay").classList.contains("hidden")) {
    confirmAddChar();
  }
});

init();
</script>
