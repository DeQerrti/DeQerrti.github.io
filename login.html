<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID — Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0a0c;
  --bg2:      #0f0f12;
  --surface:  #111114;
  --surface2: #1a1a1f;
  --border:   #222228;
  --border2:  #333338;

  --red:      #8b1a1a;
  --red-hi:   #c0392b;
  --red-dim:  #5a1010;

  --text:     #b8b0a8;
  --text-dim: #4a4540;
  --text-hi:  #f0ece6;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

/* ══ LOGO AREA ═══════════════════════════════════ */
.logo-area {
  text-align: center;
  margin-bottom: 2.5rem;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(2.5rem, 8vw, 4rem);
  color: var(--text-hi);
  letter-spacing: .04em;
  line-height: 1;
}
.logo-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: .6rem;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: .6rem;
}

/* декоративная линия */
.deco {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  margin-top: 1rem;
}
.deco span {
  width: 4px; height: 4px;
  transform: rotate(45deg);
  background: var(--border2);
}
.deco span:nth-child(3) {
  width: 6px; height: 6px;
  background: var(--red);
}
.deco::before { content: ''; width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--border2)); }
.deco::after  { content: ''; width: 40px; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

/* ══ BOX ═════════════════════════════════════════ */
.box {
  width: 100%;
  max-width: 360px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2.25rem 2.25rem 2rem;
  position: relative;
  margin: 0 1rem;
}

/* угловые акценты */
.box::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 14px; height: 14px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  pointer-events: none;
}
.box::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 14px; height: 14px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  pointer-events: none;
}

.box-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  font-style: italic;
  color: var(--text-hi);
  margin-bottom: 1.75rem;
  display: flex;
  align-items: center;
  gap: .7rem;
}
.box-title::before { content: ''; width: 14px; height: 1px; background: var(--red); flex-shrink: 0; }
.box-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

label {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  color: var(--text-dim);
  letter-spacing: .12em;
  text-transform: uppercase;
  display: block;
  margin-bottom: .4rem;
}

input[type="password"] {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .7rem .9rem;
  color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  outline: none;
  transition: border-color .2s, background .2s;
  margin-bottom: 1.25rem;
  letter-spacing: .15em;
}
input[type="password"]:focus {
  border-color: var(--red);
  background: var(--bg2);
}
input[type="password"]::placeholder { letter-spacing: .05em; color: var(--text-dim); }

button {
  width: 100%;
  background: rgba(139,26,26,.12);
  border: 1px solid rgba(139,26,26,.35);
  border-radius: 2px;
  color: var(--text-hi);
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  font-style: italic;
  letter-spacing: .08em;
  padding: .75rem;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  position: relative;
}
button::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 8px; height: 8px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  transition: border-color .2s;
}
button::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 8px; height: 8px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  transition: border-color .2s;
}
button:hover {
  background: rgba(139,26,26,.22);
  border-color: var(--red);
}
button:hover::before,
button:hover::after { border-color: var(--red-hi); }

.error {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: #d88;
  text-align: center;
  margin-top: .85rem;
  min-height: 1rem;
  letter-spacing: .03em;
}
</style>
</head>
<body>

<div class="logo-area">
  <div class="logo">TasteID</div>
  <div class="logo-sub">Цифровой паспорт интересов</div>
  <div class="deco">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="box">
  <div class="box-title">Административный вход</div>
  <label>Пароль</label>
  <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Войти</button>
  <div class="error" id="err"></div>
</div>

<script>
async function login() {
  const pwd = document.getElementById("pwd").value;
  const err = document.getElementById("err");
  if (!pwd) { err.textContent = "Введите пароль"; return; }
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pwd })
  });
  if (res.ok) {
    window.location.href = "/add";
  } else {
    err.textContent = "Неверный пароль";
    document.getElementById("pwd").value = "";
  }
}
</script>
</body>
</html>
