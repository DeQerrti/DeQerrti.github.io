<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeQerrti — Личный Хаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a0f;
  --surface: #0f1219;
  --surface2: #131720;
  --border: #1a2030;
  --accent: #66fcf1;
  --accent2: #45b7d1;
  --text: #c8cdd8;
  --text-dim: #4a5568;
  --text-hi: #ffffff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(102,252,241,.07) 0%, transparent 60%);
}

/* ── HEADER ── */
header {
  text-align: center;
  padding: 3rem 1rem 2rem;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 120%, rgba(102,252,241,.04) 0%, transparent 70%);
  pointer-events: none;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(2.5rem, 7vw, 4rem);
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1;
  text-shadow: 0 0 60px rgba(102,252,241,.4);
}
.subtitle {
  margin-top: .5rem;
  font-size: .8rem;
  color: var(--text-dim);
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* ── NAV ── */
nav {
  display: flex;
  justify-content: center;
  gap: .15rem;
  padding: 0 1rem;
  border-bottom: 1px solid var(--border);
  background: rgba(8,10,15,.85);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(16px);
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
.tab-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .88rem;
  color: var(--text-dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 1rem .85rem;
  cursor: pointer;
  transition: color .2s, border-color .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── MAIN ── */
main {
  max-width: 1300px;
  margin: 0 auto;
  padding: 2rem 1rem 5rem;
}
.tab-content.hidden { display: none; }

/* ── SECTION ── */
section.group { margin-bottom: 3.5rem; }
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-hi);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: .6rem;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
}
.section-badge {
  font-family: 'DM Sans', sans-serif;
  font-size: .68rem;
  font-weight: 500;
  color: var(--accent);
  background: rgba(102,252,241,.08);
  border: 1px solid rgba(102,252,241,.18);
  padding: .15rem .5rem;
  border-radius: 999px;
}

/* ── GRIDS ── */
.grid-cards {
  display: grid;
  gap: .85rem;
  grid-template-columns: repeat(2, 1fr);
}
@media (min-width: 480px)  { .grid-cards { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 720px)  { .grid-cards { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1024px) { .grid-cards { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .grid-cards { grid-template-columns: repeat(6, 1fr); } }

.grid-chars {
  display: grid;
  gap: .85rem;
  grid-template-columns: repeat(3, 1fr);
}
@media (min-width: 480px)  { .grid-chars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 720px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1024px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* ── CARDS ── */
.card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  transition: border-color .22s, transform .22s, box-shadow .22s;
  position: relative;
}
.card:hover {
  border-color: rgba(102,252,241,.45);
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(102,252,241,.09);
}
.card-progress-bar {
  position: absolute;
  top: 0; left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  z-index: 2;
  border-radius: 0 2px 0 0;
}
.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--border);
}
.card-char img { aspect-ratio: 1/1; }

.card-body { padding: .6rem .65rem .7rem; }
.card-title {
  font-size: .78rem;
  font-weight: 500;
  color: var(--text-hi);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  margin-top: .35rem;
  font-size: .7rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-score { color: #f0c040; font-weight: 600; font-size: .76rem; }

/* ── FORMAT TAG ── */
.card-format {
  font-size: .62rem;
  padding: .1rem .38rem;
  border-radius: 4px;
  background: rgba(255,255,255,.05);
  color: var(--text-dim);
  border: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: .04em;
}

/* ── STATUS COLOURS ── */
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  flex-shrink: 0;
}
.dot-watching  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.dot-completed { background: #48bb78; }
.dot-planned   { background: #718096; }
.dot-paused    { background: #ed8936; }
.dot-dropped   { background: #fc6b68; }

/* ── STATES ── */
.state-box {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-dim);
  font-size: .9rem;
}
.spinner {
  width: 34px; height: 34px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── STATS BAR (трекер) ── */
.stats-bar {
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin-bottom: 2rem;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: .45rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .55rem .9rem;
  font-size: .82rem;
  color: var(--text);
}
.stat-pill strong { color: var(--text-hi); font-size: .95rem; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ── MANGA TABS ── */
.sub-tabs {
  display: flex;
  gap: .35rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}
.sub-tab-btn {
  font-size: .8rem;
  padding: .35rem .85rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .18s;
  font-family: 'DM Sans', sans-serif;
}
.sub-tab-btn:hover { color: var(--text); border-color: #2a3448; }
.sub-tab-btn.active {
  background: rgba(102,252,241,.08);
  border-color: rgba(102,252,241,.3);
  color: var(--accent);
}
</style>
</head>
<body>

<header>
  <div class="logo">DeQerrti</div>
  <div class="subtitle">Личный трекер · AniList</div>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('tab-anime', this)">▶ Аниме</button>
  <button class="tab-btn" onclick="switchTab('tab-manga', this)">📖 Манга</button>
  <button class="tab-btn" onclick="switchTab('tab-favorites', this)">⭐ Фавориты</button>
</nav>

<main>
  <div id="tab-anime"     class="tab-content"><div class="state-box"><div class="spinner"></div>Загружаем аниме…</div></div>
  <div id="tab-manga"     class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем мангу…</div></div>
  <div id="tab-favorites" class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем фавориты…</div></div>
</main>

<script>
const USERNAME = "KtNovas";
const ANILIST  = "https://graphql.anilist.co";

const PH_TALL = "https://placehold.co/300x420/0f1219/4a5568?text=?";
const PH_SQ   = "https://placehold.co/300x300/0f1219/4a5568?text=?";

const FORMAT_LABELS = {
  TV:"TV", TV_SHORT:"TV Short", MOVIE:"Фильм", SPECIAL:"Спешл",
  OVA:"OVA", ONA:"ONA", MUSIC:"Music",
  MANGA:"Манга", NOVEL:"Ранобэ", ONE_SHOT:"Ваншот",
  MANHWA:"Манхва", MANHUA:"Маньхуа"
};

const STATUS_MAP = {
  CURRENT:   { label: "Смотрю",      icon: "▶", dot: "watching"  },
  COMPLETED: { label: "Просмотрено", icon: "✓", dot: "completed" },
  PLANNING:  { label: "Запланировано",icon:"◷", dot: "planned"   },
  PAUSED:    { label: "Отложено",    icon: "⏸", dot: "paused"    },
  DROPPED:   { label: "Брошено",     icon: "✕", dot: "dropped"   },
  REPEATING: { label: "Пересматриваю",icon:"↺", dot: "watching"  },
};

const STATUS_MAP_MANGA = {
  CURRENT:   { label: "Читаю",        icon: "▶", dot: "watching"  },
  COMPLETED: { label: "Прочитано",    icon: "✓", dot: "completed" },
  PLANNING:  { label: "Запланировано",icon:"◷", dot: "planned"   },
  PAUSED:    { label: "Отложено",     icon: "⏸", dot: "paused"    },
  DROPPED:   { label: "Брошено",      icon: "✕", dot: "dropped"   },
  REPEATING: { label: "Перечитываю",  icon: "↺", dot: "watching"  },
};

const cache = {};

// ── GQL HELPER ──────────────────────────────────────
async function gql(query, variables = {}) {
  const res = await fetch(ANILIST, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ query, variables })
  });
  if (!res.ok) throw new Error(`AniList HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0]?.message || "GraphQL error");
  return json.data;
}

// ── TABS ────────────────────────────────────────────
function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId).classList.remove("hidden");
  btn.classList.add("active");
  if (tabId === "tab-anime")     loadAnime();
  if (tabId === "tab-manga")     loadManga();
  if (tabId === "tab-favorites") loadFavorites();
}

// ── COVER URL ────────────────────────────────────────
function cover(img, square = false) {
  if (!img) return square ? PH_SQ : PH_TALL;
  return img.extraLarge || img.large || img.medium || (square ? PH_SQ : PH_TALL);
}

// ── TITLE ────────────────────────────────────────────
function title(t) {
  return t?.russian || t?.userPreferred || t?.romaji || t?.english || "—";
}

// ═══════════════════════════════════════════════════
// ANIME LIST
// ═══════════════════════════════════════════════════
const ANIME_QUERY = `
query($name: String, $page: Int) {
  Page(page: $page, perPage: 50) {
    pageInfo { hasNextPage }
    mediaList(userName: $name, type: ANIME, sort: UPDATED_TIME_DESC) {
      status progress score(format: POINT_10)
      media {
        id siteUrl
        title { romaji english userPreferred }
        coverImage { extraLarge large }
        episodes format
        averageScore
      }
    }
  }
}`;

async function fetchAllAnime() {
  const all = [];
  let page = 1;
  while (true) {
    const data = await gql(ANIME_QUERY, { name: USERNAME, page });
    const p = data.Page;
    all.push(...p.mediaList);
    if (!p.pageInfo.hasNextPage) break;
    page++;
  }
  return all;
}

async function loadAnime() {
  if (cache.anime) { renderAnime(cache.anime); return; }
  try {
    const list = await fetchAllAnime();
    cache.anime = list;
    renderAnime(list);
  } catch (err) {
    document.getElementById("tab-anime").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

function renderAnime(list) {
  const box = document.getElementById("tab-anime");

  // Stats
  const counts = {};
  for (const e of list) counts[e.status] = (counts[e.status] || 0) + 1;

  const statsHTML = `<div class="stats-bar">
    ${Object.entries(counts).map(([s, n]) => {
      const m = STATUS_MAP[s] || { label: s, dot: "planned" };
      return `<div class="stat-pill"><span class="status-dot dot-${m.dot}"></span><strong>${n}</strong> ${m.label}</div>`;
    }).join("")}
    <div class="stat-pill">📊 <strong>${list.length}</strong> всего</div>
  </div>`;

  // Group by status in preferred order
  const ORDER = ["CURRENT","REPEATING","PAUSED","PLANNING","COMPLETED","DROPPED"];
  const groups = {};
  for (const e of list) {
    if (!groups[e.status]) groups[e.status] = [];
    groups[e.status].push(e);
  }

  let html = statsHTML;
  for (const status of ORDER) {
    if (!groups[status]?.length) continue;
    const m = STATUS_MAP[status] || { label: status, icon: "•", dot: "planned" };
    html += `<section class="group">
      <h2 class="section-title">
        ${m.icon} ${m.label}
        <span class="section-badge">${groups[status].length}</span>
      </h2>
      <div class="grid-cards">
        ${groups[status].map((e, i) => animeCard(e, i)).join("")}
      </div>
    </section>`;
  }

  box.innerHTML = html || `<div class="state-box">Список пустой</div>`;
}

function animeCard(entry, index) {
  const m  = entry.media;
  const img = cover(m.coverImage);
  const t  = m.title?.userPreferred || m.title?.romaji || "—";
  const epDone  = entry.progress ?? 0;
  const epTotal = m.episodes || 0;
  const score   = entry.score > 0 ? entry.score : null;
  const progress = epTotal > 0 ? Math.min((epDone / epTotal) * 100, 100) : 0;
  const fmt = FORMAT_LABELS[m.format] || m.format || "";

  return `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="card"
    style="animation-delay:${Math.min(index*25,500)}ms">
    ${progress > 0 ? `<div class="card-progress-bar" style="width:${progress}%"></div>` : ""}
    <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
    <div class="card-body">
      <div class="card-title">${t}</div>
      <div class="card-meta">
        <span>${epDone}${epTotal ? " / " + epTotal : ""}</span>
        ${score ? `<span class="card-score">★ ${score}</span>` : fmt ? `<span class="card-format">${fmt}</span>` : ""}
      </div>
    </div>
  </a>`;
}

// ═══════════════════════════════════════════════════
// MANGA LIST
// ═══════════════════════════════════════════════════
const MANGA_QUERY = `
query($name: String, $page: Int) {
  Page(page: $page, perPage: 50) {
    pageInfo { hasNextPage }
    mediaList(userName: $name, type: MANGA, sort: UPDATED_TIME_DESC) {
      status progress score(format: POINT_10)
      media {
        id siteUrl
        title { romaji english userPreferred }
        coverImage { extraLarge large }
        chapters format
      }
    }
  }
}`;

async function fetchAllManga() {
  const all = [];
  let page = 1;
  while (true) {
    const data = await gql(MANGA_QUERY, { name: USERNAME, page });
    const p = data.Page;
    all.push(...p.mediaList);
    if (!p.pageInfo.hasNextPage) break;
    page++;
  }
  return all;
}

async function loadManga() {
  if (cache.manga) { renderManga(cache.manga, activeMangaFilter); return; }
  try {
    const list = await fetchAllManga();
    cache.manga = list;
    renderManga(list, "ALL");
  } catch (err) {
    document.getElementById("tab-manga").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

let activeMangaFilter = "ALL";
const MANGA_FORMAT_GROUPS = {
  ALL:    { label: "Всё",     formats: null },
  MANGA:  { label: "Манга",   formats: ["MANGA","ONE_SHOT"] },
  NOVEL:  { label: "Ранобэ",  formats: ["NOVEL","LIGHT_NOVEL"] },
  OTHER:  { label: "Другое",  formats: ["MANHWA","MANHUA","DOUJIN"] },
};

function switchMangaFilter(key, btn) {
  activeMangaFilter = key;
  document.querySelectorAll(".sub-tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  if (cache.manga) renderMangaContent(cache.manga, key);
}

function renderManga(list, filter = "ALL") {
  activeMangaFilter = filter;
  const box = document.getElementById("tab-manga");

  const subTabs = `<div class="sub-tabs">
    ${Object.entries(MANGA_FORMAT_GROUPS).map(([k, g]) =>
      `<button class="sub-tab-btn${k === filter ? " active" : ""}" onclick="switchMangaFilter('${k}', this)">${g.label}</button>`
    ).join("")}
  </div>`;

  box.innerHTML = subTabs + `<div id="manga-content"></div>`;
  renderMangaContent(list, filter);
}

function renderMangaContent(list, filter) {
  const group = MANGA_FORMAT_GROUPS[filter];
  const filtered = group.formats
    ? list.filter(e => group.formats.includes(e.media.format))
    : list;

  const ORDER = ["CURRENT","REPEATING","PAUSED","PLANNING","COMPLETED","DROPPED"];
  const groups = {};
  for (const e of filtered) {
    if (!groups[e.status]) groups[e.status] = [];
    groups[e.status].push(e);
  }

  let html = "";
  for (const status of ORDER) {
    if (!groups[status]?.length) continue;
    const m = STATUS_MAP_MANGA[status] || { label: status, icon: "•", dot: "planned" };
    html += `<section class="group">
      <h2 class="section-title">
        ${m.icon} ${m.label}
        <span class="section-badge">${groups[status].length}</span>
      </h2>
      <div class="grid-cards">
        ${groups[status].map((e, i) => mangaCard(e, i)).join("")}
      </div>
    </section>`;
  }

  document.getElementById("manga-content").innerHTML =
    html || `<div class="state-box">Список пустой</div>`;
}

function mangaCard(entry, index) {
  const m  = entry.media;
  const img = cover(m.coverImage);
  const t  = m.title?.userPreferred || m.title?.romaji || "—";
  const chDone  = entry.progress ?? 0;
  const chTotal = m.chapters || 0;
  const score   = entry.score > 0 ? entry.score : null;
  const fmt = FORMAT_LABELS[m.format] || "";

  return `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="card"
    style="animation-delay:${Math.min(index*25,500)}ms">
    <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
    <div class="card-body">
      <div class="card-title">${t}</div>
      <div class="card-meta">
        <span>${chDone}${chTotal ? " / " + chTotal : ""} гл.</span>
        ${score ? `<span class="card-score">★ ${score}</span>` : fmt ? `<span class="card-format">${fmt}</span>` : ""}
      </div>
    </div>
  </a>`;
}

// ═══════════════════════════════════════════════════
// FAVORITES
// ═══════════════════════════════════════════════════
const FAV_QUERY = `
query($name: String) {
  User(name: $name) {
    favourites {
      anime(perPage: 50) {
        nodes {
          id siteUrl
          title { romaji english userPreferred }
          coverImage { extraLarge large }
          format averageScore
        }
      }
      manga(perPage: 50) {
        nodes {
          id siteUrl
          title { romaji english userPreferred }
          coverImage { extraLarge large }
          format averageScore
        }
      }
      characters(perPage: 50) {
        nodes {
          id siteUrl
          name { full }
          image { large medium }
        }
      }
      staff(perPage: 50) {
        nodes {
          id siteUrl
          name { full }
          image { large medium }
        }
      }
    }
  }
}`;

async function loadFavorites() {
  if (cache.favorites) { renderFavorites(cache.favorites); return; }
  try {
    const data = await gql(FAV_QUERY, { name: USERNAME });
    cache.favorites = data.User.favourites;
    renderFavorites(cache.favorites);
  } catch (err) {
    document.getElementById("tab-favorites").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

function renderFavorites(fav) {
  const box = document.getElementById("tab-favorites");
  const animes  = fav.anime?.nodes      || [];
  const mangas  = fav.manga?.nodes      || [];
  const chars   = fav.characters?.nodes || [];
  const staff   = fav.staff?.nodes      || [];

  let html = "";
  if (animes.length)  html += favSection("🎬 Любимые аниме",       animes, false);
  if (mangas.length)  html += favSection("📚 Любимая манга",        mangas, false);
  if (chars.length)   html += favCharSection("👤 Любимые персонажи", chars);
  if (staff.length)   html += favCharSection("🎌 Сейю / Режиссёры",  staff);
  box.innerHTML = html || `<div class="state-box">Фавориты не найдены</div>`;
}

function favSection(heading, items, square) {
  return `<section class="group">
    <h2 class="section-title">${heading} <span class="section-badge">${items.length}</span></h2>
    <div class="grid-cards">
      ${items.map((item, i) => {
        const img = cover(item.coverImage, square);
        const t = item.title?.userPreferred || item.title?.romaji || "—";
        const fmt = FORMAT_LABELS[item.format] || "";
        const score = item.averageScore ? Math.round(item.averageScore / 10) : null;
        return `<a href="${item.siteUrl}" target="_blank" rel="noopener" class="card"
          style="animation-delay:${Math.min(i*25,500)}ms">
          <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
          <div class="card-body">
            <div class="card-title">${t}</div>
            <div class="card-meta">
              ${fmt ? `<span class="card-format">${fmt}</span>` : "<span></span>"}
              ${score ? `<span class="card-score">★ ${score}</span>` : ""}
            </div>
          </div>
        </a>`;
      }).join("")}
    </div>
  </section>`;
}

function favCharSection(heading, items) {
  return `<section class="group">
    <h2 class="section-title">${heading} <span class="section-badge">${items.length}</span></h2>
    <div class="grid-chars">
      ${items.map((item, i) => {
        const img = item.image?.large || item.image?.medium || PH_SQ;
        const name = item.name?.full || "—";
        return `<a href="${item.siteUrl}" target="_blank" rel="noopener" class="card card-char"
          style="animation-delay:${Math.min(i*25,500)}ms">
          <img src="${img}" alt="${name}" loading="lazy" onerror="this.src='${PH_SQ}'">
          <div class="card-body">
            <div class="card-title">${name}</div>
          </div>
        </a>`;
      }).join("")}
    </div>
  </section>`;
}

loadAnime();
</script>
