<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeQerrti — Личный Хаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a0f;
  --surface: #0f1219;
  --surface2: #131720;
  --border: #1a2030;
  --accent: #66fcf1;
  --accent2: #45b7d1;
  --text: #c8cdd8;
  --text-dim: #4a5568;
  --text-hi: #ffffff;
  --green: #48bb78;
  --yellow: #f0c040;
  --orange: #ed8936;
  --red: #fc6b68;

  /* Шкала послевкусия */
  --grade-brown:  #8B6914;
  --grade-red:    #c0392b;
  --grade-white:  #6b7280;
  --grade-yellow: #d4a017;
  --grade-green:  #2d8a4e;
  --grade-blue:   #2563a8;
  --grade-purple: #7c3aed;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(102,252,241,.07) 0%, transparent 60%);
}

/* HEADER */
header {
  text-align: center;
  padding: 3rem 1rem 2rem;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(2.5rem, 7vw, 4rem);
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1;
  text-shadow: 0 0 60px rgba(102,252,241,.4);
}
.subtitle {
  margin-top: .5rem;
  font-size: .78rem;
  color: var(--text-dim);
  letter-spacing: .18em;
  text-transform: uppercase;
}

/* NAV */
nav {
  display: flex;
  justify-content: center;
  gap: .15rem;
  padding: 0 1rem;
  border-bottom: 1px solid var(--border);
  background: rgba(8,10,15,.88);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(16px);
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
.tab-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .88rem;
  color: var(--text-dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 1rem .9rem;
  cursor: pointer;
  transition: color .2s, border-color .2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* MAIN */
main {
  max-width: 1800px;
  margin: 0 auto;
  padding: 2.5rem 2.5rem 6rem;
}
.tab-content.hidden { display: none; }
section.group { margin-bottom: 3.5rem; }

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-hi);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: .6rem;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}
.section-badge {
  font-size: .68rem;
  font-weight: 500;
  color: var(--accent);
  background: rgba(102,252,241,.08);
  border: 1px solid rgba(102,252,241,.18);
  padding: .15rem .5rem;
  border-radius: 999px;
}

/* GRIDS */
.grid-now {
  display: grid;
  gap: .85rem;
  grid-template-columns: repeat(2, 1fr);
}
@media (min-width: 480px)  { .grid-now { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 700px)  { .grid-now { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 900px)  { .grid-now { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1100px) { .grid-now { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1300px) { .grid-now { grid-template-columns: repeat(7, 1fr); } }

.grid-chars {
  display: grid;
  gap: .85rem;
  grid-template-columns: repeat(3, 1fr);
}
@media (min-width: 480px)  { .grid-chars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 720px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1024px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* CARD */
.card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  transition: border-color .22s, transform .22s, box-shadow .22s;
  position: relative;
}
.card:hover {
  border-color: rgba(102,252,241,.4);
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(102,252,241,.08);
}
.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--border);
}
.card-char img { aspect-ratio: 1/1; }
.card-body { padding: .55rem .65rem .65rem; }
.card-title {
  font-size: .78rem;
  font-weight: 500;
  color: var(--text-hi);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  margin-top: .3rem;
  font-size: .7rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}
.card-score { color: var(--yellow); font-weight: 600; font-size: .75rem; }

/* TYPE TAG */
.type-tag {
  position: absolute;
  top: 6px; right: 6px;
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .18rem .45rem;
  border-radius: 5px;
  backdrop-filter: blur(8px);
  z-index: 3;
}
.tag-anime  { background: rgba(102,252,241,.18); color: var(--accent);  border: 1px solid rgba(102,252,241,.3); }
.tag-manga  { background: rgba(240,192, 64,.15); color: var(--yellow);  border: 1px solid rgba(240,192, 64,.25); }
.tag-novel  { background: rgba( 72,187,120,.15); color: var(--green);   border: 1px solid rgba( 72,187,120,.25); }

/* PROGRESS */
.progress-line {
  font-size: .7rem;
  color: var(--accent);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* STATES */
.state-box {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-dim);
  font-size: .9rem;
}
.spinner {
  width: 34px; height: 34px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ══════════════════════════════════════════════════
   REVIEWS — новая система
══════════════════════════════════════════════════ */
.reviews-grid {
  display: grid;
  gap: 1.5rem;
  grid-template-columns: 1fr;
}
@media (min-width: 700px)  { .reviews-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1050px) { .reviews-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1400px) { .reviews-grid { grid-template-columns: repeat(4, 1fr); } }

/* Карточка отзыва */
.review-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  text-decoration: none;
  color: inherit;
  transition: border-color .22s, transform .22s, box-shadow .22s;
  position: relative;
  animation: fadeUp .35s ease both;
  overflow: visible;
}
.review-card:hover {
  border-color: rgba(102,252,241,.3);
  transform: translateY(-4px);
  box-shadow: 0 14px 40px rgba(0,0,0,.4);
}

/* Верхняя часть: обложка + инфо */
.review-top {
  display: flex;
  gap: 1.1rem;
  padding: 1.1rem;
  flex: 1;
}
.review-cover {
  width: 130px;
  flex-shrink: 0;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  align-self: flex-start;
}
.review-cover img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
}
.review-body { flex: 1; min-width: 0; }

.review-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: .5rem;
  margin-bottom: .3rem;
}
.review-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-hi);
  line-height: 1.25;
}
.review-meta-row {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: .55rem;
  flex-wrap: wrap;
}
.review-format {
  font-size: .72rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.review-date {
  font-size: .72rem;
  color: var(--text-dim);
}
.review-waifu {
  font-size: .78rem;
  color: var(--text-dim);
  font-style: italic;
  margin-bottom: .5rem;
}
.review-waifu span { color: var(--accent); font-style: normal; }

.review-preview {
  font-size: .82rem;
  color: var(--text);
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 6;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Теги */
.review-tags {
  padding: .6rem 1.1rem;
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  border-top: 1px solid var(--border);
  overflow: visible;
  position: relative;
  z-index: 2;
}
.rtag {
  font-size: .68rem;
  padding: .25rem .6rem;
  border-radius: 5px;
  font-weight: 500;
  letter-spacing: .02em;
  white-space: nowrap;
  position: relative;
  cursor: default;
}
/* Категории тегов по цвету */
.rtag-visual  { background: rgba(69,183,209,.12);  color: #45b7d1; border: 1px solid rgba(69,183,209,.25); }
.rtag-plot    { background: rgba(240,192, 64,.1);  color: #d4a500; border: 1px solid rgba(240,192,64,.22); }
.rtag-chars   { background: rgba(72,187,120,.1);   color: #48bb78; border: 1px solid rgba(72,187,120,.22); }
.rtag-special { background: rgba(237,137, 54,.1);  color: #ed8936; border: 1px solid rgba(237,137,54,.22); }

/* Тултип на теге */
.rtag[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: #1a2030;
  color: var(--text);
  font-size: .68rem;
  font-weight: 400;
  padding: .35rem .6rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  white-space: nowrap;
  z-index: 9999;
  pointer-events: none;
  box-shadow: 0 4px 16px rgba(0,0,0,.5);
}
.rtag[data-tip]:hover::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 1px);
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--border);
  z-index: 21;
}

/* Нижняя полоса — оценка по шкале послевкусия */
.review-grade-bar {
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .65rem 1.1rem;
  border-top: 1px solid var(--border);
}
.grade-square {
  width: 13px; height: 13px;
  border-radius: 4px;
  flex-shrink: 0;
}
.grade-name {
  font-family: 'Syne', sans-serif;
  font-size: .85rem;
  font-weight: 700;
  flex: 1;
}
.grade-desc {
  font-size: .65rem;
  color: var(--text-dim);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.review-source-link {
  font-size: .65rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: .3rem;
  padding: .2rem .45rem;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 5px;
  flex-shrink: 0;
  white-space: nowrap;
}
.review-source-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ══ TIMELINE ══════════════════════════════════════════ */
.timeline-controls {
  display: flex;
  gap: .5rem;
  margin-bottom: 2rem;
  flex-wrap: wrap;
  align-items: center;
}
.tl-filter-btn {
  font-size: .8rem;
  padding: .35rem .85rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .18s;
  font-family: 'DM Sans', sans-serif;
}
.tl-filter-btn:hover { color: var(--text); border-color: #2a3448; }
.tl-filter-btn.active {
  background: rgba(102,252,241,.08);
  border-color: rgba(102,252,241,.3);
  color: var(--accent);
}

.timeline {
  position: relative;
  padding-left: 1.6rem;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 6px; top: 6px; bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, var(--accent) 0%, var(--border) 100%);
}

.tl-year-label {
  font-family: 'Syne', sans-serif;
  font-size: .8rem;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin: 2rem 0 .75rem -1.6rem;
  padding-left: 1.6rem;
  position: relative;
}
.tl-year-label::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: var(--bg);
  box-shadow: 0 0 10px rgba(102,252,241,.3);
}

.tl-entry {
  position: relative;
  display: flex;
  gap: .85rem;
  margin-bottom: .75rem;
  padding: .75rem .85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  color: inherit;
  transition: border-color .2s, background .2s;
  align-items: center;
}
.tl-entry::before {
  content: '';
  position: absolute;
  left: -1.28rem; top: 50%;
  transform: translateY(-50%);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border);
  border: 1px solid var(--text-dim);
}
.tl-entry:hover { border-color: rgba(102,252,241,.3); background: var(--surface2); }
.tl-entry:hover::before {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(102,252,241,.5);
}

.tl-thumb {
  width: 42px;
  flex-shrink: 0;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.tl-thumb img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
}
.tl-info { flex: 1; min-width: 0; }
.tl-name {
  font-size: .84rem;
  font-weight: 500;
  color: var(--text-hi);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: .25rem;
}
.tl-dates {
  font-size: .7rem;
  color: var(--text-dim);
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  align-items: center;
}
.tl-date-range { display: flex; align-items: center; gap: .35rem; }
.tl-arrow { color: var(--text-dim); font-size: .65rem; }
.tl-ongoing { color: var(--accent); font-size: .7rem; }
.tl-dur {
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: .1rem .4rem;
  font-size: .65rem;
  color: var(--text-dim);
}
.tl-type-tag {
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .15rem .4rem;
  border-radius: 4px;
  flex-shrink: 0;
}
.tl-score {
  font-size: .78rem;
  font-weight: 700;
  color: var(--yellow);
  flex-shrink: 0;
  min-width: 2.2rem;
  text-align: right;
}
.tl-empty {
  text-align: center;
  padding: 3rem;
  color: var(--text-dim);
  font-size: .88rem;
}
</style>
</head>

<header>
  <div class="logo">DeQerrti</div>
  <div class="subtitle">Личный трекер · AniList</div>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('tab-now', this)">▶ Сейчас</button>
  <button class="tab-btn" onclick="switchTab('tab-favorites', this)">⭐ Фавориты</button>
  <button class="tab-btn" onclick="switchTab('tab-reviews', this)">✍ Отзывы</button>
  <button class="tab-btn" onclick="switchTab('tab-timeline', this)">📅 Хронология</button>
</nav>

<main>
  <div id="tab-now"       class="tab-content"><div class="state-box"><div class="spinner"></div>Загружаем…</div></div>

  <div id="tab-reviews"   class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем отзывы…</div></div>
  <div id="tab-timeline"  class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем хронологию…</div></div>
</main>

<script>

const TAG_CAT_CLASS = {
  visual:  "rtag-visual",
  plot:    "rtag-plot",
  chars:   "rtag-chars",
  special: "rtag-special",
};

const SOURCE_LABELS = {
  telegraph: "Telegraph",
  teletype:  "Teletype",
  bluesky:   "Bluesky",
  other:     "Ссылка"
};

// ══════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════
async function gql(query, variables = {}) {
  const res = await fetch(AL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ query, variables })
  });
  if (!res.ok) throw new Error(`AniList HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0]?.message || "GraphQL error");
  return json.data;
}

function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId).classList.remove("hidden");
  btn.classList.add("active");
  if (tabId === "tab-now")       loadNow();
  if (tabId === "tab-favorites") loadFavorites();
  if (tabId === "tab-reviews")   loadReviews();
  if (tabId === "tab-timeline")  loadTimeline();
}

function coverUrl(img, sq = false) {
  if (!img) return sq ? PH_SQ : PH_TALL;
  return img.extraLarge || img.large || img.medium || (sq ? PH_SQ : PH_TALL);
}
function mediaTitle(t) {
  return t?.userPreferred || t?.romaji || t?.english || "—";
}
function entryTypeTag(entry) {
  if (entry.media.type === "ANIME") return ["anime","ANIME"];
  if (NOVEL_FORMATS.includes(entry.media.format)) return ["novel","РАНОБЭ"];
  return ["manga","МАНГА"];
}

// ══════════════════════════════════════════════════
// NOW
// ══════════════════════════════════════════════════
const NOW_QUERY = `
query($name: String) {
  anime: Page(perPage: 50) {
    mediaList(userName: $name, type: ANIME, status: CURRENT, sort: UPDATED_TIME_DESC) {
      progress score(format: POINT_10)
      media { id siteUrl type format
        title { userPreferred romaji }
        coverImage { extraLarge large }
        episodes
      }
    }
  }
  manga: Page(perPage: 50) {
    mediaList(userName: $name, type: MANGA, status: CURRENT, sort: UPDATED_TIME_DESC) {
      progress score(format: POINT_10)
      media { id siteUrl type format
        title { userPreferred romaji }
        coverImage { extraLarge large }
        chapters volumes
      }
    }
  }
}`;

async function loadNow() {
  if (cache.now) { renderNow(cache.now); return; }
  try {
    const data = await gql(NOW_QUERY, { name: USERNAME });
    const all = [
      ...(data.anime?.mediaList || []),
      ...(data.manga?.mediaList || [])
    ];
    all.sort((a, b) => {
      const order = e => e.media.type === "ANIME" ? 0 : NOVEL_FORMATS.includes(e.media.format) ? 2 : 1;
      return order(a) - order(b);
    });
    cache.now = all;
    renderNow(all);
  } catch (err) {
    document.getElementById("tab-now").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

function renderNow(list) {
  const box = document.getElementById("tab-now");
  if (!list.length) {
    box.innerHTML = `<div class="state-box">Сейчас ничего не смотришь и не читаешь</div>`;
    return;
  }
  box.innerHTML = `
    <section class="group">
      <h2 class="section-title">Сейчас <span class="section-badge">${list.length}</span></h2>
      <div class="grid-now">${list.map((e, i) => nowCard(e, i)).join("")}</div>
    </section>`;
}

function nowCard(entry, index) {
  const m   = entry.media;
  const img = coverUrl(m.coverImage);
  const t   = mediaTitle(m.title);
  const [tagClass, tagLabel] = entryTypeTag(entry);
  const done  = entry.progress ?? 0;
  const total = m.type === "ANIME" ? (m.episodes || 0) : (m.chapters || 0);
  const unit  = m.type === "ANIME" ? "эп." : "гл.";

  return `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="card"
    style="animation-delay:${Math.min(index * 30, 600)}ms">
    <span class="type-tag tag-${tagClass}">${tagLabel}</span>
    <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
    <div class="card-body">
      <div class="card-title">${t}</div>
      <div class="card-meta">
        <span class="progress-line">${done}${total ? " / " + total : ""} ${unit}</span>
      </div>
    </div>
  </a>`;
}

// ══════════════════════════════════════════════════
// FAVORITES
// ══════════════════════════════════════════════════
const FAV_QUERY = `
query($name: String) {
  User(name: $name) {
    favourites {
      anime(perPage: 50) { nodes {
        id siteUrl format averageScore
        title { userPreferred romaji }
        coverImage { extraLarge large }
      }}
      manga(perPage: 50) { nodes {
        id siteUrl format averageScore
        title { userPreferred romaji }
        coverImage { extraLarge large }
      }}
      characters(perPage: 50) { nodes {
        id siteUrl
        name { full }
        image { large medium }
      }}
      staff(perPage: 50) { nodes {
        id siteUrl
        name { full }
        image { large medium }
      }}
    }
  }
}`;

async function loadFavorites() {
  if (cache.fav) { renderFavorites(cache.fav); return; }
  try {
    const data = await gql(FAV_QUERY, { name: USERNAME });
    cache.fav = data.User.favourites;
    renderFavorites(cache.fav);
  } catch (err) {
    document.getElementById("tab-favorites").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

const FORMAT_LABELS = {
  TV:"TV", TV_SHORT:"TV Short", MOVIE:"Фильм", SPECIAL:"Спешл",
  OVA:"OVA", ONA:"ONA", MANGA:"Манга", NOVEL:"Ранобэ", ONE_SHOT:"Ваншот",
  MANHWA:"Манхва", MANHUA:"Маньхуа"
};

function renderFavorites(fav) {
  const box = document.getElementById("tab-favorites");
  const animes = fav.anime?.nodes || [];
  const mangas = fav.manga?.nodes || [];
  const chars  = fav.characters?.nodes || [];
  const staff  = fav.staff?.nodes || [];

  let html = "";
  if (animes.length) html += favMediaSection("🎬 Любимые аниме", animes);
  if (mangas.length) html += favMediaSection("📚 Любимая манга", mangas);
  if (chars.length)  html += favPersonSection("👤 Любимые персонажи", chars);
  if (staff.length)  html += favPersonSection("🎌 Сейю / Режиссёры", staff);
  box.innerHTML = html || `<div class="state-box">Фавориты не найдены</div>`;
}

function favMediaSection(heading, items) {
  return `<section class="group">
    <h2 class="section-title">${heading} <span class="section-badge">${items.length}</span></h2>
    <div class="grid-now">
      ${items.map((item, i) => {
        const img = coverUrl(item.coverImage);
        const t   = mediaTitle(item.title);
        const fmt = FORMAT_LABELS[item.format] || "";
        const score = item.averageScore ? (item.averageScore / 10).toFixed(1) : null;
        return `<a href="${item.siteUrl}" target="_blank" rel="noopener" class="card"
          style="animation-delay:${Math.min(i*25,500)}ms">
          <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
          <div class="card-body">
            <div class="card-title">${t}</div>
            <div class="card-meta">
              <span style="color:var(--text-dim);font-size:.65rem">${fmt}</span>
              ${score ? `<span class="card-score">★ ${score}</span>` : ""}
            </div>
          </div>
        </a>`;
      }).join("")}
    </div>
  </section>`;
}

function favPersonSection(heading, items) {
  return `<section class="group">
    <h2 class="section-title">${heading} <span class="section-badge">${items.length}</span></h2>
    <div class="grid-chars">
      ${items.map((item, i) => {
        const img  = item.image?.large || item.image?.medium || PH_SQ;
        const name = item.name?.full || "—";
        return `<a href="${item.siteUrl}" target="_blank" rel="noopener" class="card card-char"
          style="animation-delay:${Math.min(i*25,500)}ms">
          <img src="${img}" alt="${name}" loading="lazy" onerror="this.src='${PH_SQ}'">
          <div class="card-body"><div class="card-title">${name}</div></div>
        </a>`;
      }).join("")}
    </div>
  </section>`;
}

// ══════════════════════════════════════════════════
// REVIEWS
// ══════════════════════════════════════════════════
async function loadReviews() {
  if (cache.reviews) { renderReviews(cache.reviews); return; }
  try {
    const res = await fetch("reviews.json");
    if (!res.ok) throw new Error("reviews.json не найден");
    const data = await res.json();
    data.sort((a, b) => new Date(b.date) - new Date(a.date));
    cache.reviews = data;
    renderReviews(data);
  } catch (err) {
    document.getElementById("tab-reviews").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">📝</div>
      Отзывов пока нет.<br><span style="font-size:.8rem;margin-top:.5rem;display:block">Добавь записи в <code>reviews.json</code></span></div>`;
  }
}

function renderReviews(reviews) {
  const box = document.getElementById("tab-reviews");
  box.innerHTML = `
    <section class="group">
      <h2 class="section-title">✍ Отзывы <span class="section-badge">${reviews.length}</span></h2>
      <div class="reviews-grid">
        ${reviews.map((r, i) => reviewCard(r, i)).join("")}
      </div>
    </section>`;
}

function reviewCard(r, i) {
  const grade = GRADES[r.grade] || null;

  // Теги
  const tags = (r.tags || []);
  const tagsHtml = tags.length
    ? `<div class="review-tags">${tags.map(tag => {
        const info = TAGS_MAP[tag];
        const cls  = info ? TAG_CAT_CLASS[info.cat] : "rtag-special";
        const tip  = info ? info.tip : "";
        return `<span class="rtag ${cls}" data-tip="${tip}">${tag}</span>`;
      }).join("")}</div>`
    : "";

  // Фавориты
  const waifuHtml = r.favorites
    ? `<div class="review-waifu">Фавориты: <span>${r.favorites}</span></div>`
    : "";

  // Формат и дата
  const typeColors = { anime: "var(--accent)", manga: "var(--yellow)", novel: "var(--green)" };
  const typeColor  = typeColors[r.type] || "var(--text-dim)";
  const dateStr    = r.date
    ? new Date(r.date).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" })
    : "";
  const sourceLabel = SOURCE_LABELS[r.source] || r.source || "Ссылка";

  // Нижняя полоса оценки + источник в одной строке
  const gradeHtml = grade
    ? `<div class="review-grade-bar">
        <div class="grade-square" style="background:${grade.color};box-shadow:0 0 8px ${grade.color}55"></div>
        <div style="flex:1">
          <div class="grade-name" style="color:${grade.color}">${grade.name}</div>
          <div class="grade-desc">${grade.desc}</div>
        </div>
        <div class="review-source-link">
          <span class="review-source-dot" style="background:${typeColor}"></span>
          ${sourceLabel}
        </div>
      </div>`
    : `<div class="review-grade-bar">
        <div style="flex:1"></div>
        <div class="review-source-link">
          <span class="review-source-dot" style="background:${typeColor}"></span>
          ${sourceLabel}
        </div>
      </div>`;

  return `<a href="${r.url}" target="_blank" rel="noopener" class="review-card"
    style="animation-delay:${Math.min(i*40,600)}ms;border-top: 2px solid ${grade ? grade.color + "55" : "var(--border)"}">
    <div class="review-top">
      <div class="review-cover">
        <img src="${r.cover || PH_TALL}" alt="${r.title}" loading="lazy" onerror="this.src='${PH_TALL}'">
      </div>
      <div class="review-body">
        <div class="review-header">
          <div class="review-title">${r.title}</div>
        </div>
        <div class="review-meta-row">
          ${r.format ? `<span class="review-format">${r.format}</span>` : ""}
          ${r.year   ? `<span class="review-date">${r.year}</span>` : ""}
          ${dateStr  ? `<span class="review-date" style="margin-left:auto">${dateStr}</span>` : ""}
        </div>
        ${waifuHtml}
        <div class="review-preview">${r.preview || ""}</div>
      </div>
    </div>
    ${tagsHtml}
    ${gradeHtml}
  </a>`;
}

// ══════════════════════════════════════════════════
// TIMELINE
// ══════════════════════════════════════════════════
const TL_QUERY = `
query($name: String, $page: Int) {
  Page(page: $page, perPage: 50) {
    pageInfo { hasNextPage }
    mediaList(userName: $name, sort: FINISHED_ON_DESC, status_in: [COMPLETED, CURRENT, DROPPED]) {
      status
      score(format: POINT_10)
      progress
      startedAt   { year month day }
      completedAt { year month day }
      media {
        id siteUrl type format
        title { userPreferred romaji }
        coverImage { large medium }
        episodes chapters
      }
    }
  }
}`;

async function fetchAllTimeline() {
  const all = [];
  let page = 1;
  while (true) {
    const data = await gql(TL_QUERY, { name: USERNAME, page });
    const p = data.Page;
    all.push(...p.mediaList);
    if (!p.pageInfo.hasNextPage) break;
    page++;
  }
  return all;
}

let tlFilter = "ALL";

async function loadTimeline() {
  if (cache.timeline) { renderTimeline(cache.timeline, tlFilter); return; }
  try {
    const all = await fetchAllTimeline();
    const valid = all.filter(e => e.startedAt?.year);
    cache.timeline = valid;
    renderTimeline(valid, "ALL");
  } catch (err) {
    document.getElementById("tab-timeline").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

function switchTlFilter(key, btn) {
  tlFilter = key;
  document.querySelectorAll(".tl-filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  if (cache.timeline) renderTimelineList(cache.timeline, key);
}

function renderTimeline(list, filter) {
  const box = document.getElementById("tab-timeline");
  box.innerHTML = `
    <div class="timeline-controls">
      <button class="tl-filter-btn ${filter==="ALL"?"active":""}"   onclick="switchTlFilter('ALL',this)">Всё</button>
      <button class="tl-filter-btn ${filter==="ANIME"?"active":""}" onclick="switchTlFilter('ANIME',this)">Аниме</button>
      <button class="tl-filter-btn ${filter==="MANGA"?"active":""}" onclick="switchTlFilter('MANGA',this)">Манга</button>
      <button class="tl-filter-btn ${filter==="NOVEL"?"active":""}" onclick="switchTlFilter('NOVEL',this)">Ранобэ</button>
    </div>
    <div id="tl-list"></div>`;
  renderTimelineList(list, filter);
}

function renderTimelineList(list, filter) {
  let filtered = list;
  if (filter === "ANIME") filtered = list.filter(e => e.media.type === "ANIME");
  else if (filter === "MANGA") filtered = list.filter(e => e.media.type === "MANGA" && !NOVEL_FORMATS.includes(e.media.format));
  else if (filter === "NOVEL") filtered = list.filter(e => NOVEL_FORMATS.includes(e.media.format));

  if (!filtered.length) {
    document.getElementById("tl-list").innerHTML = `<div class="tl-empty">Нет записей</div>`;
    return;
  }

  const byYear = {};
  for (const e of filtered) {
    const y = e.completedAt?.year || e.startedAt?.year;
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(e);
  }
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  let html = "";
  for (const year of years) {
    html += `<div class="tl-year-label">${year}</div>
    <div class="timeline">${byYear[year].map(e => tlEntry(e)).join("")}</div>`;
  }
  document.getElementById("tl-list").innerHTML = html;
}

function fmtDate(d) {
  if (!d?.year) return null;
  if (!d.month) return `${d.year}`;
  if (!d.day)   return new Date(d.year, d.month - 1).toLocaleDateString("ru-RU", { month: "short", year: "numeric" });
  return new Date(d.year, d.month - 1, d.day).toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
}

function daysBetween(a, b) {
  if (!a?.year || !b?.year) return null;
  const d1 = new Date(a.year, (a.month||1) - 1, a.day||1);
  const d2 = new Date(b.year, (b.month||1) - 1, b.day||1);
  const diff = Math.round((d2 - d1) / 86400000);
  if (diff < 1)   return null;
  if (diff < 31)  return `${diff} дн.`;
  if (diff < 365) return `${Math.round(diff/30)} мес.`;
  return `${(diff/365).toFixed(1)} г.`;
}

function tlEntry(entry) {
  const m = entry.media;
  const img = m.coverImage?.large || m.coverImage?.medium || PH_TALL;
  const t   = mediaTitle(m.title);
  const [tagClass, tagLabel] = entryTypeTag(entry);

  const start    = fmtDate(entry.startedAt);
  const end      = fmtDate(entry.completedAt);
  const duration = daysBetween(entry.startedAt, entry.completedAt);
  const score    = entry.score > 0 ? entry.score : null;
  const ongoing  = entry.status === "CURRENT";

  const datesHtml = `<div class="tl-date-range">
    ${start ? `<span>${start}</span>` : ""}
    ${(start && (end || ongoing)) ? `<span class="tl-arrow">→</span>` : ""}
    ${end ? `<span>${end}</span>` : ongoing ? `<span class="tl-ongoing">сейчас</span>` : ""}
    ${duration ? `<span class="tl-dur">${duration}</span>` : ""}
  </div>`;

  return `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="tl-entry">
    <div class="tl-thumb"><img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'"></div>
    <div class="tl-info">
      <div class="tl-name">${t}</div>
      <div class="tl-dates">${datesHtml}</div>
    </div>
    <span class="tl-type-tag tag-${tagClass}">${tagLabel}</span>
    ${score ? `<div class="tl-score">★ ${score}</div>` : ""}
  </a>`;
}
