.card {

  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  transition: border-color .22s, transform .22s, box-shadow .22s;
  position: relative;
}
.card:hover {
  border-color: rgba(102,252,241,.4);
  transform: translateY(-4px);
  box-shadow: 0 12px 35px rgba(102,252,241,.08);
}

  object-fit: cover;
  display: block;
  background: var(--border);
}
.card-char img { aspect-ratio: 1/1; }
.card-body { padding: .55rem .65rem .65rem; }
.card-title {
  font-size: .78rem;
  font-weight: 500;
  color: var(--text-hi);

  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  margin-top: .3rem;
  font-size: .7rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}

  position: absolute;

  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .18rem .45rem;
  border-radius: 5px;
  backdrop-filter: blur(8px);
  z-index: 3;
}

/* ══ WATCH BADGE (дата просмотра, левый верх) ═════ */
.watch-badge {
  position: absolute;
  top: 6px; left: 6px;
  font-size: .58rem;
  font-weight: 500;
  color: rgba(255,255,255,.9);
  background: rgba(8,10,15,.78);

  line-height: 1.3;
  max-width: calc(100% - 64px);

  overflow: hidden;
  text-overflow: ellipsis;
}

  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: .35rem .6rem;

  align-items: center;
  gap: .35rem;
  background: linear-gradient(0deg, rgba(8,10,15,.92) 60%, transparent);

  width: 6px; height: 6px;
  border-radius: 50%;

}

.state-box {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-dim);
  font-size: .9rem;
}
.spinner {
  width: 34px; height: 34px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .75s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

async function gql(query, variables = {}) {
  const res = await fetch(AL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ query, variables })
  });
  if (!res.ok) throw new Error(`AniList HTTP ${res.status}`);
  const json = await res.json();
  if (json.errors) throw new Error(json.errors[0]?.message || "GraphQL error");
  return json.data;
}

async function traktFetch(path) {
  const res = await fetch(`${TRAKT}${path}`, {
    headers: {
      "Content-Type": "application/json",
      "trakt-api-version": "2",
      "trakt-api-key": TRAKT_CLIENT
    }
  });
  if (!res.ok) throw new Error(`Trakt HTTP ${res.status}`);
  return res.json();
}

async function tmdbFetch(path) {
  const res = await fetch(`${TMDB}${path}`, {
    headers: { "Authorization": `Bearer ${TMDB_TOKEN}` }
  });
  if (!res.ok) throw new Error(`TMDb HTTP ${res.status}`);
  return res.json();
}

function tmdbPoster(path, size = "w342") {
  if (!path) return PH_TALL;
  return `${TMDB_IMG}/${size}${path}`;

  btn.classList.add("active");
  if (tabId === "tab-now")       loadNow();
  if (tabId === "tab-favorites") loadFavorites();
  if (tabId === "tab-reviews")   loadReviews();
}

function coverUrl(img, sq = false) {
  if (!img) return sq ? PH_SQ : PH_TALL;
  return img.extraLarge || img.large || img.medium || (sq ? PH_SQ : PH_TALL);
}
function mediaTitle(t) { return t?.userPreferred || t?.romaji || t?.english || "—"; }
function entryTypeTag(entry) {
  if (entry.media.type === "ANIME") return ["anime","Аниме"];
  if (NOVEL_FORMATS.includes(entry.media.format)) return ["novel","Ранобе"];
  return ["manga","Манга"];
}

// Нормализуем название для поиска совпадений с reviews.json
function normTitle(s) {
  return (s || "").toLowerCase().trim().replace(/\s+/g, " ");
}

// Ищем оценку в reviews по названию (нечёткое совпадение)
function findGradeForTitle(title) {
  if (!cache.reviews || !title) return null;
  const norm = normTitle(title);
  const found = cache.reviews.find(r => normTitle(r.title) === norm);
  return found ? (GRADES[found.grade] || null) : null;
}

// Рендер бейджа оценки поверх постера
function gradeBadgeHtml(grade) {
  if (!grade) return "";
  return `<div class="grade-badge">
    <span class="grade-dot" style="background:${grade.color};box-shadow:0 0 5px ${grade.color}88"></span>
    <span style="color:${grade.color}">${grade.name}</span>
  </div>`;
}

// ══════════════════════════════════════════════════
// TRAKT helpers
// ══════════════════════════════════════════════════
async function enrichTraktWithPosters(items, type) {
  const BATCH = 20;
  const result = [];
  for (let i = 0; i < items.length; i += BATCH) {
    const chunk = items.slice(i, i + BATCH);
    await Promise.all(chunk.map(async item => {
      const entry = type === "movie" ? item.movie : item.show;
      const tmdbId = entry?.ids?.tmdb;
      if (!tmdbId) { result.push({ ...item, _poster: null, _type: type }); return; }
      try {
        const detail = await tmdbFetch(`/${type === "movie" ? "movie" : "tv"}/${tmdbId}?language=ru-RU`);
        result.push({
          ...item,
          _poster: tmdbPoster(detail.poster_path, "w342"),
          _title_ru: detail.title || detail.name || entry.title,
          _year: (detail.release_date || detail.first_air_date || "").slice(0, 4),
          _tmdb_url: `https://www.themoviedb.org/${type === "movie" ? "movie" : "tv"}/${tmdbId}`,
          _type: type
        });
      } catch {
        result.push({ ...item, _poster: null, _type: type });
      }
    }));
  }
  return result;
}

async function fetchTraktWatched(type) {
  const path = type === "movie"
    ? `/users/${TRAKT_USERNAME}/watched/movies?extended=noseasons`
    : `/users/${TRAKT_USERNAME}/watched/shows?extended=noseasons`;
  try {
    return await traktFetch(path);
  } catch {
    return [];
  }
}

// ══════════════════════════════════════════════════
// NOW — AniList + Trakt
// ══════════════════════════════════════════════════
const NOW_QUERY = `
query($name: String) {
  anime_cur: Page(perPage: 50) {
    mediaList(userName: $name, type: ANIME, status: CURRENT, sort: UPDATED_TIME_DESC) {
      progress
      media { id siteUrl type format title { userPreferred romaji } coverImage { extraLarge large } episodes startDate { year } }
    }
  }
  manga_cur: Page(perPage: 50) {
    mediaList(userName: $name, type: MANGA, status: CURRENT, sort: UPDATED_TIME_DESC) {
      progress
      media { id siteUrl type format title { userPreferred romaji } coverImage { extraLarge large } chapters volumes startDate { year } }
    }
  }
  anime_done: Page(perPage: 50) {
    mediaList(userName: $name, type: ANIME, status: COMPLETED, sort: UPDATED_TIME_DESC) {
      startedAt   { year month day }
      completedAt { year month day }
      media { id siteUrl type format title { userPreferred romaji } coverImage { extraLarge large } startDate { year } }
    }
  }
  manga_done: Page(perPage: 50) {
    mediaList(userName: $name, type: MANGA, status: COMPLETED, sort: UPDATED_TIME_DESC) {
      startedAt   { year month day }
      completedAt { year month day }
      media { id siteUrl type format title { userPreferred romaji } coverImage { extraLarge large } startDate { year } }
    }
  }
}`;

async function loadNow() {
  if (cache.now) { renderNow(cache.now); return; }

  // Грузим reviews.json параллельно — нужен для бейджей оценок
  if (!cache.reviews) {
    try {
      const res = await fetch("reviews.json");
      if (res.ok) {
        const data = await res.json();
        data.sort((a, b) => new Date(b.date) - new Date(a.date));
        cache.reviews = data;
      }
    } catch {}
  }

  try {
    const [alData, traktMoviesRaw, traktShowsRaw] = await Promise.all([
      gql(NOW_QUERY, { name: AL_USERNAME }),
      fetchTraktWatched("movie"),
      fetchTraktWatched("show")
    ]);

    const alCurrent = [
      ...(alData.anime_cur?.mediaList || []),
      ...(alData.manga_cur?.mediaList || [])
    ];
    const alCompleted = [
      ...(alData.anime_done?.mediaList || []),
      ...(alData.manga_done?.mediaList || [])
    ];

    const [enrichedMovies, enrichedShows] = await Promise.all([
      enrichTraktWithPosters(traktMoviesRaw.slice(0, 50), "movie"),
      enrichTraktWithPosters(traktShowsRaw.slice(0, 50), "show")
    ]);

    cache.now = { alCurrent, alCompleted, traktMovies: enrichedMovies, traktShows: enrichedShows };
    renderNow(cache.now);
  } catch (err) {
    document.getElementById("tab-now").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

function renderNow({ alCurrent, alCompleted, traktMovies, traktShows }) {
  const box = document.getElementById("tab-now");
  let html = "";

  // «В процессе» — без изменений
  if (alCurrent.length) {
    html += `<section class="group">
      <h2 class="section-title">В процессе</h2>
      <div class="grid-now">${alCurrent.map((e, i) => nowCard(e, i)).join("")}</div>
    </section>`;
  }

  // Объединяем и сортируем по дате просмотра
  const allCompleted = [
    ...alCompleted.map(e => {
      const c = e.completedAt;
      const sortDate = c?.year
        ? new Date(c.year, (c.month || 1) - 1, c.day || 1)
        : new Date(0);
      return { _src: "al", data: e, _sortDate: sortDate, _sortYear: c?.year || 0 };
    }),
    ...traktMovies.map(e => {
      const d = e.last_watched_at ? new Date(e.last_watched_at) : new Date(0);
      return { _src: "trakt", type: "movie", data: e, _sortDate: d, _sortYear: d.getFullYear() || 0 };
    }),
    ...traktShows.map(e => {
      const d = e.last_watched_at ? new Date(e.last_watched_at) : new Date(0);
      return { _src: "trakt", type: "show", data: e, _sortDate: d, _sortYear: d.getFullYear() || 0 };
    })
  ];
  allCompleted.sort((a, b) => b._sortDate - a._sortDate);

  if (allCompleted.length) {
    // Группируем по году просмотра
    const byYear = {};
    for (const item of allCompleted) {
      const y = item._sortYear || "—";
      if (!byYear[y]) byYear[y] = [];
      byYear[y].push(item);
    }
    const years = Object.keys(byYear).sort((a, b) => b - a);

    let completedHtml = "";
    years.forEach(year => {
      completedHtml += `<div class="year-divider">${year}</div>
        <div class="grid-now">
          ${byYear[year].map((item, i) => {
            if (item._src === "al") return completedCard(item.data, i);
            return traktCard(item.data, item.type, i);
          }).join("")}
        </div>`;
    });

    html += `<section class="group">
      <h2 class="section-title">Просмотрено / Прочитано</h2>
      ${completedHtml}
    </section>`;
  }

  if (!html) html = `<div class="state-box">Список пуст</div>`;
  box.innerHTML = html;
}

function nowCard(entry, index) {
  const m = entry.media;
  const img = coverUrl(m.coverImage);
  const t   = mediaTitle(m.title);
  const [tagClass, tagLabel] = entryTypeTag(entry);
  const done  = entry.progress ?? 0;
  const total = m.type === "ANIME" ? (m.episodes || 0) : (m.chapters || 0);
  const unit  = m.type === "ANIME" ? "эп." : "гл.";
  return `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="card" style="animation-delay:${Math.min(index*30,600)}ms">
    <span class="type-tag tag-${tagClass}">${tagLabel}</span>
    <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
    <div class="card-body">
      <div class="card-title">${t}</div>
      <div class="card-meta"><span class="progress-line">${done}${total ? " / "+total : ""} ${unit}</span></div>
    </div>
  </a>`;
}

function fmtDate(d) {
  if (!d?.year) return null;
  if (!d.month) return `${d.year}`;
  if (!d.day)   return new Date(d.year, d.month-1).toLocaleDateString("ru-RU",{month:"short",year:"numeric"});
  return new Date(d.year, d.month-1, d.day).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
}

function completedCard(entry, index) {
  const m = entry.media;
  const img = coverUrl(m.coverImage);
  const t   = mediaTitle(m.title);
  const [tagClass, tagLabel] = entryTypeTag(entry);

  // Бейдж даты просмотра
  const s = entry.startedAt, c = entry.completedAt;
  let watchBadge = "";
  if (c?.year) {
    const endStr   = fmtDate(c);
    const startStr = s?.year ? fmtDate(s) : null;
    const isSameDay = s?.year === c?.year && s?.month === c?.month && s?.day === c?.day;
    watchBadge = (startStr && !isSameDay) ? `${startStr} → ${endStr}` : endStr;
  }

  // Год выпуска
  const releaseYear = m.startDate?.year || "";

  // Оценка из reviews.json
  const grade = findGradeForTitle(t);

  return `<a href="${m.siteUrl}" target="_blank" rel="noopener" class="card" style="animation-delay:${Math.min(index*30,600)}ms">
    <span class="type-tag tag-${tagClass}">${tagLabel}</span>
    ${watchBadge ? `<span class="watch-badge">${watchBadge}</span>` : ""}
    <img src="${img}" alt="${t}" loading="lazy" onerror="this.src='${PH_TALL}'">
    ${gradeBadgeHtml(grade)}
    <div class="card-body">
      <div class="card-title">${t}</div>
      ${releaseYear ? `<div class="card-meta"><span>${releaseYear}</span></div>` : ""}
    </div>
  </a>`;
}

function traktCard(item, type, index) {
  const entry  = type === "movie" ? item.movie : item.show;
  const title  = item._title_ru || entry?.title || "—";
  const poster = item._poster || PH_TALL;
  const year   = item._year || entry?.year || "";
  const url    = item._tmdb_url || "#";
  const tagClass = type === "movie" ? "tag-movie" : "tag-show";
  const tagLabel = type === "movie" ? "Фильм" : "Сериал";

  // Бейдж даты просмотра
  let watchBadge = "";
  if (item.last_watched_at) {
    const d = new Date(item.last_watched_at);
    watchBadge = d.toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" });
  }

  // Оценка из reviews.json — ищем и по русскому, и по оригинальному названию
  const grade = findGradeForTitle(title) || findGradeForTitle(entry?.title);

  return `<a href="${url}" target="_blank" rel="noopener" class="card" style="animation-delay:${Math.min(index*20,600)}ms">
    <span class="type-tag ${tagClass}">${tagLabel}</span>
    ${watchBadge ? `<span class="watch-badge">${watchBadge}</span>` : ""}
    <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='${PH_TALL}'">
    ${gradeBadgeHtml(grade)}
    <div class="card-body">
      <div class="card-title">${title}</div>
      ${year ? `<div class="card-meta"><span>${year}</span></div>` : ""}
    </div>
  </a>`;
}

// ══════════════════════════════════════════════════
// FAVORITES — AniList + Trakt
// ══════════════════════════════════════════════════
const FAV_QUERY = `
query($name: String) {
  User(name: $name) {
    favourites {
      anime(perPage: 50) { nodes { id siteUrl format title { userPreferred romaji } coverImage { extraLarge large } } }
      manga(perPage: 50) { nodes { id siteUrl format title { userPreferred romaji } coverImage { extraLarge large } } }
      characters(perPage: 50) { nodes { id siteUrl name { full } image { large medium } } }
      staff(perPage: 50) { nodes { id siteUrl name { full } image { large medium } } }
    }
  }
}`;

async function loadFavorites() {
  if (cache.fav) { renderFavorites(cache.fav); return; }
  try {
    const [alData, traktMovies, traktShows] = await Promise.all([
      gql(FAV_QUERY, { name: AL_USERNAME }),
      traktFetch(`/users/${TRAKT_USERNAME}/ratings/movies?limit=50`).catch(() => []),
      traktFetch(`/users/${TRAKT_USERNAME}/ratings/shows?limit=50`).catch(() => [])
    ]);

    const favMovies = traktMovies.filter(r => r.rating >= 8);
    const favShows  = traktShows.filter(r => r.rating >= 8);

    const [enrichedMovies, enrichedShows] = await Promise.all([
      enrichTraktWithPosters(favMovies, "movie"),
      enrichTraktWithPosters(favShows, "show")
    ]);

    cache.fav = { al: alData.User.favourites, traktMovies: enrichedMovies, traktShows: enrichedShows };
    renderFavorites(cache.fav);
  } catch (err) {
    document.getElementById("tab-favorites").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">⚠️</div>Ошибка: ${err.message}</div>`;
  }
}

function renderFavorites({ al, traktMovies, traktShows }) {
  const box    = document.getElementById("tab-favorites");
  const animes = al.anime?.nodes || [];
  const mangas = al.manga?.nodes || [];
  const chars  = al.characters?.nodes || [];
  const staff  = al.staff?.nodes || [];

  const allTitles = [
    ...animes.map(item => ({ _src: "al-anime", data: item })),
    ...mangas.map(item => ({ _src: "al-manga", data: item })),
    ...traktMovies.map(item => ({ _src: "trakt", type: "movie", data: item })),
    ...traktShows.map(item => ({ _src: "trakt", type: "show", data: item }))
  ];

  let html = "";

  if (allTitles.length) {
    html += `<section class="group">
      <h2 class="section-title">Тайтлы</h2>
      <div class="grid-now">
        ${allTitles.map((item, i) => {
          if (item._src === "al-anime") {
            return `<a href="${item.data.siteUrl}" target="_blank" rel="noopener" class="card" style="animation-delay:${Math.min(i*25,500)}ms">
              <span class="type-tag tag-anime">Аниме</span>
              <img src="${coverUrl(item.data.coverImage)}" alt="${mediaTitle(item.data.title)}" loading="lazy" onerror="this.src='${PH_TALL}'">
              <div class="card-body"><div class="card-title">${mediaTitle(item.data.title)}</div></div>
            </a>`;
          }
          if (item._src === "al-manga") {
            const tagClass = NOVEL_FORMATS.includes(item.data.format) ? "tag-novel" : "tag-manga";
            const tagLabel = NOVEL_FORMATS.includes(item.data.format) ? "Ранобе" : "Манга";
            return `<a href="${item.data.siteUrl}" target="_blank" rel="noopener" class="card" style="animation-delay:${Math.min(i*25,500)}ms">
              <span class="type-tag ${tagClass}">${tagLabel}</span>
              <img src="${coverUrl(item.data.coverImage)}" alt="${mediaTitle(item.data.title)}" loading="lazy" onerror="this.src='${PH_TALL}'">
              <div class="card-body"><div class="card-title">${mediaTitle(item.data.title)}</div></div>
            </a>`;
          }
          return traktCard(item.data, item.type, i);
        }).join("")}
      </div>
    </section>`;
  }

  if (chars.length) {
    html += `<section class="group">
      <h2 class="section-title">Персонажи</h2>
      <div class="grid-chars">
        ${chars.map((item, i) => `<a href="${item.siteUrl}" target="_blank" rel="noopener" class="card card-char" style="animation-delay:${Math.min(i*25,500)}ms">
          <img src="${item.image?.large || item.image?.medium || PH_SQ}" alt="${item.name?.full || '—'}" loading="lazy" onerror="this.src='${PH_SQ}'">
          <div class="card-body"><div class="card-title">${item.name?.full || "—"}</div></div>
        </a>`).join("")}
      </div>
    </section>`;
  }

  if (staff.length) {
    html += `<section class="group">
      <h2 class="section-title">Персоны</h2>
      <div class="grid-chars">
        ${staff.map((item, i) => `<a href="${item.siteUrl}" target="_blank" rel="noopener" class="card card-char" style="animation-delay:${Math.min(i*25,500)}ms">
          <img src="${item.image?.large || item.image?.medium || PH_SQ}" alt="${item.name?.full || '—'}" loading="lazy" onerror="this.src='${PH_SQ}'">
          <div class="card-body"><div class="card-title">${item.name?.full || "—"}</div></div>
        </a>`).join("")}
      </div>
    </section>`;
  }

  box.innerHTML = html || `<div class="state-box">Фавориты не найдены</div>`;
}

// ══════════════════════════════════════════════════
// REVIEWS
// ══════════════════════════════════════════════════
async function loadReviews() {
  if (cache.reviews) { renderReviews(cache.reviews); return; }
  try {
    const res = await fetch("reviews.json");
    if (!res.ok) throw new Error("reviews.json не найден");
    const data = await res.json();
    data.sort((a, b) => new Date(b.date) - new Date(a.date));
    cache.reviews = data;
    renderReviews(data);
  } catch (err) {
    document.getElementById("tab-reviews").innerHTML =
      `<div class="state-box"><div style="font-size:2rem;margin-bottom:.75rem">📝</div>Отзывов пока нет.<br><span style="font-size:.8rem;margin-top:.5rem;display:block">Добавь записи в reviews.json</span></div>`;
  }
}

function renderReviews(reviews) {
  document.getElementById("tab-reviews").innerHTML = `
    <section class="group">
      <h2 class="section-title">Отзывы</h2>
      <div class="reviews-grid">${reviews.map((r, i) => reviewCard(r, i)).join("")}</div>
    </section>`;
}

function reviewCard(r, i) {
  const grade = GRADES[r.grade] || null;
  const tags = (r.tags || []);
  const tagsHtml = tags.length
    ? `<div class="review-tags">${tags.map(tag => {
        const info = TAGS_MAP[tag];
        const cls  = info ? TAG_CAT_CLASS[info.cat] : "rtag-special";
        const tip  = info ? info.tip : "";
        return `<span class="rtag ${cls}" data-tip="${tip}">${tag}</span>`;
      }).join("")}</div>`
    : "";
  const waifuHtml = r.favorites ? `<div class="review-waifu">Фавориты: <span>${r.favorites}</span></div>` : "";
  const typeColors = { anime:"var(--accent)", manga:"var(--yellow)", novel:"var(--green)", movie:"var(--red)", show:"var(--orange)" };
  const typeColor  = typeColors[r.type] || "var(--text-dim)";
  const dateStr    = r.date ? new Date(r.date).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}) : "";
  const sourceLabel = SOURCE_LABELS[r.source] || r.source || "Ссылка";
  const gradeHtml = grade
    ? `<div class="review-grade-bar">
        <div class="grade-square" style="background:${grade.color};box-shadow:0 0 8px ${grade.color}55"></div>
        <div style="flex:1">
          <div class="grade-name" style="color:${grade.color}">${grade.name}</div>
          <div class="grade-desc">${grade.desc}</div>
        </div>
        <div class="review-source-link"><span class="review-source-dot" style="background:${typeColor}"></span>${sourceLabel}</div>
      </div>`
    : `<div class="review-grade-bar"><div style="flex:1"></div><div class="review-source-link"><span class="review-source-dot" style="background:${typeColor}"></span>${sourceLabel}</div></div>`;

  return `<a href="${r.url}" target="_blank" rel="noopener" class="review-card"
    style="animation-delay:${Math.min(i*40,600)}ms;border-top:2px solid ${grade ? grade.color+"55" : "var(--border)"}">
    <div class="review-top">
      <div class="review-cover"><img src="${r.cover || PH_TALL}" alt="${r.title}" loading="lazy" onerror="this.src='${PH_TALL}'"></div>
      <div class="review-body">
        <div class="review-header"><div class="review-title">${r.title}</div></div>
        <div class="review-meta-row">
          ${r.format ? `<span class="review-format">${r.format}</span>` : ""}
          ${r.year   ? `<span class="review-date">${r.year}</span>` : ""}
          ${dateStr  ? `<span class="review-date" style="margin-left:auto">Прочитано: ${dateStr}</span>` : ""}
        </div>
        ${waifuHtml}
        <div class="review-preview">${r.preview || ""}</div>
      </div>
    </div>
    ${tagsHtml}
    ${gradeHtml}
  </a>`;
}

// ── СТАРТ ──────────────────────────────────────────
loadNow();
