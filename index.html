<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0c'/><rect x='0' y='0' width='6' height='2' fill='%238b1a1a'/><rect x='0' y='0' width='2' height='6' fill='%238b1a1a'/><rect x='26' y='30' width='6' height='2' fill='%238b1a1a'/><rect x='30' y='26' width='2' height='6' fill='%238b1a1a'/><text x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='900' font-style='italic' fill='%23f0ece6' text-anchor='middle'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══ NOIR PALETTE ════════════════════════════════ */
:root {
  --bg:       #0a0a0c;
  --bg2:      #0f0f12;
  --surface:  #111114;
  --surface2: #1a1a1f;
  --border:   #222228;
  --border2:  #333338;

  --red:      #8b1a1a;
  --red-hi:   #c0392b;
  --red-dim:  #5a1010;

  --text:     #b8b0a8;
  --text-dim: #4a4540;
  --text-hi:  #f0ece6;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  min-height: 100vh;
}

/* ══ HEADER ══════════════════════════════════════ */
header {
  text-align: center;
  padding: 3.5rem 1rem 2.5rem;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
header::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--red-dim) 20%, var(--red) 50%, var(--red-dim) 80%, transparent 100%);
}

.header-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .7rem;
}
.header-eyebrow::before,
.header-eyebrow::after { content: '—'; color: var(--border2); }

.logo {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(3rem, 8vw, 5.5rem);
  color: var(--text-hi);
  letter-spacing: .04em;
  line-height: 1;
}

.header-deco {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  margin-top: 1.2rem;
}
.header-deco span {
  width: 4px; height: 4px;
  transform: rotate(45deg);
  background: var(--border2);
}
.header-deco span:nth-child(3) {
  width: 6px; height: 6px;
  background: var(--red);
}
.header-deco::before { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--border2)); }
.header-deco::after  { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

/* ══ NAV ═════════════════════════════════════════ */
nav {
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 0 1rem;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,12,.95);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }

.tab-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 1.1rem 1.4rem;
  cursor: pointer;
  transition: color .25s, border-color .25s;
  white-space: nowrap;
  flex-shrink: 0;
  position: relative;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text-hi); border-bottom-color: var(--red); }
.tab-btn.active::before {
  content: '◆';
  font-size: .3rem;
  position: absolute;
  top: .6rem; left: 50%;
  transform: translateX(-50%);
  color: var(--red);
}

/* ══ LAYOUT ══════════════════════════════════════ */
main { max-width: 1800px; margin: 0 auto; padding: 2.5rem 2.5rem 6rem; }
.tab-content.hidden { display: none; }
section.group { margin-bottom: 3.5rem; }

.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text-hi);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.section-title::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--red); }
.section-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

.year-divider {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 1.6rem;
  color: var(--border2);
  margin: 2.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.year-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
.year-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

/* ══ GRIDS ═══════════════════════════════════════ */
.grid-now { display: grid; gap: .85rem; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px)  { .grid-now { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .grid-now { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .grid-now { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .grid-now { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .grid-now { grid-template-columns: repeat(7, 1fr); } }

.grid-chars { display: grid; gap: .85rem; grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px)  { .grid-chars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 860px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1100px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* ══ CARDS ═══════════════════════════════════════ */
.card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
  text-decoration: none;
  transition: border-color .25s, transform .25s;
  position: relative;
}
/* Уголки — тонкие, красные */
.card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 12px; height: 12px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
}
.card:hover::before,
.card:hover::after {
  border-color: var(--red);
  width: 16px; height: 16px;
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
  filter: grayscale(.15) brightness(.9);
  transition: filter .3s;
}
.card:hover img { filter: grayscale(0) brightness(.98); }
.card-char img  { aspect-ratio: 1/1; }

.card-body { padding: .6rem .7rem .7rem; background: var(--surface); }

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-hi);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  margin-top: .3rem;
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}
.card-grade-inline {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem;
  font-style: italic;
  font-weight: 600;
}

/* ══ TYPE TAGS ═══════════════════════════════════ */
.type-tag {
  position: absolute; top: 0; right: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .25rem .55rem;
  z-index: 3;
  background: rgba(10,10,12,.82);
  backdrop-filter: blur(8px);
}
.tag-anime, .tag-manga, .tag-novel, .tag-movie, .tag-show, .tag-manual, .tag-book {
  color: var(--text-hi);
  border-bottom: 1px solid rgba(240,236,230,.18);
  border-left:   1px solid rgba(240,236,230,.18);
}

.watch-badge {
  position: absolute; top: 0; left: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; font-weight: 500;
  color: rgba(240,236,230,.7);
  background: rgba(10,10,12,.82);
  border-bottom: 1px solid rgba(139,26,26,.25);
  border-right: 1px solid rgba(139,26,26,.25);
  padding: .25rem .52rem;
  backdrop-filter: blur(8px);
  z-index: 3;
  max-width: calc(100% - 64px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.progress-line {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--red-hi);
  font-weight: 500;
}

/* ══ STATE ═══════════════════════════════════════ */
.state-box {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
}
.spinner {
  width: 28px; height: 28px;
  border: 1px solid var(--border2);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .9s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ══ REVIEWS GRID ════════════════════════════════ */
.reviews-grid { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
@media (min-width: 700px)  { .reviews-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1050px) { .reviews-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1400px) { .reviews-grid { grid-template-columns: repeat(4, 1fr); } }

/* ══ REVIEW CARD ═════════════════════════════════ */
.review-card-wrap { position: relative; height: 100%; }

.review-card {
  display: flex; flex-direction: column; height: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: inherit;
  position: relative;
  animation: fadeUp .35s ease both;
  overflow: visible;
}
/* один уголок снизу-справа */
.review-card::after {
  content: '';
  position: absolute; bottom: -1px; right: -1px;
  width: 18px; height: 18px;
  pointer-events: none; z-index: 2;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
}

.review-top { display: flex; gap: 1.1rem; padding: 1.2rem; flex: 1; }
.review-cover {
  width: 150px; flex-shrink: 0;
  border-radius: 1px; overflow: hidden;
  border: 1px solid var(--border2);
  align-self: flex-start;
}
.review-cover img {
  width: 100%; aspect-ratio: 2/3;
  object-fit: cover; display: block;
  filter: grayscale(.1) brightness(.88);
}
.review-body { flex: 1; min-width: 0; }
.review-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; font-weight: 700;
  color: var(--text-hi); line-height: 1.25;
  margin-bottom: .35rem;
}
.review-meta-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; flex-wrap: wrap; }
.review-format { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--red-hi); text-transform: uppercase; letter-spacing: .1em; }
.review-dateline { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin-bottom: .45rem; }
.review-dateline span { color: var(--text-dim); }
.review-waifu { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--text); margin-bottom: .45rem; }
.review-waifu-label { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); }
.review-waifu span { color: var(--text-hi); font-style: normal; font-weight: 600; }
.review-preview {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem; font-weight: 300;
  color: var(--text); line-height: 1.7;
  margin-top: .5rem;
  display: -webkit-box;
  -webkit-line-clamp: 7;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ══ TAGS ════════════════════════════════════════ */
.review-tags {
  padding: .65rem 1.2rem;
  display: flex; flex-wrap: wrap; gap: .4rem;
  border-top: 1px solid var(--border);
  overflow: visible; position: relative; z-index: 2;
}
.rtag {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .55rem;
  border-radius: 1px;
  font-weight: 400;
  letter-spacing: .03em;
  white-space: nowrap;
  position: relative;
  cursor: default;
}
/* теги — все в единой серо-красной гамме */
.rtag-visual, .rtag-plot, .rtag-chars, .rtag-special {
  background: rgba(240,236,230,.05);
  color: #9a9490;
  border: 1px solid rgba(240,236,230,.12);
}

.rtag[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--surface2); color: var(--text);
  font-size: .68rem; padding: .35rem .7rem;
  border-radius: 2px; border: 1px solid var(--border2);
  white-space: nowrap; z-index: 9999;
  pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.8);
}
.rtag[data-tip]:hover::before {
  content: '';
  position: absolute; bottom: calc(100% + 1px); left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--border2); z-index: 21;
}

/* ══ GRADE BAR ═══════════════════════════════════ */
.review-grade-bar {
  display: flex; align-items: center; gap: .7rem;
  padding: .75rem 1.2rem;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
.grade-square {
  width: 10px; height: 10px;
  border-radius: 1px; flex-shrink: 0;
  transform: rotate(45deg);
}
.grade-chip {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gc); flex: 1;
  cursor: default; position: relative;
  min-width: 80px; white-space: nowrap;
}
.grade-chip[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 0;
  background: var(--surface2); color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem; font-style: italic; font-weight: 400;
  padding: .5rem .9rem; border-radius: 2px;
  border: 1px solid var(--border2); white-space: nowrap;
  z-index: 9999; pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.8);
}
.grade-chip[data-tip]:hover::before {
  content: '';
  position: absolute; bottom: calc(100% + 3px); left: 1rem;
  border: 5px solid transparent;
  border-top-color: var(--border2); z-index: 21;
}

/* ══ SOURCE BUTTONS ══════════════════════════════ */
.source-buttons { display: flex; gap: .4rem; flex-shrink: 0; }
.review-source-link {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem; letter-spacing: .05em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .75rem; border-radius: 1px;
  flex-shrink: 0; white-space: nowrap;
  text-decoration: none;
  transition: background .2s, color .2s, border-color .2s;
  border: 1px solid;
}
.source-bluesky  { background: rgba(100,120,180,.08); border-color: rgba(100,120,180,.25); color: #7090c0; }
.source-bluesky:hover  { background: rgba(100,120,180,.18); border-color: rgba(100,120,180,.5); color: #90b0e0; }
.source-teletype { background: rgba(180,176,170,.06); border-color: rgba(180,176,170,.2); color: #706860; }
.source-teletype:hover { background: rgba(180,176,170,.14); border-color: rgba(180,176,170,.4); color: #a09888; }
.source-other    { background: rgba(139,26,26,.08);  border-color: rgba(139,26,26,.25);  color: var(--red); }
.source-other:hover    { background: rgba(139,26,26,.18);  border-color: rgba(192,57,43,.5);   color: var(--red-hi); }

.source-dot-bluesky  { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: #7090c0; }
.source-dot-teletype { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: #706860; }
.source-dot-other    { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--red); }

/* ══ EDIT BUTTON ═════════════════════════════════ */
.review-edit-btn {
  position: absolute; top: -10px; right: -10px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-dim); font-size: .85rem;
  display: none; align-items: center; justify-content: center;
  text-decoration: none; transition: all .18s;
}
.review-card-wrap:hover .review-edit-btn { display: flex; }
.review-edit-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--text-hi); }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">Цифровой паспорт интересов</div>
  <div class="logo">TasteID</div>
  <div class="header-deco">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('tab-now', this)">Главная</button>
  <button class="tab-btn" onclick="switchTab('tab-favorites', this)">Любимое</button>
  <button class="tab-btn" onclick="switchTab('tab-reviews', this)">Отзывы</button>
</nav>

<main>
  <div id="tab-now"       class="tab-content"><div class="state-box"><div class="spinner"></div>Загружаем…</div></div>
  <div id="tab-favorites" class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем любимчиков…</div></div>
  <div id="tab-reviews"   class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем отзывы…</div></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cards.js"></script>
<script src="js/now.js"></script>
<script src="js/favorites.js"></script>
<script src="js/reviews.js"></script>

<script>
function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId).classList.remove("hidden");
  btn.classList.add("active");
  if (tabId === "tab-now")       loadNow();
  if (tabId === "tab-favorites") loadFavorites();
  if (tabId === "tab-reviews")   loadReviews();
}
loadNow();
</script>

</body>
</html>
