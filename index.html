<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Аниме Витрина</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0e12; color: #e2e8f0; font-family: system-ui, sans-serif; }
        .tier-S { background: #ff7f7f; color: #000; }
        .tier-A { background: #ffbf7f; color: #000; }
        .tier-B { background: #ffdf7f; color: #000; }
        .tier-C { background: #ffff7f; color: #000; }
        .status-watching { background: #22c55e; }
        .status-completed { background: #3b82f6; }
        .status-planned { background: #64748b; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-5xl mx-auto">

    <!-- НАСТРОЙКА ДАННЫХ (РЕДАКТИРУЙ ТОЛЬКО ЭТОТ БЛОК СКРИПТА) -->
    <script>
        const MY_DATA = {
            username: "Твой Никнейм",
            bio: "Добро пожаловать в мою личную берлогу. Здесь я собираю любимые тайтлы, веду трекер просмотра и составляю тир-листы.",
            links: [
                { name: "Twitter", url: "https://twitter.com/твой_юзернейм", color: "#1DA1F2" },
                { name: "Shikimori", url: "https://shikimori.one/твой_юзернейм", color: "#4a5568" }
            ],
            // Список твоих аниме. Добавляй, удаляй или меняй их тут:
            animeList: [
                {
                    title: "Атака титанов",
                    tier: "S", // Ранг: S, A, B, C
                    status: "completed", // Статус: watching (смотрю), completed (просмотрено), planned (в планах)
                    image: "https://images.shikimori.one/animes/original/16498.jpg", // Ссылка на обложку
                    score: "10/10"
                },
                {
                    title: "Клинок рассекающий демонов",
                    tier: "A",
                    status: "watching",
                    image: "https://images.shikimori.one/animes/original/38000.jpg",
                    score: "8/10"
                },
                {
                    title: "Человек-бензопила",
                    tier: "A",
                    status: "planned",
                    image: "https://images.shikimori.one/animes/original/44511.jpg",
                    score: "Жду"
                },
                {
                    title: "Магическая битва",
                    tier: "B",
                    status: "completed",
                    image: "https://images.shikimori.one/animes/original/40748.jpg",
                    score: "7/10"
                }
            ]
        };
    </script>

    <!-- ИНТЕРФЕЙС САЙТА (ЭТОТ КОД АВТОМАТИЧЕСКИ ВСЁ ОТРИСУЕТ) -->
    <header class="text-center my-8 border-b border-gray-800 pb-8">
        <h1 id="user-name" class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2"></h1>
        <p id="user-bio" class="text-gray-400 max-w-xl mx-auto mb-6 text-sm md:text-base"></p>
        <div id="user-links" class="flex justify-center gap-3"></div>
    </header>

    <main class="space-y-12">
        <!-- СЕКЦИЯ 1: ТИР-ЛИСТ -->
        <section>
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-purple-500 pl-3">Мой Тир-лист</h2>
            <div id="tier-container" class="bg-[#161920] rounded-xl overflow-hidden border border-gray-800 divide-y divide-gray-800">
                <!-- Строки тиров генерируются автоматически -->
            </div>
        </section>

        <!-- СЕКЦИЯ 2: МОЙ ТРЕКЕР (КАК НА ШИКИМОРИ) -->
        <section>
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-emerald-500 pl-3">Сейчас смотрю / Отслеживаю</h2>
            <div id="tracker-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <!-- Карточки генерируются автоматически -->
            </div>
        </section>
    </main>

    <script>
        // Рендеринг шапки
        document.getElementById('user-name').innerText = MY_DATA.username;
        document.getElementById('user-bio').innerText = MY_DATA.bio;
        
        const linksContainer = document.getElementById('user-links');
        MY_DATA.links.forEach(l => {
            linksContainer.innerHTML += `<a href="${l.url}" target="_blank" class="px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider text-white transition transform hover:scale-105" style="background-color: ${l.color}">${l.name}</a>`;
        });

        // Рендеринг Тир-листа
        const tiers = ['S', 'A', 'B', 'C'];
        const tierContainer = document.getElementById('tier-container');
        
        tiers.forEach(tier => {
            const tierAnime = MY_DATA.animeList.filter(a => a.tier === tier);
            let animeThumbs = '';
            
            tierAnime.forEach(a => {
                animeThumbs += `
                    <div class="relative group w-16 h-24 md:w-20 md:h-28 rounded overflow-hidden flex-shrink-0 shadow-lg">
                        <img src="${a.image}" alt="${a.title}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-opacity p-1 flex flex-col justify-between text-[10px] text-center">
                            <span class="font-bold truncate">${a.title}</span>
                            <span class="text-yellow-400">${a.score}</span>
                        </div>
                    </div>`;
            });

            tierContainer.innerHTML += `
                <div class="flex items-stretch min-h-[100px]">
                    <div class="tier-${tier} w-16 md:w-24 flex items-center justify-center font-black text-xl md:text-2xl flex-shrink-0">${tier}</div>
                    <div class="flex flex-wrap gap-3 p-3 items-center">${animeThumbs || '<span class="text-gray-600 text-sm">Пока пусто</span>'}</div>
                </div>`;
        });

        // Рендеринг Трекера
        const trackerGrid = document.getElementById('tracker-grid');
        const statusNames = { watching: "Смотрю", completed: "Просмотрено", planned: "В планах" };
        
        MY_DATA.animeList.forEach(a => {
            trackerGrid.innerHTML += `
                <div class="bg-[#161920] rounded-xl overflow-hidden border border-gray-800 flex flex-col group hover:border-gray-700 transition">
                    <div class="relative aspect-[3/4] overflow-hidden">
                        <img src="${a.image}" alt="${a.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-2 right-2 px-2 py-0.5 text-[10px] font-bold rounded text-white status-${a.status}">${statusNames[a.status]}</span>
                    </div>
                    <div class="p-3 flex-gpu flex flex-col justify-between flex-1">
                        <h3 class="font-bold text-sm md:text-base line-clamp-2">${a.title}</h3>
                        <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-800 text-xs">
                            <span class="text-gray-500">Оценка:</span>
                            <span class="text-yellow-400 font-bold">${a.score}</span>
                        </div>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
