<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══ NOIR PALETTE ════════════════════════════════ */
:root {
  --bg:       #0a0a0c;
  --bg2:      #0f0f12;
  --surface:  #111114;
  --surface2: #1a1a1f;
  --border:   #222228;
  --border2:  #333338;

  --red:      #8b1a1a;
  --red-hi:   #c0392b;
  --red-dim:  #5a1010;

  --text:     #b8b0a8;
  --text-dim: #4a4540;
  --text-hi:  #f0ece6;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  min-height: 100vh;
}

/* ══ HEADER ══════════════════════════════════════ */
header {
  text-align: center;
  padding: 3.5rem 1rem 2.5rem;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
header::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--red-dim) 20%, var(--red) 50%, var(--red-dim) 80%, transparent 100%);
}

.header-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .7rem;
}
.header-eyebrow::before,
.header-eyebrow::after { content: '—'; color: var(--border2); }

.logo {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(3rem, 8vw, 5.5rem);
  color: var(--text-hi);
  letter-spacing: .04em;
  line-height: 1;
}

.header-deco {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  margin-top: 1.2rem;
}
.header-deco span {
  width: 4px; height: 4px;
  transform: rotate(45deg);
  background: var(--border2);
}
.header-deco span:nth-child(3) {
  width: 6px; height: 6px;
  background: var(--red);
}
.header-deco::before { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--border2)); }
.header-deco::after  { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

/* ══ NAV ═════════════════════════════════════════ */
nav {
  display: flex;
  justify-content: center;
  gap: 0;
  padding: 0 1rem;
  border-bottom: 1px solid var(--border);
  background: rgba(10,10,12,.95);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }

.tab-btn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 1.1rem 1.4rem;
  cursor: pointer;
  transition: color .25s, border-color .25s;
  white-space: nowrap;
  flex-shrink: 0;
  position: relative;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text-hi); border-bottom-color: var(--red); }
.tab-btn.active::before {
  content: '◆';
  font-size: .3rem;
  position: absolute;
  top: .6rem; left: 50%;
  transform: translateX(-50%);
  color: var(--red);
}

/* ══ LAYOUT ══════════════════════════════════════ */
main { max-width: 1800px; margin: 0 auto; padding: 2.5rem 2.5rem 6rem; }
.tab-content.hidden { display: none; }
section.group { margin-bottom: 3.5rem; }

.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.3rem;
  color: var(--text-hi);
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.section-title::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--red); }
.section-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

.year-divider {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: 1.6rem;
  color: var(--border2);
  margin: 2.5rem 0 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.year-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border)); }
.year-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

/* ══ GRIDS ═══════════════════════════════════════ */
.grid-now { display: grid; gap: .85rem; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 640px)  { .grid-now { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 860px)  { .grid-now { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1060px) { .grid-now { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 1280px) { .grid-now { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1520px) { .grid-now { grid-template-columns: repeat(7, 1fr); } }

.grid-chars { display: grid; gap: .85rem; grid-template-columns: repeat(3, 1fr); }
@media (min-width: 640px)  { .grid-chars { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 860px)  { .grid-chars { grid-template-columns: repeat(6, 1fr); } }
@media (min-width: 1100px) { .grid-chars { grid-template-columns: repeat(8, 1fr); } }

/* ══ CARDS ═══════════════════════════════════════ */
.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
  text-decoration: none;
  transition: border-color .25s, transform .25s;
  position: relative;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 12px; height: 12px;
  border-top: 1px solid var(--red-dim);
  border-left: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card::after {
  content: '';
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px;
  border-bottom: 1px solid var(--red-dim);
  border-right: 1px solid var(--red-dim);
  z-index: 4; pointer-events: none;
  transition: border-color .25s, width .25s, height .25s;
}
.card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
}
.card:hover::before,
.card:hover::after {
  border-color: var(--red);
  width: 16px; height: 16px;
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
  filter: grayscale(.15) brightness(.9);
  transition: filter .3s;
  flex-shrink: 0;
}
.card:hover img { filter: grayscale(0) brightness(.98); }
.card-char img  { aspect-ratio: 1/1; }

.card-body {
  padding: .6rem .7rem .7rem;
  background: var(--surface);
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text-hi);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  flex: 1;
}
.card-meta {
  margin-top: auto;
  padding-top: .3rem;
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .3rem;
}
.card-grade-inline {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem;
  font-style: italic;
  font-weight: 600;
}

/* ══ TYPE TAGS ═══════════════════════════════════ */
.type-tag {
  position: absolute; top: 0; right: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .25rem .55rem;
  z-index: 3;
  background: rgba(10,10,12,.82);
  backdrop-filter: blur(8px);
}
.tag-anime, .tag-manga, .tag-novel, .tag-movie, .tag-show, .tag-manual, .tag-book {
  color: var(--text-hi);
  border-bottom: 1px solid rgba(240,236,230,.18);
  border-left:   1px solid rgba(240,236,230,.18);
}

.watch-badge {
  position: absolute; top: 0; left: 0;
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; font-weight: 500;
  color: rgba(240,236,230,.7);
  background: rgba(10,10,12,.82);
  border-bottom: 1px solid rgba(139,26,26,.25);
  border-right: 1px solid rgba(139,26,26,.25);
  padding: .25rem .52rem;
  backdrop-filter: blur(8px);
  z-index: 3;
  max-width: calc(100% - 64px);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.progress-line {
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  color: var(--red-hi);
  font-weight: 500;
}

/* ══ STATE ═══════════════════════════════════════ */
.state-box {
  text-align: center;
  padding: 5rem 2rem;
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-style: italic;
}
.spinner {
  width: 28px; height: 28px;
  border: 1px solid var(--border2);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .9s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp .3s ease both; }

/* ══ REVIEWS GRID ════════════════════════════════ */
.reviews-grid { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
@media (min-width: 700px)  { .reviews-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1050px) { .reviews-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1400px) { .reviews-grid { grid-template-columns: repeat(4, 1fr); } }

/* ══ REVIEW CARD ═════════════════════════════════ */
.review-card-wrap { position: relative; height: 100%; }

.review-card {
  display: flex; flex-direction: column; height: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: inherit;
  position: relative;
  animation: fadeUp .35s ease both;
  overflow: visible;
}

.review-top { display: flex; gap: 1.1rem; padding: 1.2rem; flex: 1; }
.review-cover {
  width: 150px; flex-shrink: 0;
  border-radius: 1px; overflow: hidden;
  border: 1px solid var(--border2);
  align-self: flex-start;
}
.review-cover img {
  width: 100%; aspect-ratio: 2/3;
  object-fit: cover; display: block;
  filter: grayscale(.1) brightness(.88);
}
.review-body { flex: 1; min-width: 0; }
.review-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; font-weight: 700;
  color: var(--text-hi); line-height: 1.25;
  margin-bottom: .35rem;
}
.review-meta-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .4rem; flex-wrap: wrap; }
.review-format { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--red-hi); text-transform: uppercase; letter-spacing: .1em; }
.review-dateline { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); margin-bottom: .45rem; }
.review-dateline span { color: var(--text-dim); }
.review-waifu { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: var(--text); margin-bottom: .45rem; }
.review-waifu-label { font-family: 'DM Sans', sans-serif; font-size: .72rem; color: var(--text-dim); }
.review-waifu span { color: var(--text-hi); font-style: normal; font-weight: 600; }
.review-preview {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem; font-weight: 300;
  color: var(--text); line-height: 1.7;
  margin-top: .5rem;
  display: -webkit-box;
  -webkit-line-clamp: 7;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ══ TAGS ════════════════════════════════════════ */
.review-tags {
  padding: .65rem 1.2rem;
  display: flex; flex-wrap: wrap; gap: .4rem;
  border-top: 1px solid var(--border);
  overflow: visible; position: relative; z-index: 2;
}
.rtag {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .55rem;
  border-radius: 1px;
  font-weight: 400;
  letter-spacing: .03em;
  white-space: nowrap;
  position: relative;
  cursor: default;
}
.rtag-visual, .rtag-plot, .rtag-chars, .rtag-special {
  background: rgba(240,236,230,.07);
  color: #c8c0b8;
  border: 1px solid rgba(240,236,230,.15);
}

.rtag[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--surface2); color: var(--text);
  font-size: .68rem; padding: .35rem .7rem;
  border-radius: 2px; border: 1px solid var(--border2);
  white-space: nowrap; z-index: 9999;
  pointer-events: none; box-shadow: 0 6px 24px rgba(0,0,0,.8);
}
.rtag[data-tip]:hover::before {
  content: '';
  position: absolute; bottom: calc(100% + 1px); left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--border2); z-index: 21;
}

/* ══ GRADE BAR ═══════════════════════════════════ */
.review-grade-bar {
  display: flex; align-items: center; gap: .7rem;
  padding: .75rem 1.2rem;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
.grade-square {
  width: 10px; height: 10px;
  border-radius: 1px; flex-shrink: 0;
  transform: rotate(45deg);
}
.grade-chip {
  font-family: 'Playfair Display', serif;
  font-size: 1rem; font-weight: 700;
  color: var(--gc); flex: 1;
  cursor: default; position: relative;
  min-width: 80px; white-space: nowrap;
}
.grade-chip[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 0;
  background: var(--surface2); color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: .95rem; font-style: italic; font-weight: 400;
  padding: .5rem .9rem; border-radius: 2px;
  border: 1px solid var(--border2); white-space: nowrap;
  z-index: 9999; pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.8);
}
.grade-chip[data-tip]:hover::before {
  content: '';
  position: absolute; bottom: calc(100% + 3px); left: 1rem;
  border: 5px solid transparent;
  border-top-color: var(--border2); z-index: 21;
}

/* ══ SOURCE BUTTONS ══════════════════════════════ */
.source-buttons { display: flex; gap: .4rem; flex-shrink: 0; }
.review-source-link {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem; letter-spacing: .05em; text-transform: uppercase;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .75rem; border-radius: 1px;
  flex-shrink: 0; white-space: nowrap;
  text-decoration: none;
  transition: background .2s, color .2s, border-color .2s;
  border: 1px solid;
}
.source-bluesky  { background: rgba(100,120,180,.08); border-color: rgba(100,120,180,.25); color: #7090c0; }
.source-bluesky:hover  { background: rgba(100,120,180,.18); border-color: rgba(100,120,180,.5); color: #90b0e0; }
.source-teletype { background: rgba(180,176,170,.06); border-color: rgba(180,176,170,.2); color: #706860; }
.source-teletype:hover { background: rgba(180,176,170,.14); border-color: rgba(180,176,170,.4); color: #a09888; }
.source-other    { background: rgba(139,26,26,.08);  border-color: rgba(139,26,26,.25);  color: var(--red); }
.source-other:hover    { background: rgba(139,26,26,.18);  border-color: rgba(192,57,43,.5);   color: var(--red-hi); }

.source-dot-bluesky  { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: #7090c0; }
.source-dot-teletype { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: #706860; }
.source-dot-other    { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; background: var(--red); }

/* ══ EDIT BUTTON ═════════════════════════════════ */
.review-edit-btn {
  position: absolute; top: -10px; right: -10px; z-index: 10;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-dim); font-size: .85rem;
  display: none; align-items: center; justify-content: center;
  text-decoration: none; transition: all .18s;
}
.review-card-wrap:hover .review-edit-btn { display: flex; }
.review-edit-btn:hover { background: var(--red-dim); border-color: var(--red); color: var(--text-hi); }
.review-card-wrap .card { height: 100%; }

/* ══ STATS ═══════════════════════════════════════ */
.stat-section { margin-bottom: 3.5rem; animation: fadeUp .4s ease both; }

.stat-total { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 2rem; }
.stat-total-num {
  font-family: 'Playfair Display', serif;
  font-weight: 900; font-style: italic;
  font-size: clamp(3.5rem, 8vw, 6rem);
  color: var(--text-hi); line-height: 1;
}
.stat-total-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .85rem; letter-spacing: .2em;
  text-transform: uppercase; color: var(--text-dim);
}

.stat-counters { display: flex; flex-wrap: wrap; gap: 1px; border: 1px solid var(--border); }
.stat-counter {
  flex: 1; min-width: 80px; padding: 1rem 1.2rem;
  background: var(--surface); text-align: center;
  border-right: 1px solid var(--border);
}
.stat-counter:last-child { border-right: none; }
.stat-counter-val {
  font-family: 'Playfair Display', serif;
  font-size: 2rem; font-weight: 900; color: var(--text-hi); line-height: 1;
}
.stat-counter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--text-dim); margin-top: .35rem;
}

.stat-donut-wrap { display: flex; align-items: center; gap: 3rem; flex-wrap: wrap; }
.stat-donut-svg { width: 200px; height: 200px; flex-shrink: 0; }
.donut-center-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; fill: var(--text-hi); }
.donut-center-label { font-family: 'DM Sans', sans-serif; font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; fill: var(--text-dim); }
.donut-legend { display: flex; flex-direction: column; gap: .65rem; }
.donut-legend-item { display: flex; align-items: center; gap: .6rem; font-family: 'DM Sans', sans-serif; font-size: .8rem; }
.donut-dot { width: 8px; height: 8px; border-radius: 1px; transform: rotate(45deg); flex-shrink: 0; }
.donut-legend-label { color: var(--text); flex: 1; }
.donut-legend-val   { color: var(--text-hi); font-weight: 500; min-width: 24px; text-align: right; }
.donut-legend-pct   { color: var(--text-dim); min-width: 36px; text-align: right; }

.year-bars-wrap {
  display: flex; align-items: flex-end; gap: 6px;
  overflow-x: auto; padding-bottom: .5rem;
  scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
  min-height: 180px;
}
.year-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
.year-bar-track {
  width: 32px; height: 140px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;
}
.year-bar-stack {
  width: 100%;
  border-radius: 1px 1px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column-reverse;
  min-height: 2px;
}
.year-bar-seg {
  width: 100%;
  min-height: 1px;
}
.year-bar-val   { font-family: 'DM Sans', sans-serif; font-size: .65rem; color: var(--text-dim); line-height: 1; }
.year-bar-label { font-family: 'DM Sans', sans-serif; font-size: .6rem; color: var(--text-dim); writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .05em; }

.grade-bars { display: flex; flex-direction: column; gap: .75rem; }
.grade-row  { display: flex; align-items: center; gap: 1rem; }
.grade-row-label { font-family: 'Cormorant Garamond', serif; font-size: .95rem; font-weight: 600; font-style: italic; min-width: 140px; text-align: right; flex-shrink: 0; }
.grade-row-track { flex: 1; height: 6px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
.grade-row-bar   { height: 100%; width: 0%; }
.grade-row-val   { font-family: 'DM Sans', sans-serif; font-size: .75rem; color: var(--text-dim); min-width: 20px; text-align: right; }

.stat-tag-cloud { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.stat-tag { transition: opacity .2s, transform .2s; cursor: default; }
.stat-tag:hover { opacity: .8; transform: translateY(-1px); }
.stat-tag-cnt { font-size: .65em; opacity: .6; margin-left: .2em; }

/* ══ TIERLIST ════════════════════════════════════ */
.tl-filters {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: 1.8rem;
}
.tl-filter {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1px;
  padding: .4rem .9rem;
  cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.tl-filter:hover { color: var(--text); border-color: var(--border2); }
.tl-filter.active { color: var(--text-hi); border-color: var(--red-dim); background: var(--surface2); }

.tl-rows { display: flex; flex-direction: column; gap: .7rem; }

.tl-row {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: 2px;
  overflow: hidden;
  animation: fadeUp .35s ease both;
  position: relative;
}
.tl-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--tl-color, var(--red-dim));
  opacity: .6;
}

.tl-label {
  width: 120px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem .7rem;
  border-right: 1px solid var(--border);
  background: var(--surface);
  position: relative;
  overflow: hidden;
  gap: .3rem;
}
.tl-label::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--tl-color, #888);
  opacity: .05;
  pointer-events: none;
}
.tl-label-dot {
  width: 5px; height: 5px;
  border-radius: 1px;
  transform: rotate(45deg);
  background: var(--tl-color, var(--red));
  flex-shrink: 0;
}
.tl-label-name {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: .92rem;
  color: var(--tl-color, var(--text-hi));
  text-align: center;
  line-height: 1.2;
}
.tl-label-count {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem;
  letter-spacing: .1em;
  color: var(--text-dim);
}

.tl-cards {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  gap: .5rem;
  padding: .7rem;
  background: var(--surface);
  min-height: 72px;
  align-content: flex-start;
}

.tl-empty {
  display: flex;
  align-items: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: .9rem;
  font-style: italic;
  color: var(--text-dim);
  padding: .5rem;
}

/* ── Постер в тир-листе ── */
.tl-poster {
  width: 100px;
  flex-shrink: 0;
  position: relative;
  cursor: default;
  border-radius: 1px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: border-color .2s, transform .2s, z-index 0s;
  animation: fadeUp .25s ease both;
}
.tl-poster::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 9px; height: 9px;
  border-top: 1px solid var(--tl-color, var(--red-dim));
  border-left: 1px solid var(--tl-color, var(--red-dim));
  z-index: 4; pointer-events: none;
  opacity: .5;
  transition: opacity .2s, width .2s, height .2s;
}
.tl-poster:hover {
  border-color: var(--tl-color, var(--border2));
  transform: translateY(-5px) scale(1.05);
  z-index: 20;
}
.tl-poster:hover::before { opacity: 1; width: 13px; height: 13px; }

.tl-poster img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  filter: grayscale(.2) brightness(.82);
  transition: filter .25s;
}
.tl-poster:hover img { filter: grayscale(0) brightness(.98); }

/* ── Тултип тир-листа ── */
.tl-tooltip {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .85rem 1.05rem;
  pointer-events: none;
  z-index: 9999;
  max-width: 220px;
  min-width: 160px;
  box-shadow: 0 12px 40px rgba(0,0,0,.9);
  opacity: 0;
  transition: opacity .12s;
}
.tl-tooltip.visible { opacity: 1; }
.tl-tt-title {
  font-family: 'Playfair Display', serif;
  font-size: .92rem; font-weight: 700;
  color: var(--text-hi); line-height: 1.25;
  margin-bottom: .28rem;
}
.tl-tt-grade {
  font-family: 'Cormorant Garamond', serif;
  font-size: .82rem; font-style: italic; font-weight: 600;
  margin-bottom: .2rem;
}
.tl-tt-desc {
  font-family: 'Cormorant Garamond', serif;
  font-size: .78rem; color: var(--text-dim);
  font-style: italic; line-height: 1.5;
}
.tl-tt-meta {
  font-family: 'DM Sans', sans-serif;
  font-size: .58rem; color: var(--text-dim);
  margin-top: .28rem; letter-spacing: .04em;
}

@media (max-width: 600px) {
  .tl-label { width: 76px; padding: .7rem .4rem; }
  .tl-label-name { font-size: .78rem; }
  .tl-poster { width: 52px; }
}
  /* ══ REVIEW FILTERS ══════════════════════════════ */
.rv-filters {
  display: flex;
  flex-direction: column;
  gap: .75rem;
  margin-bottom: 2rem;
  padding: 1.1rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
}
.rv-filter-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .4rem;
}
.rv-filter-label {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  min-width: 70px;
  flex-shrink: 0;
}
.rv-filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  padding: .22rem .65rem;
  border-radius: 1px;
  border: 1px solid var(--border2);
  background: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .03em;
}
.rv-filter-btn:hover { color: var(--text); border-color: var(--border2); }
.rv-filter-btn.active {
  background: rgba(139,26,26,.15);
  border-color: var(--red);
  color: var(--text-hi);
}
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">Цифровой паспорт интересов</div>
  <a href="/" class="logo" style="text-decoration:none">TasteID</a>
  <div class="header-deco">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('tab-now', this)">Главная</button>
  <button class="tab-btn" onclick="switchTab('tab-favorites', this)">Любимое</button>
  <button class="tab-btn" onclick="switchTab('tab-reviews', this)">Отзывы</button>
  <button class="tab-btn" onclick="switchTab('tab-stats', this)">Статистика</button>
  <button class="tab-btn" onclick="switchTab('tab-tierlist', this)">Тир-лист</button>
</nav>

<main>
  <div id="tab-now"       class="tab-content"><div class="state-box"><div class="spinner"></div>Загружаем…</div></div>
  <div id="tab-favorites" class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем любимчиков…</div></div>
  <div id="tab-reviews"   class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем отзывы…</div></div>
  <div id="tab-stats"     class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Считаем…</div></div>
  <div id="tab-tierlist"  class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем рецензии…</div></div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cards.js"></script>
<script src="js/now.js"></script>
<script src="js/favorites.js"></script>
<script src="js/reviews.js"></script>
<script src="js/stats.js"></script>
<script src="js/tierlist.js"></script>

<script>
function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  document.getElementById(tabId).classList.remove("hidden");
  btn.classList.add("active");
  if (tabId === "tab-now")       loadNow();
  if (tabId === "tab-favorites") loadFavorites();
  if (tabId === "tab-reviews")   loadReviews();
  if (tabId === "tab-stats")     loadStats();
  if (tabId === "tab-tierlist")  loadTierlist();
}
document.querySelector(".tab-btn.active").click();
</script>

</body>
</html>
