<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="header-eyebrow">Цифровой паспорт интересов</div>
  <div class="logo">TasteID</div>
  <div class="header-deco">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</header>

<nav>
  <button class="tab-btn active" onclick="switchTab('tab-now', this)">Главная</button>
  <button class="tab-btn" onclick="switchTab('tab-favorites', this)">Любимое</button>
  <button class="tab-btn" onclick="switchTab('tab-reviews', this)">Отзывы</button>
</nav>

<main>
  <div id="tab-now"       class="tab-content"><div class="state-box"><div class="spinner"></div>Загружаем…</div></div>
  <div id="tab-favorites" class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем любимчиков…</div></div>
  <div id="tab-reviews"   class="tab-content hidden"><div class="state-box"><div class="spinner"></div>Загружаем отзывы…</div></div>
</main>

<!-- Load all modules in dependency order -->
<script src="js/config.js"></script>
<script src="js/cache.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/reviews.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>

</body>
</html>
