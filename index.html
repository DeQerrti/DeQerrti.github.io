<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeQerrti - Личный Хаб</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: system-ui, -apple-system, sans-serif; }
        .tab-btn.active { color: #66fcf1; border-color: #66fcf1; background-color: rgba(102, 252, 241, 0.05); }
        .status-watching { background-color: #0284c7; color: #fff; }
        .status-completed { background-color: #16a34a; color: #fff; }
        .status-planned { background-color: #4b5563; color: #fff; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ ДАННЫМИ (РЕДАКТИРУЙ ТОЛЬКО ЭТОТ БЛОК) -->
    <script>
        const MY_DATA = {
            username: "DeQerrti",
            bio: "Мой личный архив. Здесь я отслеживаю текущий прогресс, делюсь отзывами и храню любимые медиа без риска их потерять.",
            links: [
                { name: "Twitter", url: "https://twitter.com/твой_юзернейм", color: "#1DA1F2" },
                { name: "Shikimori", url: "https://shikimori.one/твой_юзернейм", color: "#4a5568" }
            ],
            
            // 1. ТРЕКЕР (ГЛАВНАЯ)
            tracker: [
                {
                    title: "Атака титанов",
                    type: "аниме", 
                    status: "completed",
                    progress: "Финал. Часть 3", 
                    score: "10/10",
                    image: "https://images.shikimori.one/animes/original/16498.jpg"
                },
                {
                    title: "Клинок рассекающий демонов",
                    type: "аниме",
                    status: "watching",
                    progress: "4 сезон, 5 серия",
                    score: "8/10",
                    image: "https://images.shikimori.one/animes/original/38000.jpg"
                }
            ],

            // 2. ФАВОРИТЫ
            favorites: {
                anime: [
                    { title: "Евангелион", desc: "Лучшая психологическая драма", image: "https://images.shikimori.one/animes/original/30.jpg" }
                ],
                games: [
                    { title: "Elden Ring", desc: "Лучший открытый мир", image: "https://images.shikimori.one/animes/original/49303.jpg" }
                ],
                characters: [
                    { title: "Леви Аккерман", desc: "Сильнейший боец человечества", image: "https://images.shikimori.one/animes/original/16498.jpg" }
                ]
            },

            // 3. ОТЗЫВЫ
            reviews: [
                {
                    title: "Мнение о Elden Ring: Shadow of the Erdtree",
                    tag: "игры",
                    date: "2026-06-01",
                    text: "Сложность выкручена на предел. Дизайн локаций вертикальный и запутанный, исследовать одно удовольствие."
                }
            ],

            // 4. ТИР-ЛИСТЫ ИЗ ОБСИДИАНА
            tierlists: [
                {
                    title: "Duet Night Abyss",
                    desc: "Тир-лист персонажей актуального патча",
                    image: "duet-night.png" 
                },
                {
                    title: "Morimens",
                    desc: "Моя личная оценка ростера",
                    image: "morimens.png"
                }
            ],

            // 5. КАЛЕНДАРЬ ХРОНОЛОГИИ (ИСТОРИЯ ПРОСМОТРА / ЧТЕНИЯ / ИГР)
            history: [
                {
                    date: "15 Июня 2026",
                    title: "Магическая битва (Сезон 2)",
                    type: "аниме",
                    event: "Завершил просмотр",
                    comment: "Эпичный финал арки Сибуи, побежал писать отзыв.",
                    image: "https://images.shikimori.one/animes/original/40748.jpg"
                },
                {
                    date: "01 Июня 2026",
                    title: "Elden Ring: Shadow of the Erdtree",
                    type: "игра",
                    event: "Начал прохождение DLC",
                    comment: "Первый же босс размотал меня за 10 секунд. Прекрасно.",
                    image: "https://images.shikimori.one/animes/original/49303.jpg"
                },
                {
                    date: "20 Мая 2026",
                    title: "Человек-бензопила (Том 12)",
                    type: "манга",
                    event: "Прочитал полностью",
                    comment: "Начало второй части интригует, Аса Митака — отличный персонаж.",
                    image: "https://images.shikimori.one/animes/original/44511.jpg"
                }
            ]
        };
    </script>

    <!-- ШАПКА САЙТА -->
    <header class="text-center my-6 border-b border-gray-800 pb-6">
        <h1 id="header-name" class="text-4xl font-black tracking-wide text-[#66fcf1] mb-2"></h1>
        <p id="header-bio" class="text-gray-400 max-w-xl mx-auto text-sm mb-4"></p>
        <div id="header-links" class="flex justify-center gap-3"></div>
    </header>

    <!-- НАВИГАЦИЯ -->
    <nav class="flex justify-center gap-2 border-b border-gray-800 mb-8 overflow-x-auto whitespace-nowrap">
        <button onclick="switchTab('tab-tracker')" class="tab-btn active px-4 py-3 font-semibold text-sm border-b-2 border-transparent transition-all">🏠 Трекер</button>
        <button onclick="switchTab('tab-favorites')" class="tab-btn px-4 py-3 font-semibold text-sm border-b-2 border-transparent transition-all">⭐ Фавориты</button>
        <button onclick="switchTab('tab-reviews')" class="tab-btn px-4 py-3 font-semibold text-sm border-b-2 border-transparent transition-all">📝 Отзывы</button>
        <button onclick="switchTab('tab-tierlists')" class="tab-btn px-4 py-3 font-semibold text-sm border-b-2 border-transparent transition-all">📊 Мои Тир-листы</button>
        <button onclick="switchTab('tab-history')" class="tab-btn px-4 py-3 font-semibold text-sm border-b-2 border-transparent transition-all">📅 История</button>
    </nav>

    <!-- СОДЕРЖИМОЕ -->
    <main>
        <div id="tab-tracker" class="tab-content grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>

        <div id="tab-favorites" class="tab-content hidden space-y-8">
            <div>
                <h3 class="text-xl font-bold mb-4 text-[#66fcf1] border-l-4 border-[#66fcf1] pl-2">Любимое Аниме</h3>
                <div id="fav-anime" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
            <div>
                <h3 class="text-xl font-bold mb-4 text-[#66fcf1] border-l-4 border-[#66fcf1] pl-2">Любимые Игры</h3>
                <div id="fav-games" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
            <div>
                <h3 class="text-xl font-bold mb-4 text-[#66fcf1] border-l-4 border-[#66fcf1] pl-2">Любимые Персонажи</h3>
                <div id="fav-chars" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>

        <div id="tab-reviews" class="tab-content hidden space-y-6">
            <div id="reviews-container" class="space-y-4"></div>
        </div>

        <div id="tab-tierlists" class="tab-content hidden space-y-8">
            <div id="tierlists-container" class="grid grid-cols-1 gap-8"></div>
        </div>

        <!-- НОВАЯ ВКЛАДКА: КАЛЕНДАРЬ ИСТОРИИ -->
        <div id="tab-history" class="tab-content hidden max-w-2xl mx-auto px-2">
            <div class="relative border-l-2 border-[#66fcf1]/30 ml-4 md:ml-32 space-y-8">
                <!-- Сюда генерируются события хронологии -->
                <div id="history-container" class="space-y-8"></div>
            </div>
        </div>
    </main>

    <!-- ДВИЖКОВАЯ ЛОГИКА -->
    <script>
        document.getElementById('header-name').innerText = MY_DATA.username;
        document.getElementById('header-bio').innerText = MY_DATA.bio;
        const linksBox = document.getElementById('header-links');
        MY_DATA.links.forEach(l => {
            linksBox.innerHTML += `<a href="${l.url}" target="_blank" class="px-3 py-1.5 text-xs font-bold rounded-md text-white transition-transform hover:scale-105" style="background-color: ${l.color}">${l.name}</a>`;
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }

        const trackerBox = document.getElementById('tab-tracker');
        const statusMap = { watching: "В процессе", completed: "Завершено", planned: "В планах" };
        MY_DATA.tracker.forEach(item => {
            const isLive = item.status === 'watching';
            trackerBox.innerHTML += `
                <div class="bg-[#1f2833]/40 rounded-xl overflow-hidden border border-gray-800 flex flex-col group">
                    <div class="relative aspect-[3/4] overflow-hidden bg-gray-900">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-2 right-2 text-[10px] font-black px-2 py-0.5 rounded status-${item.status}">${statusMap[item.status]}</span>
                        <span class="absolute bottom-2 left-2 text-[10px] bg-black/70 px-1.5 py-0.5 rounded text-gray-400 uppercase tracking-wider">${item.type}</span>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <h4 class="font-bold text-sm text-white line-clamp-2 mb-2">${item.title}</h4>
                        <div class="text-xs pt-2 border-t border-gray-800/60 space-y-1">
                            <div class="flex justify-between"><span class="text-gray-500">${isLive ? 'Прогресс:' : 'Оценка:'}</span><span class="${isLive ? 'text-[#66fcf1]' : 'text-yellow-400'} font-semibold">${isLive ? item.progress : item.score}</span></div>
                        </div>
                    </div>
                </div>`;
        });

        const renderFavs = (targetId, list) => {
            const box = document.getElementById(targetId);
            list.forEach(item => {
                box.innerHTML += `
                    <div class="bg-[#1f2833]/20 border border-gray-800 rounded-xl p-3 flex gap-4 items-center">
                        <img src="${item.image}" class="w-16 h-20 object-cover rounded-lg shadow-md bg-gray-900 flex-shrink-0">
                        <div>
                            <h4 class="font-bold text-white text-base">${item.title}</h4>
                            <p class="text-xs text-gray-400 mt-1">${item.desc}</p>
                        </div>
                    </div>`;
            });
        };
        renderFavs('fav-anime', MY_DATA.favorites.anime);
        renderFavs('fav-games', MY_DATA.favorites.games);
        renderFavs('fav-chars', MY_DATA.favorites.characters);

        const container = document.getElementById('reviews-container');
        MY_DATA.reviews.forEach(r => {
            container.innerHTML += `
                <div class="bg-[#1f2833]/30 border border-gray-800 rounded-xl p-4 space-y-2">
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-white text-base">${r.title}</h4>
                        <span class="text-[10px] font-mono text-gray-500">${r.date}</span>
                    </div>
                    <p class="text-sm text-gray-300 leading-relaxed">${r.text}</p>
                    <div class="pt-1"><span class="text-[10px] bg-gray-800 px-2 py-0.5 rounded text-[#66fcf1] font-medium">#${r.tag}</span></div>
                </div>`;
        });

        const tlContainer = document.getElementById('tierlists-container');
        MY_DATA.tierlists.forEach(tl => {
            tlContainer.innerHTML += `
                <div class="bg-[#1f2833]/10 border border-gray-800 rounded-2xl p-4 md:p-6 space-y-4">
                    <div>
                        <h4 class="text-xl font-bold text-white">${tl.title}</h4>
                        <p class="text-xs text-gray-400 mt-1">${tl.desc}</p>
                    </div>
                    <div class="overflow-x-auto bg-[#0b0c10] p-2 rounded-xl border border-gray-900 shadow-inner">
                        <img src="${tl.image}" alt="${tl.title}" class="max-w-full h-auto object-contain mx-auto rounded-lg" loading="lazy">
                    </div>
                </div>`;
        });

        // Логика отрисовки Хронологического Календаря
        const histContainer = document.getElementById('history-container');
        MY_DATA.history.forEach(h => {
            histContainer.innerHTML += `
                <div class="relative pl-6 md:pl-8 group">
                    <!-- Неоновая точка на линии -->
                    <div class="absolute -left-[7px] top-1.5 w-3 h-3 rounded-full bg-[#66fcf1] border-2 border-[#0b0c10] group-hover:bg-white transition-colors shadow-[0_0_8px_#66fcf1]"></div>
                    
                    <!-- Блок даты для больших экранов -->
                    <div class="hidden md:block absolute -left-32 top-0.5 w-24 text-right text-xs font-bold text-gray-500 font-mono">${h.date}</div>
                    
                    <!-- Сама карточка события -->
                    <div class="bg-[#1f2833]/20 border border-gray-800/80 rounded-xl p-4 flex gap-4 items-start hover:border-[#66fcf1]/30 transition-all">
                        <img src="${h.image}" class="w-14 h-20 object-cover rounded-lg bg-gray-900 flex-shrink-0 shadow-md">
                        <div class="space-y-1 flex-grow">
                            <!-- Дата для мобильных устройств внутри карточки -->
                            <div class="block md:hidden text-[10px] font-bold text-gray-500 font-mono mb-1">${h.date}</div>
                            <div class="flex flex-wrap items-center gap-x-2">
                                <h4 class="font-bold text-white text-sm sm:text-base">${h.title}</h4>
                                <span class="text-[10px] bg-gray-800 px-1.5 py-0.2 rounded text-gray-400 uppercase tracking-wider">${h.type}</span>
                            </div>
                            <div class="text-xs font-semibold text-[#66fcf1]">${h.event}</div>
                            <p class="text-xs sm:text-sm text-gray-400 leading-relaxed pt-1">${h.comment}</p>
                        </div>
                    </div>
                </div>`;
        });
    </script>
</body>
</html>
