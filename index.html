<script>
const USERNAME = "Qerrti";
const SHIKI    = "https://shikimori.one";
const API      = `${SHIKI}/api`;
const ANILIST  = "https://graphql.anilist.co";

const PH_TALL = "https://placehold.co/300x420/0f1219/4a5568?text=?";
const PH_SQ   = "https://placehold.co/300x300/0f1219/4a5568?text=?";

const cache = { tracker: null, favorites: null };

// ── FETCH ───────────────────────────────
async function shikiFetch(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    return res.json();
}

// ── ANILIST COVER (ANIME + MANGA) ───────
async function fetchAniListCovers(ids, type = "ANIME") {
    if (!ids.length) return {};

    const query = `
    query ($ids: [Int], $type: MediaType) {
        Page(perPage: 50) {
            media(idMal_in: $ids, type: $type) {
                idMal
                coverImage { large }
            }
        }
    }`;

    const res = await fetch(ANILIST, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables: { ids, type } })
    });

    const json = await res.json();
    const map = {};

    for (const m of json?.data?.Page?.media || []) {
        map[m.idMal] = m.coverImage?.large || null;
    }

    return map;
}

// ── ANILIST CHARACTERS BY NAME ─────────
async function fetchAniListCharacters(names) {
    const map = {};

    const query = `
    query ($search: String) {
        Page(perPage: 1) {
            characters(search: $search) {
                image { large }
            }
        }
    }`;

    for (const name of names) {
        try {
            const res = await fetch(ANILIST, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    query,
                    variables: { search: name }
                })
            });

            const json = await res.json();
            const c = json?.data?.Page?.characters?.[0];

            if (c?.image?.large) {
                map[name] = c.image.large;
            }

        } catch {}
    }

    return map;
}

// ── IMAGE FALLBACK ───────────────────────
function imgFallback(img, square = false) {
    const ph = square ? PH_SQ : PH_TALL;

    if (!img) return ph;

    const raw =
        img.original ||
        img.preview ||
        img.x96 ||
        img.x48;

    if (!raw || raw.includes("missing")) return ph;

    return raw.startsWith("http")
        ? raw
        : `${SHIKI}${raw}`;
}

// ── TRACKER ─────────────────────────────
async function loadTracker() {
    if (cache.tracker) return renderTracker(cache.tracker);

    const rates = await shikiFetch(`${API}/users/${USERNAME}/anime_rates?limit=500`);

    const ids = [...new Set(rates.map(r => r.anime?.id).filter(Boolean))];
    const covers = await fetchAniListCovers(ids, "ANIME");

    const grouped = {
        watching: [],
        planned: [],
        completed: [],
        dropped: []
    };

    for (const r of rates) {
        if (r.anime?.id) {
            r.anime._cover = covers[r.anime.id] || null;
        }
        if (grouped[r.status]) grouped[r.status].push(r);
    }

    cache.tracker = grouped;
    renderTracker(grouped);
}

function renderTracker(grouped) {
    const box = document.getElementById("tab-tracker");

    const titles = {
        watching: "Смотрю",
        planned: "Запланировано",
        completed: "Просмотрено",
        dropped: "Брошено"
    };

    box.innerHTML = Object.entries(grouped).map(([k, arr]) => {
        if (!arr.length) return "";

        return `
        <section class="group">
            <h2 class="section-title">${titles[k]} <span class="section-badge">${arr.length}</span></h2>

            <div class="grid-cards">
                ${arr.map((e,i) => `
                    <a class="card" href="${SHIKI}${e.anime.url}" target="_blank">
                        <img src="${e.anime._cover || imgFallback(e.anime.image)}">
                        <div class="card-body">
                            <div class="card-title">${e.anime.russian || e.anime.name}</div>
                        </div>
                    </a>
                `).join("")}
            </div>
        </section>`;
    }).join("");
}

// ── FAVORITES ───────────────────────────
async function loadFavorites() {
    if (cache.favorites) return renderFavorites(cache.favorites);

    const data = await shikiFetch(`${API}/users/${USERNAME}/favourites`);

    // ANIME / MANGA covers
    const animeIds = (data.animes || []).map(a => a.id).filter(Boolean);
    const animeCovers = await fetchAniListCovers(animeIds, "ANIME");

    const mangaIds = (data.mangas || []).map(m => m.id).filter(Boolean);
    const mangaCovers = await fetchAniListCovers(mangaIds, "MANGA");

    for (const a of (data.animes || [])) a._cover = animeCovers[a.id] || null;
    for (const m of (data.mangas || [])) m._cover = mangaCovers[m.id] || null;

    // CHARACTERS (AniList + fallback)
    const chars = data.characters || [];
    const names = chars.map(c => c.name || c.russian).filter(Boolean);

    const charCovers = await fetchAniListCharacters(names);

    for (const c of chars) {
        const key = c.name || c.russian;
        c._cover = charCovers[key] || null;
    }

    cache.favorites = data;
    renderFavorites(data);
}

function renderFavorites(data) {
    const box = document.getElementById("tab-favorites");

    const animes = data.animes || [];
    const mangas = data.mangas || [];
    const chars  = data.characters || [];

    box.innerHTML = `
        <section class="group">
            <h2 class="section-title">Аниме <span class="section-badge">${animes.length}</span></h2>
            <div class="grid-cards">
                ${animes.map(a => `
                    <a class="card" href="${SHIKI}${a.url}" target="_blank">
                        <img src="${a._cover || imgFallback(a.image)}">
                        <div class="card-body">
                            <div class="card-title">${a.russian || a.name}</div>
                        </div>
                    </a>
                `).join("")}
            </div>
        </section>

        <section class="group">
            <h2 class="section-title">Манга <span class="section-badge">${mangas.length}</span></h2>
            <div class="grid-cards">
                ${mangas.map(m => `
                    <a class="card" href="${SHIKI}${m.url}" target="_blank">
                        <img src="${m._cover || imgFallback(m.image)}">
                        <div class="card-body">
                            <div class="card-title">${m.russian || m.name}</div>
                        </div>
                    </a>
                `).join("")}
            </div>
        </section>

        <section class="group">
            <h2 class="section-title">Персонажи <span class="section-badge">${chars.length}</span></h2>
            <div class="grid-chars">
                ${chars.map(c => `
                    <a class="card" href="${SHIKI}${c.url}" target="_blank">
                        <img src="${c._cover || imgFallback(c.image, true)}">
                        <div class="card-body">
                            <div class="card-title">${c.russian || c.name}</div>
                        </div>
                    </a>
                `).join("")}
            </div>
        </section>
    `;
}

// ── TABS ────────────────────────────────
function switchTab(id, btn) {
    document.querySelectorAll(".tab-content").forEach(e => e.classList.add("hidden"));
    document.querySelectorAll(".tab-btn").forEach(e => e.classList.remove("active"));
    document.getElementById(id).classList.remove("hidden");
    btn.classList.add("active");

    if (id === "tab-tracker") loadTracker();
    if (id === "tab-favorites") loadFavorites();
}

// старт
loadTracker();
</script>
</body>
