<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeQerrti - Личный Хаб</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0c10; color: #c5c6c7; font-family: system-ui, sans-serif; }
        .tab-btn.active { color: #66fcf1; border-color: #66fcf1; background-color: rgba(102, 252, 241, 0.05); }
    </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">

    <header class="text-center my-6 border-b border-gray-800 pb-6">
        <h1 class="text-4xl font-black tracking-wide text-[#66fcf1] mb-2">DeQerrti</h1>
        <p class="text-gray-400 max-w-xl mx-auto text-sm">Личный трекер и фавориты из Shikimori</p>
    </header>

    <nav class="flex justify-center gap-2 border-b border-gray-800 mb-8 overflow-x-auto">
        <button onclick="switchTab('tab-tracker')" class="tab-btn active px-4 py-3 font-semibold text-sm border-b-2 border-transparent">🏠 Трекер</button>
        <button onclick="switchTab('tab-favorites')" class="tab-btn px-4 py-3 font-semibold text-sm border-b-2 border-transparent">⭐ Фавориты</button>
    </nav>

    <main>
        <!-- Сетка для текущего трекера -->
        <div id="tab-tracker" class="tab-content grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div id="tracker-loading" class="col-span-full text-center py-8 text-gray-500 animate-pulse">Загрузка трекера...</div>
        </div>

        <!-- Сетка для фаворитов -->
        <div id="tab-favorites" class="tab-content hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div id="fav-loading" class="col-span-full text-center py-8 text-gray-500 animate-pulse">Загрузка фаворитов...</div>
        </div>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }
    </script>

    <!-- СЮДА МЫ ВСТАВИМ СКРИПТ ШИКИМОРИ НА СЛЕДУЮЩЕМ ШАГЕ -->

</body>
</html>
