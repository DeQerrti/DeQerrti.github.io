<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID — Добавить отзыв</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1510; --bg2: #211c15; --surface: #28211a; --surface2: #2f2820;
  --border: #3d3228; --border2: #554535;
  --gold: #c9a84c; --gold-dim: #7a5e28; --gold-hi: #e8c96a;
  --text: #c8b99a; --text-dim: #6b5e4a; --text-hi: #ede0c8;
  --green: #90b885; --red: #e07070;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', serif; min-height: 100vh;
  background-image: radial-gradient(ellipse 100% 40% at 50% 0%, rgba(201,168,76,.06) 0%, transparent 60%); }
header { text-align: center; padding: 2.5rem 1rem 2rem; border-bottom: 1px solid var(--border); position: relative; }
header::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--gold-dim) 20%, var(--gold) 50%, var(--gold-dim) 80%, transparent 100%); }
.logo { font-family: 'Playfair Display', serif; font-weight: 900; font-style: italic; font-size: 2.5rem; color: var(--gold-hi); }
.logo-sub { font-family: 'DM Sans', sans-serif; font-size: .65rem; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-dim); margin-top: .3rem; }
main { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }
.section-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; font-style: italic;
  color: var(--text-hi); margin-bottom: 1.25rem; display: flex; align-items: center; gap: .8rem; }
.section-title::before { content: ''; width: 20px; height: 1px; background: var(--gold); }
.section-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }
.grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.field  { margin-bottom: 1rem; }
.field.full { grid-column: 1 / -1; }
label { font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-dim); letter-spacing: .1em;
  text-transform: uppercase; display: block; margin-bottom: .4rem; }
input, textarea, select {
  width: 100%; background: var(--bg2); border: 1px solid var(--border2); border-radius: 2px;
  padding: .65rem .85rem; color: var(--text-hi); font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; outline: none; transition: border-color .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--gold-dim); }
select option { background: var(--bg2); }
textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.tags-grid { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
.tag-toggle { font-family: 'DM Sans', sans-serif; font-size: .65rem; padding: .25rem .6rem;
  border-radius: 2px; cursor: pointer; border: 1px solid; transition: all .15s; user-select: none; }
.tag-toggle.visual  { background: rgba(45,92,88,.1);   color: #72b8b3; border-color: rgba(45,92,88,.3); }
.tag-toggle.plot    { background: rgba(201,168,76,.08); color: #c9a84c; border-color: rgba(201,168,76,.2); }
.tag-toggle.chars   { background: rgba(74,103,65,.1);  color: #90b885; border-color: rgba(74,103,65,.3); }
.tag-toggle.special { background: rgba(139,42,42,.1);  color: #e07070; border-color: rgba(139,42,42,.3); }
.tag-toggle.active.visual  { background: rgba(45,92,88,.35);   border-color: #72b8b3; }
.tag-toggle.active.plot    { background: rgba(201,168,76,.25);  border-color: #c9a84c; }
.tag-toggle.active.chars   { background: rgba(74,103,65,.35);   border-color: #90b885; }
.tag-toggle.active.special { background: rgba(139,42,42,.35);   border-color: #e07070; }
.grades-grid { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
.grade-btn { font-family: 'Playfair Display', serif; font-size: .82rem; font-weight: 700; padding: .35rem .8rem;
  border-radius: 2px; cursor: pointer; border: 1px solid; transition: all .15s; background: rgba(255,255,255,.03); }
.grade-btn.active { filter: brightness(1.3); }
.divider { height: 1px; background: linear-gradient(90deg, var(--border2), transparent); margin: 2rem 0; }
.btn-save { width: 100%; background: rgba(201,168,76,.12); border: 1px solid rgba(201,168,76,.35); border-radius: 2px;
  color: var(--gold-hi); font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700;
  font-style: italic; letter-spacing: .05em; padding: .9rem; cursor: pointer; transition: background .2s, border-color .2s; }
.btn-save:hover { background: rgba(201,168,76,.22); border-color: var(--gold); }
.btn-save:disabled { opacity: .5; cursor: not-allowed; }
.status { font-family: 'DM Sans', sans-serif; font-size: .8rem; text-align: center; margin-top: 1rem; min-height: 1.2rem; }
.status.ok  { color: var(--green); }
.status.err { color: var(--red); }
.preview-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 2px;
  padding: 1rem; margin-top: .5rem; font-size: .9rem; line-height: 1.6; color: var(--text);
  font-style: italic; min-height: 60px; }
.cover-preview { width: 80px; height: 120px; object-fit: cover; border: 1px solid var(--border2);
  border-radius: 2px; margin-top: .5rem; display: none; }

/* source-2 hint */
.source2-hint { font-family: 'DM Sans', sans-serif; font-size: .68rem; color: var(--text-dim);
  margin-bottom: 1rem; padding: .55rem .85rem; border: 1px solid var(--border); border-radius: 2px;
  background: rgba(201,168,76,.04); }

/* режим редактирования */
.edit-banner {
  background: rgba(201,168,76,.08); border: 1px solid rgba(201,168,76,.25); border-radius: 2px;
  padding: .7rem 1rem; margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between;
  font-family: 'DM Sans', sans-serif; font-size: .8rem; color: var(--gold);
}
.edit-banner span { opacity: .6; }
.btn-new { background: none; border: 1px solid rgba(201,168,76,.3); border-radius: 2px;
  color: var(--gold-dim); font-family: 'DM Sans', sans-serif; font-size: .72rem;
  padding: .3rem .7rem; cursor: pointer; transition: all .15s; }
.btn-new:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
<header>
  <div class="logo">TasteID</div>
  <div class="logo-sub" id="page-subtitle">Добавить отзыв</div>
</header>
<main>

  <!-- Баннер режима редактирования -->
  <div class="edit-banner" id="edit-banner" style="display:none">
    <div>✦ Режим редактирования — <span id="edit-title-hint"></span></div>
    <button class="btn-new" onclick="resetToNew()">+ Новый отзыв</button>
  </div>

  <!-- Основное -->
  <h2 class="section-title">Основное</h2>
  <div class="grid">
    <div class="field">
      <label>Название *</label>
      <input type="text" id="f-title" placeholder="Tokyo Ghoul">
    </div>
    <div class="field">
      <label>Год</label>
      <input type="text" id="f-year" placeholder="2014">
    </div>
    <div class="field">
      <label>Тип</label>
      <select id="f-type">
        <option value="anime">Аниме</option>
        <option value="manga">Манга</option>
        <option value="novel">Ранобэ</option>
        <option value="movie">Фильм</option>
        <option value="show">Сериал</option>
        <option value="game">Игра</option>
      </select>
    </div>
    <div class="field">
      <label>Формат (доп.)</label>
      <input type="text" id="f-format" placeholder="TV · 12 эп.">
    </div>
    <div class="field full">
      <label>Ссылка на обложку</label>
      <input type="text" id="f-cover" placeholder="https://..." oninput="previewCover(this.value)">
      <img id="cover-img" class="cover-preview">
    </div>
  </div>

  <!-- Источник 1 -->
  <h2 class="section-title">Источник 1</h2>
  <div class="grid">
    <div class="field">
      <label>Тип</label>
      <select id="f-source">
        <option value="bluesky">Bluesky (мини)</option>
        <option value="teletype">Teletype (полный)</option>
        <option value="other">Другое</option>
      </select>
    </div>
    <div class="field">
      <label>URL *</label>
      <input type="text" id="f-url" placeholder="https://bsky.app/...">
    </div>
    <div class="field">
      <label>Дата (YYYY-MM-DD)</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>Фавориты</label>
      <input type="text" id="f-favorites" placeholder="Kaneki Ken, Touka">
    </div>
  </div>

  <!-- Источник 2 -->
  <h2 class="section-title">Источник 2 <span style="font-size:.8rem;font-weight:400;font-style:italic;color:var(--text-dim)">— необязательно</span></h2>
  <div class="source2-hint">
    Заполни если у отзыва два места публикации — например мини на Bluesky и полный на Teletype. Оба появятся на карточке.
  </div>
  <div class="grid">
    <div class="field">
      <label>Тип</label>
      <select id="f-source2">
        <option value="">— не указан —</option>
        <option value="bluesky">Bluesky (мини)</option>
        <option value="teletype">Teletype (полный)</option>
        <option value="other">Другое</option>
      </select>
    </div>
    <div class="field">
      <label>URL 2</label>
      <input type="text" id="f-url2" placeholder="https://teletype.in/...">
    </div>
  </div>

  <!-- Превью -->
  <h2 class="section-title">Превью текст</h2>
  <div class="field">
    <textarea id="f-preview" placeholder="Пара предложений о тайтле..." oninput="updatePreview()"></textarea>
    <div class="preview-box" id="preview-out">Здесь появится превью…</div>
  </div>

  <!-- Оценка -->
  <div class="divider"></div>
  <h2 class="section-title">Оценка</h2>
  <div class="grades-grid" id="grades-grid"></div>

  <!-- Теги -->
  <h2 class="section-title">Теги</h2>
  <div class="tags-grid" id="tags-grid"></div>

  <!-- Сохранить -->
  <div class="divider"></div>
  <button class="btn-save" id="btn-save" onclick="saveReview()">Сохранить отзыв</button>
  <div class="status" id="status"></div>

</main>
<script>
const GRADES = {
  razocharo:    { color: "#8B6914", name: "Разочарование" },
  brak:         { color: "#c0392b", name: "Брак" },
  fon:          { color: "#6b7280", name: "Фоновый шум" },
  attrakcion:   { color: "#d4a017", name: "Аттракцион" },
  vyskazyvanie: { color: "#2d8a4e", name: "Высказывание" },
  etalon:       { color: "#2563a8", name: "Эталон" },
  rezonans:     { color: "#7c3aed", name: "Резонанс" },
};

const TAGS_MAP = {
  "Топ рисовка":"visual","Топ визуал":"visual","Специфичный стиль":"visual","Слабая картинка":"visual","Осты в тему":"visual",
  "Затягивает сразу":"plot","Долгая раскачка":"plot","Сюжетные дыры":"plot","Рояли в кустах":"plot","Стеклище":"plot",
  "Чеховские ружья":"plot","Слитый финал":"plot","До титров":"plot","Проседает":"plot",
  "Живые герои":"chars","Картонные чары":"chars","Крутой протагонист":"chars","Оригинальный сеттинг":"chars",
  "Дырявый сеттинг":"chars","Топ антагонист":"chars","Слабый ГГ":"chars",
  "Без кринжа":"special","Почти без кринжа":"special","Много кринжа":"special","Жесть":"special",
  "Философия":"special","Чистый кайф":"special","Серая мораль":"special","Хорни вайб":"special",
};

let selectedGrade = null;
let selectedTags  = new Set();
let editingId     = null;

// ── рендер оценок ──────────────────────────────────
const gradesGrid = document.getElementById("grades-grid");
for (const [key, g] of Object.entries(GRADES)) {
  const btn = document.createElement("button");
  btn.className = "grade-btn";
  btn.textContent = g.name;
  btn.style.color = g.color;
  btn.style.borderColor = g.color + "55";
  btn.dataset.key = key;
  btn.onclick = () => {
    selectedGrade = selectedGrade === key ? null : key;
    document.querySelectorAll(".grade-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.key === selectedGrade));
  };
  gradesGrid.appendChild(btn);
}

// ── рендер тегов ───────────────────────────────────
const tagsGrid = document.getElementById("tags-grid");
for (const [tag, cat] of Object.entries(TAGS_MAP)) {
  const btn = document.createElement("span");
  btn.className = `tag-toggle ${cat}`;
  btn.textContent = tag;
  btn.dataset.tag = tag;
  btn.onclick = () => {
    if (selectedTags.has(tag)) { selectedTags.delete(tag); btn.classList.remove("active"); }
    else { selectedTags.add(tag); btn.classList.add("active"); }
  };
  tagsGrid.appendChild(btn);
}

// ── заполняем форму данными отзыва ─────────────────
function fillForm(r) {
  document.getElementById("f-title").value     = r.title     || "";
  document.getElementById("f-year").value      = r.year      || "";
  document.getElementById("f-format").value    = r.format    || "";
  document.getElementById("f-cover").value     = r.cover     || "";
  document.getElementById("f-url").value       = r.url       || "";
  document.getElementById("f-date").value      = r.date      || "";
  document.getElementById("f-favorites").value = r.favorites || "";
  document.getElementById("f-preview").value   = r.preview   || "";
  document.getElementById("f-source").value    = r.source    || "bluesky";
  document.getElementById("f-type").value      = r.type      || "anime";
  // второй источник
  document.getElementById("f-url2").value      = r.url2      || "";
  document.getElementById("f-source2").value   = r.source2   || "";

  updatePreview();
  previewCover(r.cover || "");

  selectedGrade = r.grade || null;
  document.querySelectorAll(".grade-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.key === selectedGrade));

  selectedTags = new Set(r.tags || []);
  document.querySelectorAll(".tag-toggle").forEach(b => {
    b.classList.toggle("active", selectedTags.has(b.dataset.tag));
  });
}

// ── сброс в режим «новый отзыв» ────────────────────
function resetToNew() {
  editingId = null;
  document.getElementById("edit-banner").style.display = "none";
  document.getElementById("page-subtitle").textContent = "Добавить отзыв";
  document.getElementById("btn-save").textContent = "Сохранить отзыв";
  history.replaceState(null, "", "add.html");

  ["f-title","f-year","f-format","f-cover","f-url","f-favorites","f-preview","f-url2"]
    .forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-date").value    = new Date().toISOString().slice(0,10);
  document.getElementById("f-source").value  = "bluesky";
  document.getElementById("f-source2").value = "";
  document.getElementById("f-type").value    = "anime";
  document.getElementById("preview-out").textContent = "Здесь появится превью…";
  document.getElementById("cover-img").style.display = "none";
  selectedGrade = null;
  selectedTags.clear();
  document.querySelectorAll(".grade-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tag-toggle").forEach(b => b.classList.remove("active"));
  document.getElementById("status").textContent = "";
}

// ── определяем режим по URL (?edit=ID) ─────────────
async function initPage() {
  const params = new URLSearchParams(location.search);
  const editId = params.get("edit");
  document.getElementById("f-date").value = new Date().toISOString().slice(0,10);
  if (!editId) return;

  try {
    const res  = await fetch("/reviews.json?_=" + Date.now());
    const data = await res.json();
    const review = data.find(r =>
      String(r.id) === editId || encodeURIComponent(r.title) === editId
    );
    if (!review) {
      document.getElementById("status").className = "status err";
      document.getElementById("status").textContent = "Отзыв с таким ID не найден";
      return;
    }
    editingId = review.id ?? review.title;
    fillForm(review);
    document.getElementById("edit-banner").style.display = "flex";
    document.getElementById("edit-title-hint").textContent = review.title;
    document.getElementById("page-subtitle").textContent = "Редактировать отзыв";
    document.getElementById("btn-save").textContent = "Сохранить изменения";
  } catch (e) {
    document.getElementById("status").className = "status err";
    document.getElementById("status").textContent = "Не удалось загрузить отзыв: " + e.message;
  }
}

function updatePreview() {
  const val = document.getElementById("f-preview").value;
  document.getElementById("preview-out").textContent = val || "Здесь появится превью…";
}

function previewCover(url) {
  const img = document.getElementById("cover-img");
  if (url && url.startsWith("http")) { img.src = url; img.style.display = "block"; }
  else { img.style.display = "none"; }
}

// ── сохранение ─────────────────────────────────────
async function saveReview() {
  const btn    = document.getElementById("btn-save");
  const status = document.getElementById("status");

  const title   = document.getElementById("f-title").value.trim();
const url     = document.getElementById("f-url").value.trim();
const preview = document.getElementById("f-preview").value.trim();
const hasContent = preview || selectedGrade;

if (!title) {
  status.className = "status err";
  status.textContent = "Заполни название";
  return;
}
if (hasContent && !url) {
  status.className = "status err";
  status.textContent = "Заполни ссылку на источник";
  return;
}

  const url2    = document.getElementById("f-url2").value.trim()    || null;
  const source2 = document.getElementById("f-source2").value        || null;

  const review = {
    title,
    url,
    type:      document.getElementById("f-type").value,
    source:    document.getElementById("f-source").value,
    // второй источник — только если заполнен URL
    url2:      url2,
    source2:   url2 ? source2 : null,
    year:      document.getElementById("f-year").value.trim()      || null,
    format:    document.getElementById("f-format").value.trim()    || null,
    cover:     document.getElementById("f-cover").value.trim()     || null,
    date:      document.getElementById("f-date").value             || null,
    favorites: document.getElementById("f-favorites").value.trim() || null,
    preview:   document.getElementById("f-preview").value.trim()   || null,
    grade:     selectedGrade,
    tags:      [...selectedTags],
  };

  if (editingId !== null) review._editId = editingId;

  btn.disabled = true;
  btn.textContent = "Сохраняем…";
  status.className = "status";
  status.textContent = "";

  try {
    const res  = await fetch("/api/save-review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(review),
    });
    const data = await res.json();
    if (res.ok) {
      status.className = "status ok";
      status.textContent = editingId !== null
        ? `✦ «${title}» обновлён. Сайт обновится через ~30 секунд.`
        : `✦ «${title}» сохранён. Сайт обновится через ~30 секунд.`;
      if (editingId === null) resetToNew();
    } else {
      status.className = "status err";
      status.textContent = "Ошибка: " + (data.error || "неизвестная");
    }
  } catch (e) {
    status.className = "status err";
    status.textContent = "Ошибка сети: " + e.message;
  }

  btn.disabled = false;
  btn.textContent = editingId !== null ? "Сохранить изменения" : "Сохранить отзыв";
}

initPage();
</script>
</body>
</html>
