<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID — Персонажи и персоны</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0a0a0c;
  --bg2:      #0f0f12;
  --surface:  #111114;
  --surface2: #1a1a1f;
  --border:   #222228;
  --border2:  #333338;
  --red:      #8b1a1a;
  --red-hi:   #c0392b;
  --red-dim:  #5a1010;
  --text:     #b8b0a8;
  --text-dim: #4a4540;
  --text-hi:  #f0ece6;
  --green-hi: #6ab87a;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 3.5rem 1rem 2.5rem;
  border-bottom: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
header::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--red-dim) 20%, var(--red) 50%, var(--red-dim) 80%, transparent 100%);
}
.header-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .7rem;
}
.header-eyebrow::before,
.header-eyebrow::after { content: '—'; color: var(--border2); }
.logo {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(3rem, 8vw, 5.5rem);
  color: var(--text-hi);
  letter-spacing: .04em;
  line-height: 1;
  text-decoration: none;
  display: block;
}
.header-deco {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  margin-top: 1.2rem;
}
.header-deco span { width: 4px; height: 4px; transform: rotate(45deg); background: var(--border2); }
.header-deco span:nth-child(3) { width: 6px; height: 6px; background: var(--red); }
.header-deco::before { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, transparent, var(--border2)); }
.header-deco::after  { content: ''; width: 50px; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

main { max-width: 860px; margin: 0 auto; padding: 3rem 2rem 6rem; }

.edit-banner {
  background: rgba(139,26,26,.08);
  border: 1px solid rgba(139,26,26,.25);
  border-radius: 2px;
  padding: .75rem 1.1rem;
  margin-bottom: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  color: var(--red-hi);
  gap: 1rem;
}
.edit-banner-title { opacity: .7; font-style: italic; }
.btn-new {
  background: none;
  border: 1px solid rgba(139,26,26,.35);
  border-radius: 2px;
  color: var(--red-hi);
  font-family: 'DM Sans', sans-serif;
  font-size: .72rem;
  padding: .3rem .8rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn-new:hover { background: rgba(139,26,26,.15); border-color: var(--red-hi); }

.section-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--text-hi);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.section-title::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--red); }
.section-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.field { margin-bottom: 1rem; }
.field.full { grid-column: 1 / -1; }

label {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  color: var(--text-dim);
  letter-spacing: .12em;
  text-transform: uppercase;
  display: block;
  margin-bottom: .4rem;
}

input, select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .65rem .85rem;
  color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s, background .2s;
  appearance: none;
  -webkit-appearance: none;
}
input:focus, select:focus { border-color: var(--red); background: var(--bg2); }
input::placeholder { color: var(--text-dim); }
select option { background: var(--bg2); }

.select-wrap { position: relative; }
.select-wrap::after {
  content: '▾';
  position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
  color: var(--text-dim); pointer-events: none; font-size: .75rem;
}
.select-wrap select { padding-right: 2rem; }

.field-subtype { display: none; }
.field-subtype.visible { display: block; }

.avatar-preview {
  width: 80px; height: 80px;
  object-fit: cover;
  border-radius: 50%;
  border: 1px solid var(--border2);
  margin-top: .6rem;
  display: none;
}

.divider { height: 1px; background: linear-gradient(90deg, var(--border2), transparent); margin: 2rem 0; }

.btn-save {
  width: 100%;
  background: rgba(139,26,26,.12);
  border: 1px solid rgba(139,26,26,.35);
  border-radius: 2px;
  color: var(--text-hi);
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 700;
  font-style: italic;
  letter-spacing: .08em;
  padding: .9rem;
  cursor: pointer;
  transition: background .2s, border-color .2s;
  position: relative;
}
.btn-save::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-top: 1px solid var(--red-dim); border-left: 1px solid var(--red-dim); }
.btn-save::after  { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-bottom: 1px solid var(--red-dim); border-right: 1px solid var(--red-dim); }
.btn-save:hover { background: rgba(139,26,26,.22); border-color: var(--red); }
.btn-save:disabled { opacity: .4; cursor: not-allowed; }

.status-msg {
  font-family: 'DM Sans', sans-serif;
  font-size: .78rem;
  text-align: center;
  margin-top: 1rem;
  min-height: 1.2rem;
  letter-spacing: .03em;
}
.status-msg.ok  { color: var(--green-hi); }
.status-msg.err { color: #d88; }

.divider-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--text-hi);
  margin: 3rem 0 1.25rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.divider-title::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--red); }
.divider-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

/* ── Список записей ── */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 3rem 0 1.25rem;
  gap: 1rem;
}
.list-header .divider-title {
  margin: 0;
  flex: 1;
}

.btn-save-order {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--green-hi);
  background: rgba(106,184,122,.08);
  border: 1px solid rgba(106,184,122,.3);
  border-radius: 2px;
  padding: .35rem .85rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  display: none;
}
.btn-save-order:hover { background: rgba(106,184,122,.18); border-color: var(--green-hi); }
.btn-save-order.visible { display: block; }
.btn-save-order:disabled { opacity: .4; cursor: not-allowed; }

.entries-list { display: flex; flex-direction: column; gap: .5rem; }

.entry-row {
  display: flex;
  align-items: center;
  gap: .85rem;
  padding: .6rem .85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  transition: border-color .15s;
}
.entry-row:hover { border-color: var(--border2); }

/* Кнопки порядка */
.entry-order-btns {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
}
.btn-order {
  background: none;
  border: 1px solid var(--border2);
  border-radius: 1px;
  color: var(--text-dim);
  font-size: .6rem;
  width: 20px; height: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
  line-height: 1;
  padding: 0;
}
.btn-order:hover { border-color: var(--red-dim); color: var(--red-hi); }
.btn-order:disabled { opacity: .2; cursor: default; }

.entry-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border2);
  flex-shrink: 0;
  background: var(--surface2);
}
.entry-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-hi);
  flex: 1;
}
.entry-type {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .1em;
}
.entry-edit {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .25rem .6rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.entry-edit:hover { border-color: var(--red-dim); color: var(--red-hi); }

.order-hint {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  color: var(--text-dim);
  text-align: center;
  margin-top: .75rem;
  display: none;
}
.order-hint.visible { display: block; }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow" id="page-subtitle">Персонажи и персоны</div>
  <a href="/" class="logo">TasteID</a>
  <div class="header-deco">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</header>

<main>

  <div class="edit-banner" id="edit-banner" style="display:none">
    <div>✦ Режим редактирования — <span class="edit-banner-title" id="edit-name-hint"></span></div>
    <button class="btn-new" onclick="resetToNew()">+ Новая запись</button>
  </div>

  <h2 class="section-title">Основное</h2>
  <div class="grid">
    <div class="field">
      <label>Имя *</label>
      <input type="text" id="f-name" placeholder="Kaneki Ken">
    </div>
    <div class="field">
      <label>Тип</label>
      <div class="select-wrap">
        <select id="f-type" onchange="onTypeChange()">
          <option value="character">Персонаж</option>
          <option value="person">Персона</option>
        </select>
      </div>
    </div>
    <div class="field full field-subtype" id="field-subtype">
      <label>Роль персоны</label>
      <div class="select-wrap">
        <select id="f-subtype">
          <option value="actor">Актёр</option>
          <option value="director">Режиссёр</option>
          <option value="author">Автор</option>
          <option value="seiyuu">Сэйю</option>
          <option value="artist">Художник</option>
          <option value="composer">Композитор</option>
        </select>
      </div>
    </div>
    <div class="field full">
      <label>Ссылка на изображение</label>
      <input type="text" id="f-image" placeholder="https://..." oninput="previewAvatar(this.value)">
      <img id="avatar-img" class="avatar-preview">
    </div>
    <div class="field full">
      <label>Из чего (необязательно)</label>
      <input type="text" id="f-from" placeholder="Tokyo Ghoul">
    </div>
  </div>

  <div class="divider"></div>
  <button class="btn-save" id="btn-save" onclick="saveEntry()">Сохранить</button>
  <div class="status-msg" id="status"></div>

  <div class="list-header" id="list-header" style="display:none">
    <div class="divider-title">Все записи</div>
    <button class="btn-save-order" id="btn-save-order" onclick="saveOrder()">✦ Сохранить порядок</button>
  </div>
  <div class="entries-list" id="entries-list"></div>
  <div class="order-hint" id="order-hint">Используй ↑↓ для изменения порядка, затем нажми «Сохранить порядок»</div>

</main>

<script>
let editingId  = null;
let listData   = [];   // текущий порядок записей
let orderDirty = false;

const SUBTYPE_LABELS = {
  actor: "Актёр", director: "Режиссёр", author: "Автор",
  seiyuu: "Сэйю", artist: "Художник", composer: "Композитор"
};

function onTypeChange() {
  const isPerson = document.getElementById("f-type").value === "person";
  document.getElementById("field-subtype").classList.toggle("visible", isPerson);
}

function previewAvatar(url) {
  const img = document.getElementById("avatar-img");
  if (url && url.startsWith("http")) { img.src = url; img.style.display = "block"; }
  else img.style.display = "none";
}

function setStatus(type, text) {
  const el = document.getElementById("status");
  el.className = "status-msg" + (type ? " " + type : "");
  el.textContent = text;
}

function resetToNew() {
  editingId = null;
  document.getElementById("edit-banner").style.display = "none";
  document.getElementById("page-subtitle").textContent = "Персонажи и персоны";
  document.getElementById("btn-save").textContent = "Сохранить";
  history.replaceState(null, "", "favorites-edit.html");
  ["f-name","f-image","f-from"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-type").value = "character";
  document.getElementById("f-subtype").value = "actor";
  document.getElementById("avatar-img").style.display = "none";
  document.getElementById("field-subtype").classList.remove("visible");
  setStatus("", "");
}

function fillForm(r) {
  document.getElementById("f-name").value    = r.name    || "";
  document.getElementById("f-image").value   = r.image   || "";
  document.getElementById("f-from").value    = r.from    || "";
  document.getElementById("f-type").value    = r.type    || "character";
  document.getElementById("f-subtype").value = r.subtype || "actor";
  previewAvatar(r.image || "");
  onTypeChange();
}

// ── Перемещение записи ──────────────────────────
function moveEntry(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= listData.length) return;
  [listData[idx], listData[newIdx]] = [listData[newIdx], listData[idx]];
  orderDirty = true;
  renderList();
}

// ── Рендер списка ───────────────────────────────
function renderList() {
  const list = document.getElementById("entries-list");
  list.innerHTML = listData.map((r, idx) => {
    const typeLabel = r.type === "person"
      ? (SUBTYPE_LABELS[r.subtype] || "Персона")
      : "Персонаж";
    return `
    <div class="entry-row">
      <div class="entry-order-btns">
        <button class="btn-order" onclick="moveEntry(${idx}, -1)" ${idx === 0 ? "disabled" : ""} title="Вверх">▲</button>
        <button class="btn-order" onclick="moveEntry(${idx}, 1)"  ${idx === listData.length - 1 ? "disabled" : ""} title="Вниз">▼</button>
      </div>
      <img class="entry-avatar" src="${esc(r.image || "")}" onerror="this.style.display='none'" alt="">
      <div class="entry-name">${esc(r.name)}</div>
      ${r.from ? `<div class="entry-type">${esc(r.from)}</div>` : ""}
      <div class="entry-type">${esc(typeLabel)}</div>
      <button class="entry-edit" onclick="startEdit(${r.id})">✎ Изменить</button>
    </div>`;
  }).join("");

  // Показываем кнопку сохранения порядка только если что-то сдвинули
  const btn = document.getElementById("btn-save-order");
  const hint = document.getElementById("order-hint");
  btn.classList.toggle("visible", orderDirty);
  hint.classList.toggle("visible", listData.length > 1);
}

async function loadList() {
  try {
    const res = await fetch("/favorites.json?_=" + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    if (!data.length) return;

    listData   = data;
    orderDirty = false;
    document.getElementById("list-header").style.display = "flex";
    renderList();
  } catch {}
}

async function startEdit(id) {
  const entry = listData.find(r => r.id === id);
  if (!entry) return;
  editingId = entry.id;
  fillForm(entry);
  document.getElementById("edit-banner").style.display = "flex";
  document.getElementById("edit-name-hint").textContent = entry.name;
  document.getElementById("page-subtitle").textContent = "Редактировать запись";
  document.getElementById("btn-save").textContent = "Сохранить изменения";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ── Сохранить порядок ───────────────────────────
async function saveOrder() {
  const btn = document.getElementById("btn-save-order");
  btn.disabled = true;
  btn.textContent = "Сохраняем…";

  try {
    const res  = await fetch("/api/save-favorite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ _reorder: listData.map(r => r.id) }),
    });
    const data = await res.json();
    if (res.ok) {
      orderDirty = false;
      btn.classList.remove("visible");
      document.getElementById("order-hint").classList.remove("visible");
      setStatus("ok", "✦ Порядок сохранён. Сайт обновится через ~30 секунд.");
    } else {
      setStatus("err", "Ошибка: " + (data.error || "неизвестная"));
    }
  } catch (e) {
    setStatus("err", "Ошибка сети: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = "✦ Сохранить порядок";
}

async function saveEntry() {
  const btn  = document.getElementById("btn-save");
  const name = document.getElementById("f-name").value.trim();
  if (!name) { setStatus("err", "Заполни имя"); return; }

  const type = document.getElementById("f-type").value;
  const entry = {
    name,
    type,
    image: document.getElementById("f-image").value.trim() || null,
    from:  document.getElementById("f-from").value.trim()  || null,
  };
  if (type === "person") {
    entry.subtype = document.getElementById("f-subtype").value || null;
  }
  if (editingId !== null) entry._editId = editingId;

  btn.disabled = true;
  btn.textContent = "Сохраняем…";
  setStatus("", "");

  try {
    const res  = await fetch("/api/save-favorite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(entry),
    });
    const data = await res.json();
    if (res.ok) {
      setStatus("ok", editingId !== null
        ? `✦ «${name}» обновлён. Сайт обновится через ~30 секунд.`
        : `✦ «${name}» сохранён. Сайт обновится через ~30 секунд.`);
      if (editingId === null) resetToNew();
      setTimeout(loadList, 2000);
    } else {
      setStatus("err", "Ошибка: " + (data.error || "неизвестная"));
    }
  } catch (e) {
    setStatus("err", "Ошибка сети: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = editingId !== null ? "Сохранить изменения" : "Сохранить";
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

loadList();
</script>
</body>
</html>
