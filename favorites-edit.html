<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasteID — Персонажи и персоны</title>
<link rel="icon" type="image/x-icon" href="/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.logo {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(3rem, 8vw, 5.5rem);
  color: var(--text-hi);
  letter-spacing: .04em;
  line-height: 1;
  text-decoration: none;
  display: block;
}

input, select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .65rem .85rem;
  color: var(--text-hi);
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s, background .2s;
  appearance: none;
  -webkit-appearance: none;
}
input:focus, select:focus { border-color: var(--red); background: var(--bg2); }
input::placeholder { color: var(--text-dim); }

.field-subtype { display: none; }
.field-subtype.visible { display: block; }

.avatar-preview {
  width: 80px; height: 80px;
  object-fit: cover;
  border-radius: 50%;
  border: 1px solid var(--border2);
  margin-top: .6rem;
  display: none;
}

.btn-save::before { content: ''; position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-top: 1px solid var(--red-dim); border-left: 1px solid var(--red-dim); }
.btn-save::after  { content: ''; position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-bottom: 1px solid var(--red-dim); border-right: 1px solid var(--red-dim); }

.divider-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-style: italic;
  font-size: 1.15rem;
  color: var(--text-hi);
  margin: 3rem 0 1.25rem;
  display: flex;
  align-items: center;
  gap: .8rem;
}
.divider-title::before { content: ''; display: inline-block; width: 16px; height: 1px; background: var(--red); }
.divider-title::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border2), transparent); }

/* ── Список записей ── */
.list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 3rem 0 1.25rem;
  gap: 1rem;
}
.list-header .divider-title {
  margin: 0;
  flex: 1;
}

.btn-save-order {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--green-hi);
  background: rgba(106,184,122,.08);
  border: 1px solid rgba(106,184,122,.3);
  border-radius: 2px;
  padding: .35rem .85rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  display: none;
}
.btn-save-order:hover { background: rgba(106,184,122,.18); border-color: var(--green-hi); }
.btn-save-order.visible { display: block; }
.btn-save-order:disabled { opacity: .4; cursor: not-allowed; }

.entries-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 2rem; }

.entry-row {
  display: flex;
  align-items: center;
  gap: .85rem;
  padding: .6rem .85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  transition: border-color .15s, opacity .15s, box-shadow .15s;
}
.entry-row:hover { border-color: var(--border2); }
.entry-row.dragging { opacity: .4; }
.entry-row.drag-over { border-color: var(--red); box-shadow: 0 -1px 0 var(--red); }

.entry-drag-handle {
  flex-shrink: 0;
  cursor: grab;
  color: var(--text-dim);
  font-size: 1rem;
  line-height: 1;
  padding: 0 2px;
  user-select: none;
}
.entry-drag-handle:active { cursor: grabbing; }

.entry-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid var(--border2);
  flex-shrink: 0;
  background: var(--surface2);
}
.entry-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-hi);
  flex: 1;
}
.entry-type {
  font-family: 'DM Sans', sans-serif;
  font-size: .62rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: .1em;
}
.entry-edit {
  font-family: 'DM Sans', sans-serif;
  font-size: .7rem;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--border2);
  border-radius: 2px;
  padding: .25rem .6rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.entry-edit:hover { border-color: var(--red-dim); color: var(--red-hi); }

.order-hint {
  font-family: 'DM Sans', sans-serif;
  font-size: .65rem;
  color: var(--text-dim);
  text-align: center;
  margin-top: .75rem;
  display: none;
}
.order-hint.visible { display: block; }

.entries-empty {
  font-family: 'DM Sans', sans-serif;
  font-size: .8rem;
  color: var(--text-dim);
  padding: 1rem .85rem;
  border: 1px dashed var(--border);
  border-radius: 2px;
}
</style>
</head>
<body>

<header>
  <div class="header-eyebrow" id="page-subtitle">Персонажи и персоны</div>
  <a href="/" class="logo">TasteID</a>
  <div class="header-deco">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</header>

<main>

  <div class="edit-banner" id="edit-banner" style="display:none">
    <div>✦ Режим редактирования — <span class="edit-banner-title" id="edit-name-hint"></span></div>
    <button class="btn-new" onclick="resetToNew()">+ Новая запись</button>
  </div>

  <h2 class="section-title">Основное</h2>
  <div class="grid">
    <div class="field">
      <label>Имя *</label>
      <input type="text" id="f-name" placeholder="Kaneki Ken">
    </div>
    <div class="field">
      <label>Тип</label>
      <div class="select-wrap">
        <select id="f-type" onchange="onTypeChange()">
          <option value="character">Персонаж</option>
          <option value="person">Персона</option>
        </select>
      </div>
    </div>
    <div class="field full field-subtype" id="field-subtype">
      <label>Роль персоны</label>
      <div class="select-wrap">
        <select id="f-subtype">
          <option value="actor">Актёр</option>
          <option value="director">Режиссёр</option>
          <option value="author">Автор</option>
          <option value="seiyuu">Сэйю</option>
          <option value="artist">Художник</option>
          <option value="composer">Композитор</option>
        </select>
      </div>
    </div>
    <div class="field full">
      <label>Ссылка на изображение</label>
      <input type="text" id="f-image" placeholder="https://..." oninput="previewAvatar(this.value)">
      <img id="avatar-img" class="avatar-preview">
    </div>
    <div class="field full">
      <label>Из чего (необязательно)</label>
      <input type="text" id="f-from" placeholder="Tokyo Ghoul">
    </div>
  </div>

  <div class="divider"></div>
  <button class="btn-save" id="btn-save" onclick="saveEntry()">Сохранить</button>
  <div class="status-msg" id="status"></div>

  <div class="list-header" id="list-header" style="display:none">
    <div class="divider-title">Персонажи</div>
    <button class="btn-save-order" id="btn-save-order" onclick="saveOrder()">✦ Сохранить порядок</button>
  </div>
  <div class="entries-list" id="entries-list-character"></div>

  <div class="divider-title" id="persons-title" style="display:none">Персоны</div>
  <div class="entries-list" id="entries-list-person"></div>

  <div class="order-hint" id="order-hint">Перетащи за ⠿, чтобы изменить порядок, затем нажми «Сохранить порядок»</div>

</main>

<script>
let editingId  = null;
let allEntries = [];   // все записи как есть (для поиска при редактировании)
let charList   = [];   // текущий порядок персонажей
let personList = [];   // текущий порядок персон
let orderDirty = false;
let dragSrc    = null; // DOM-элемент, который сейчас тащим

const SUBTYPE_LABELS = {
  actor: "Актёр", director: "Режиссёр", author: "Автор",
  seiyuu: "Сэйю", artist: "Художник", composer: "Композитор"
};

function onTypeChange() {
  const isPerson = document.getElementById("f-type").value === "person";
  document.getElementById("field-subtype").classList.toggle("visible", isPerson);
}

function previewAvatar(url) {
  const img = document.getElementById("avatar-img");
  if (url && url.startsWith("http")) { img.src = url; img.style.display = "block"; }
  else img.style.display = "none";
}

function setStatus(type, text) {
  const el = document.getElementById("status");
  el.className = "status-msg" + (type ? " " + type : "");
  el.textContent = text;
}

function resetToNew() {
  editingId = null;
  document.getElementById("edit-banner").style.display = "none";
  document.getElementById("page-subtitle").textContent = "Персонажи и персоны";
  document.getElementById("btn-save").textContent = "Сохранить";
  history.replaceState(null, "", "favorites-edit.html");
  ["f-name","f-image","f-from"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-type").value = "character";
  document.getElementById("f-subtype").value = "actor";
  document.getElementById("avatar-img").style.display = "none";
  document.getElementById("field-subtype").classList.remove("visible");
  setStatus("", "");
}

function fillForm(r) {
  document.getElementById("f-name").value    = r.name    || "";
  document.getElementById("f-image").value   = r.image   || "";
  document.getElementById("f-from").value    = r.from    || "";
  document.getElementById("f-type").value    = r.type    || "character";
  document.getElementById("f-subtype").value = r.subtype || "actor";
  previewAvatar(r.image || "");
  onTypeChange();
}

// ── Рендер одного из двух списков (персонажи / персоны) ──
function renderGroup(type, list) {
  const container = document.getElementById(`entries-list-${type}`);
  if (!list.length) {
    container.innerHTML = `<div class="entries-empty">Пока пусто</div>`;
    return;
  }
  container.innerHTML = list.map((r) => {
    const typeLabel = r.type === "person"
      ? (SUBTYPE_LABELS[r.subtype] || "Персона")
      : "Персонаж";
    return `
    <div class="entry-row" data-id="${r.id}" data-group="${type}" draggable="true">
      <span class="entry-drag-handle" title="Перетащить">⠿</span>
      <img class="entry-avatar" src="${esc(r.image || "")}" onerror="this.style.display='none'" alt="">
      <div class="entry-name">${esc(r.name)}</div>
      ${r.from ? `<div class="entry-type">${esc(r.from)}</div>` : ""}
      <div class="entry-type">${esc(typeLabel)}</div>
      <button class="entry-edit" onclick="startEdit(${r.id})">✎ Изменить</button>
    </div>`;
  }).join("");
  bindDnd(container);
}

function renderList() {
  renderGroup("character", charList);
  renderGroup("person", personList);

  document.getElementById("persons-title").style.display = personList.length || charList.length ? "flex" : "none";

  const btn = document.getElementById("btn-save-order");
  const hint = document.getElementById("order-hint");
  btn.classList.toggle("visible", orderDirty);
  hint.classList.toggle("visible", (charList.length + personList.length) > 1);
}

// ── Drag-and-drop внутри одного списка (персонажи ИЛИ персоны — раздельно) ──
function bindDnd(container) {
  container.querySelectorAll(".entry-row").forEach(row => {
    row.addEventListener("dragstart", (e) => {
      dragSrc = row;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    row.addEventListener("dragend", () => {
      container.querySelectorAll(".entry-row").forEach(el => el.classList.remove("dragging", "drag-over"));
      dragSrc = null;
    });
    row.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!dragSrc || row === dragSrc || row.dataset.group !== dragSrc.dataset.group) return;
      container.querySelectorAll(".entry-row").forEach(el => el.classList.remove("drag-over"));
      row.classList.add("drag-over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-over"));
    row.addEventListener("drop", (e) => {
      e.preventDefault();
      row.classList.remove("drag-over");
      if (!dragSrc || row === dragSrc || row.dataset.group !== dragSrc.dataset.group) return;

      const group = row.dataset.group;
      const list  = group === "character" ? charList : personList;
      const srcId = Number(dragSrc.dataset.id);
      const targetId = Number(row.dataset.id);
      const srcIdx = list.findIndex(r => r.id === srcId);
      let targetIdx = list.findIndex(r => r.id === targetId);
      if (srcIdx === -1 || targetIdx === -1) return;

      const rect = row.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;

      const [moved] = list.splice(srcIdx, 1);
      targetIdx = list.findIndex(r => r.id === targetId);
      list.splice(before ? targetIdx : targetIdx + 1, 0, moved);

      orderDirty = true;
      renderList();
    });
  });
}

async function loadList() {
  try {
    const res = await fetch("/favorites.json?_=" + Date.now());
    if (!res.ok) return;
    const data = await res.json();
    if (!data.length) return;

    allEntries = data;
    charList   = data.filter(r => r.type === "character");
    personList = data.filter(r => r.type === "person");
    orderDirty = false;
    document.getElementById("list-header").style.display = "flex";
    renderList();
  } catch {}
}

async function startEdit(id) {
  const entry = allEntries.find(r => r.id === id);
  if (!entry) return;
  editingId = entry.id;
  fillForm(entry);
  document.getElementById("edit-banner").style.display = "flex";
  document.getElementById("edit-name-hint").textContent = entry.name;
  document.getElementById("page-subtitle").textContent = "Редактировать запись";
  document.getElementById("btn-save").textContent = "Сохранить изменения";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ── Сохранить порядок (обеих групп сразу) ───────
async function saveOrder() {
  const btn = document.getElementById("btn-save-order");
  btn.disabled = true;
  btn.textContent = "Сохраняем…";

  const newOrder = [...charList, ...personList].map(r => r.id);

  try {
    const res  = await fetch("/api/save-favorite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ _reorder: newOrder }),
    });
    const data = await res.json();
    if (res.ok) {
      orderDirty = false;
      btn.classList.remove("visible");
      document.getElementById("order-hint").classList.remove("visible");
      setStatus("ok", "✦ Порядок сохранён. Сайт обновится через ~30 секунд.");
    } else {
      setStatus("err", "Ошибка: " + (data.error || "неизвестная"));
    }
  } catch (e) {
    setStatus("err", "Ошибка сети: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = "✦ Сохранить порядок";
}

async function saveEntry() {
  const btn  = document.getElementById("btn-save");
  const name = document.getElementById("f-name").value.trim();
  if (!name) { setStatus("err", "Заполни имя"); return; }

  const type = document.getElementById("f-type").value;
  const entry = {
    name,
    type,
    image: document.getElementById("f-image").value.trim() || null,
    from:  document.getElementById("f-from").value.trim()  || null,
  };
  if (type === "person") {
    entry.subtype = document.getElementById("f-subtype").value || null;
  }
  if (editingId !== null) entry._editId = editingId;

  btn.disabled = true;
  btn.textContent = "Сохраняем…";
  setStatus("", "");

  try {
    const res  = await fetch("/api/save-favorite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify(entry),
    });
    const data = await res.json();
    if (res.ok) {
      setStatus("ok", editingId !== null
        ? `✦ «${name}» обновлён. Сайт обновится через ~30 секунд.`
        : `✦ «${name}» сохранён. Сайт обновится через ~30 секунд.`);
      if (editingId === null) resetToNew();
      setTimeout(loadList, 2000);
    } else {
      setStatus("err", "Ошибка: " + (data.error || "неизвестная"));
    }
  } catch (e) {
    setStatus("err", "Ошибка сети: " + e.message);
  }

  btn.disabled = false;
  btn.textContent = editingId !== null ? "Сохранить изменения" : "Сохранить";
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

loadList();
</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="js/backup.js"></script>
</body>
</html>
