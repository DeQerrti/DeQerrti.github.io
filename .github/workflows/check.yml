name: Проверки

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Форматирование
        run: npm run format:check

      # Самая полезная проверка для этого репозитория: данные правит и
      # админка через GitHub API, и человек руками — здесь ловится битый
      # JSON, дублирующиеся id отзывов и ссылки на несуществующие картинки.
      - name: Данные
        run: npm run check:json

      # Ловит страницы, ссылающиеся на несуществующие стили/скрипты,
      # и расхождения в версионном суффиксе ?v=N между страницами.
      - name: Ссылки на файлы
        run: npm run check:assets
